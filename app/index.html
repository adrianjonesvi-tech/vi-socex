                  {qType === "ranking" && (
                    <div>
                      <div style={{ fontSize: 11, color: C.inkMuted, fontWeight: 600, marginBottom: 4 }}>Items to rank</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                        {(q.items || []).map((item, ii) => (
                          <div key={ii} style={{ display: "flex", gap: 6 }}>
                            <input value={item} onChange={e => updateItem(gi, qi, ii, e.target.value)} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder={`Item ${ii + 1}`} />
                            <DeleteButton onDelete={() => removeItem(gi, qi, ii)} itemName="this item" iconName="x" size={13} />

                        ))}
                        <button onClick={() => addItem(gi, qi)} style={{ alignSelf: "flex-start", background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "4px 10px", borderRadius: 5, fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>+ Add item</button>
                      </div>
                      <input type="number" min="1" value={q.rankCount || ""} onChange={e => updateQuestion(gi, qi, { rankCount: e.target.value ? Number(e.target.value) : null })} style={{ ...inputStyle, width: 180, fontSize: 11.5 }} placeholder="How many to rank, e.g. 3" />
                    </div>
                  )}
                </div>
              );})}
            </div>
            <button onClick={() => addQuestion(gi)} style={{ marginTop: 10, background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>+ Add question</button>

function QuestionnaireAiAssist({ onGenerated, onCancel, products }) {
  const [purpose, setPurpose] = useState("");
  const [audienceType, setAudienceType] = useState("external");
  const [mode, setMode] = useState("survey");
  const [productIds, setProductIds] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [docText, setDocText] = useState("");
  const [docLabel, setDocLabel] = useState("");
  const [docLoading, setDocLoading] = useState(false);
  const [docError, setDocError] = useState("");
  const docInputRef = React.useRef(null);

  function toggleProduct(id) { setProductIds(prev => prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id]); }

  async function handleDocUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setDocError(""); setDocLoading(true);
    try {
      const text = await processUploadedFileShared(file);
      setDocText(text);
      setDocLabel(file.name);
    } catch (err) {
      setDocError(err.message || "Couldn't read that file.");
    }
    setDocLoading(false);
    if (docInputRef.current) docInputRef.current.value = "";
  }

  async function generate() {
    if (!purpose.trim()) { setError("Describe what this questionnaire is for first."); return; }
    setError(""); setLoading(true);
    try {
      const linkedProducts = products.filter(p => productIds.includes(p.id));
      const data = await apiGenerate("questionnaire_wizard", { purpose: purpose.trim(), audienceType, mode, products: linkedProducts, documentContext: docText });
      const groups = (data.groups || []).map(g => ({
        id: uid(), name: g.name || "", guidance: g.guidance || "",
        questions: (g.questions || []).map(q => {
          const qType = ["single", "multi", "text", "matrix", "ranking"].includes(q.type) ? q.type : "single";
          const rawOptions = (q.options || []).filter(Boolean);
          const options = qType === "single" ? [...rawOptions.slice(0, 3), "N/A"] : qType === "multi" ? rawOptions : [];
          const rawItems = (q.items_ || []).filter(Boolean);
          const rawScale = (q.scaleLabels || []).filter(Boolean);
          return {
            id: uid(), topic: q.topic || "", text: q.text || "", type: qType, options,
            maxSelections: qType === "multi" ? (q.maxSelections || null) : null,
            advice: qType === "single" ? (q.advice || ["", "", ""]).slice(0, 3) : ["", "", ""],
            items: (qType === "matrix" || qType === "ranking") ? rawItems : [],
            scaleLabels: qType === "matrix" ? (rawScale.length >= 2 ? rawScale : ["Low", "Medium", "High"]) : [],
            rankCount: qType === "ranking" ? (q.rankCount || Math.min(3, rawItems.length)) : null,
          };
        }),
      }));
      onGenerated({
        name: data.name || "", short: data.short || (data.name || "").slice(0, 20), audienceType, mode,
        color: audienceType === "internal" ? C.indigo : C.cyan, description: data.description || "",
        groups: groups.length ? groups : [emptyGroupDraft()], productIds,
        completionMessage: "Thank you for taking part — your involvement and responses will be collated and published as a collective set of results.",
        ctaMessage: "Did you find these results useful? If you'd like to talk through next steps, we're happy to help.",
        ctaButtonLabel: "Get in touch",
      });
    } catch (err) {
      setError(err.message || "Couldn't generate a questionnaire — the AI engine may be unavailable.");
    }
    setLoading(false);
  }

  return (
    <div style={{ maxWidth: 560, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22, marginBottom: 24 }}>
      <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 18 }}>Describe what you're trying to find out, and Vi-SOCEX's AI engine will draft a complete questionnaire — topic groups, questions, and answer options — which you can then review, edit, or delete anything before creating it.</div>
      <Field label="What is this questionnaire for?">
        <textarea value={purpose} onChange={e => setPurpose(e.target.value)} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="e.g. Understand why customers cancel their subscription in the first 3 months" />
      </Field>
      <div style={{ marginTop: 14 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Supporting document (optional)</label>
        <input ref={docInputRef} type="file" accept={FILE_UPLOAD_ACCEPT} onChange={handleDocUpload} style={{ display: "none" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => docInputRef.current && docInputRef.current.click()} disabled={docLoading}
            style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: docLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={docLoading ? "loader-2" : "package"} size={13} className={docLoading ? "spin" : ""} />
            {docLoading ? "Reading file…" : "Upload a document"}
          </button>
          <span style={{ fontSize: 11, color: C.inkFaint }}>{FILE_UPLOAD_HINT}</span>
        </div>
        {docError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 6 }}>{docError}</div>}
        {docText && !docLoading && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>
            <span style={{ fontSize: 12, color: C.teal }}>Added: {docLabel}</span>
            <button onClick={() => { setDocText(""); setDocLabel(""); }} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}>Remove</button>
          </div>
        )}
        <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>A research brief, past survey, customer feedback doc, or spreadsheet of issues — the AI will ground the questions in what it actually says.</div>
      </div>
      <div style={{ marginTop: 12 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Who answers this?</label>
        <select value={audienceType} onChange={e => setAudienceType(e.target.value)} style={{ ...inputStyle, width: "100%" }}>
          <option value="external">External (customers / prospects)</option>
          <option value="internal">Internal (staff, by org level)</option>
        </select>
      </div>
      <div style={{ marginTop: 12 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Type</label>
        <select value={mode} onChange={e => setMode(e.target.value)} style={{ ...inputStyle, width: "100%" }}>
          <option value="survey">Survey — only you see the results</option>
          <option value="selfAssessment">Self-assessment — respondent sees their own guidance as they answer</option>
        </select>
        {mode === "selfAssessment" && (
          <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>Use this when the respondent is assessing their own business or practice, like the StandardiziT-style survey — they'll see advice for each answer they pick, not just you.</div>
        )}
      </div>
      {products && products.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Related products or services (optional)</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {products.map(p => {
              const active = productIds.includes(p.id);
              return (
                <button key={p.id} onClick={() => toggleProduct(p.id)} style={{
                  padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                  border: active ? `1px solid ${C.lime}` : `1px solid ${C.border}`,
                  background: active ? `${C.lime}22` : "transparent", color: active ? C.ink : C.inkMuted }}>
                  {p.name}
                </button>
              );
            })}
          </div>
          <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>AI will shape questions to reveal whether these genuinely meet the need, where relevant.</div>
        </div>
      )}
      {error && <div style={{ fontSize: 12.5, color: "#E5484D", marginTop: 14 }}>{error}</div>}
      <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
        <button onClick={generate} disabled={loading} style={{ background: C.lime, color: "#1A2E05", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: loading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8, opacity: loading ? 0.7 : 1 }}>
          <Icon name={loading ? "loader-2" : "pen-square"} size={14} className={loading ? "spin" : ""} />
          {loading ? "Designing your questionnaire…" : "Generate questionnaire"}
        </button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Cancel</button>
      </div>
    </div>
  );
}

function QuestionnairesView({ templates, addTemplate, updateTemplate, deleteTemplate, questionnaireSubmissions, addQuestionnaireSubmission, questionnaireSends, addQuestionnaireSend, updateQuestionnaireSend, connections, leads, brand, setBrand, products, tenantId, contacts, companies }) {
  const [templateId, setTemplateId] = useState(templates[0] ? templates[0].id : "");
  const [flow, setFlow] = useState(null); // null | "choose" | "ai" | "builder"
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(emptyTemplateDraft());
  const template = templates.find(t => t.id === templateId);
  const submissions = questionnaireSubmissions.filter(s => s.templateId === templateId);
  const showBuilder = flow === "builder";

  function openNew() { setDraft(emptyTemplateDraft()); setEditingId(null); setFlow("choose"); }
  function openEdit(t) { setDraft(JSON.parse(JSON.stringify({ name: t.name, short: t.short, audienceType: t.audienceType, color: t.color, description: t.description, groups: t.groups, productIds: t.productIds || [] }))); setEditingId(t.id); setFlow("builder"); }
  function save() {
    if (editingId) {
      updateTemplate(editingId, draft);
    } else {
      const id = draft.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || uid();
      const newTemplate = { ...draft, id };
      addTemplate(newTemplate);
      setTemplateId(id);
    }
    setFlow(null);
  }
  function remove(t) {
    deleteTemplate(t.id);
    if (templateId === t.id) setTemplateId(templates.find(x => x.id !== t.id) ? templates.find(x => x.id !== t.id).id : "");
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 20 }}>
        <SectionHeading>Questionnaires</SectionHeading>
        {!flow && (
          <button onClick={openNew} style={{ display: "flex", alignItems: "center", gap: 6, background: C.lime, color: "#1A2E05", border: "none", padding: "9px 16px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            <Icon name="plus" size={15} /> New questionnaire
          </button>
        )}
      </div>
      <PageIntro>Run structured surveys and turn responses into something usable — internal culture data that feeds Brand directly, or customer and concept feedback you can send out to real lists. Every questionnaire here, including the built-in ones, can be edited, extended, or deleted — or start a new one from scratch, or have AI draft one for you.</PageIntro>

      {flow === "choose" && (
        <div style={{ display: "flex", gap: 12, marginBottom: 24 }}>
          <button onClick={() => setFlow("ai")} style={{ background: C.surface, border: `1px solid ${C.lime}`, borderRadius: 10, padding: "18px 22px", textAlign: "left", cursor: "pointer", flex: 1, maxWidth: 280 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}><Icon name="pen-square" size={16} color={C.lime} /><span style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>Generate with AI</span></div>
            <div style={{ fontSize: 12, color: C.inkMuted }}>Describe the purpose — AI drafts groups, questions, and answers to review.</div>
          </button>
          <button onClick={() => setFlow("builder")} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 22px", textAlign: "left", cursor: "pointer", flex: 1, maxWidth: 280 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}><Icon name="pencil" size={16} color={C.inkMuted} /><span style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>Start from scratch</span></div>
            <div style={{ fontSize: 12, color: C.inkMuted }}>Build every topic group and question yourself.</div>
          </button>
        </div>
      )}

      {flow === "ai" && (
        <QuestionnaireAiAssist products={products} onCancel={() => setFlow(null)} onGenerated={result => { setDraft(result); setFlow("builder"); }} />
      )}

      {showBuilder ? (
        <QuestionnaireBuilder draft={draft} setDraft={setDraft} onCancel={() => setFlow(null)} onSave={save} isEdit={!!editingId} products={products} />
      ) : flow !== "choose" && flow !== "ai" && (
        <React.Fragment>
          <div style={{ display: "flex", gap: 8, marginBottom: 24, flexWrap: "wrap" }}>
            {templates.map(t => (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 2 }}>
                <button onClick={() => setTemplateId(t.id)} style={{
                  padding: "8px 14px", borderRadius: "7px 0 0 7px", fontSize: 13, fontWeight: 600, cursor: "pointer",
                  border: templateId === t.id ? `1px solid ${t.color}` : `1px solid ${C.border}`,
                  background: templateId === t.id ? `${t.color}22` : "transparent", color: templateId === t.id ? C.ink : C.inkMuted }}>
                  {t.short}
                </button>
                <button onClick={() => openEdit(t)} title="Edit" style={{
                  padding: "8px 8px", fontSize: 13, cursor: "pointer",
                  border: templateId === t.id ? `1px solid ${t.color}` : `1px solid ${C.border}`, borderLeft: "none",
                  background: templateId === t.id ? `${t.color}22` : "transparent", color: C.inkMuted }}>
                  <Icon name="pencil" size={12} />
                </button>
                <DeleteButton onDelete={() => remove(t)} itemName={t.short || t.name} message="This can't be undone — all responses collected for this questionnaire will be deleted too." style={{
                  padding: "8px 8px", borderRadius: "0 7px 7px 0",
                  border: templateId === t.id ? `1px solid ${t.color}` : `1px solid ${C.border}`, borderLeft: "none",
                  background: templateId === t.id ? `${t.color}22` : "transparent" }} size={12} />
              </div>
            ))}
          </div>
          {template ? (
            <QuestionnaireTemplateView
              template={template}
              submissions={submissions}
              sends={questionnaireSends}
              connections={connections}
              leads={leads}
              brand={brand}
              setBrand={setBrand}
              addSubmission={addQuestionnaireSubmission}
              addSend={addQuestionnaireSend}
              updateSend={updateQuestionnaireSend}
              products={products}
              tenantId={tenantId}
              contacts={contacts}
              companies={companies}
            />
          ) : (
            <div style={{ padding: "20px 0", color: C.inkMuted, fontSize: 14 }}>No questionnaires yet — create one to get started.</div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

const emptyWizardAnswers = { name: "", description: "", personality: [], vibe: "", avoid: "" };
const VIBE_OPTIONS = ["Modern & Minimal", "Bold & Energetic", "Warm & Approachable", "Premium & Elegant", "Playful & Fun", "Trustworthy & Professional"];

function useGoogleFontLoader(fontNames) {
  useEffect(() => {
    const names = (fontNames || []).filter(Boolean);
    if (names.length === 0) return;
    const family = names.map(n => `family=${encodeURIComponent(n)}:wght@400;600;700`).join("&");
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `https://fonts.googleapis.com/css2?${family}&display=swap`;
    document.head.appendChild(link);
    return () => { document.head.removeChild(link); };
  }, [JSON.stringify(fontNames)]);
}

function BrandWizard({ brand, setBrand }) {
  const [step, setStep] = useState("questions");
  const [answers, setAnswers] = useState(emptyWizardAnswers);
  const [newWord, setNewWord] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [applied, setApplied] = useState(false);

  useGoogleFontLoader(result ? [result.headingFont, result.bodyFont] : []);

  function addWord() {
    if (!newWord.trim() || answers.personality.length >= 3) return;
    setAnswers({ ...answers, personality: [...answers.personality, newWord.trim()] });
    setNewWord("");
  }
  function removeWord(i) { setAnswers({ ...answers, personality: answers.personality.filter((_, idx) => idx !== i) }); }

  async function generate() {
    if (!answers.name.trim() || !answers.description.trim() || !answers.vibe) {
      setError("Business name, description, and a preferred style are required.");
      return;
    }
    setError(""); setLoading(true); setApplied(false);
    try {
      const data = await apiGenerate("brand_wizard", { answers });
      setResult(data);
      setStep("result");
    } catch (err) {
      setError(err.message || "Couldn't generate a brand proposal — the AI engine may be unavailable. Try again shortly.");
    }
    setLoading(false);
  }

  function applyToBrand() {
    setBrand({
      ...brand,
      colors: [...brand.colors, ...result.colors.filter(c => !brand.colors.some(existing => existing.hex.toLowerCase() === c.hex.toLowerCase()))],
      headingFont: result.headingFont || brand.headingFont,
      bodyFont: result.bodyFont || brand.bodyFont,
      tone: brand.tone || result.tone,
      rules: [...brand.rules, ...result.rules],
    });
    setApplied(true);
  }

  if (step === "questions") {
    return (
      <div style={{ maxWidth: 560, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22 }}>
        <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 18 }}>Answer a few questions and Vi-SOCEX's AI engine will propose a full starter identity — colors, fonts, voice, rules, and logo direction.</div>
        <Field label="Business name"><input value={answers.name} onChange={e => setAnswers({ ...answers, name: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Rewards+" /></Field>
        <div style={{ marginTop: 12 }}>
          <Field label="What you do, and who you serve"><textarea value={answers.description} onChange={e => setAnswers({ ...answers, description: e.target.value })} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="e.g. A loyalty app for independent retailers, helping small shops compete with big chains." /></Field>
        </div>
        <div style={{ marginTop: 12 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Three words for the brand personality (optional)</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
            {answers.personality.map((w, i) => (
              <span key={i} style={{ display: "flex", alignItems: "center", gap: 6, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 16, padding: "4px 10px", fontSize: 12.5 }}>
                {w} <DeleteButton onDelete={() => removeWord(i)} itemName={w} iconName="x" style={{ padding: 0, display: "flex" }} size={11} />
              </span>
            ))}
          </div>
          {answers.personality.length < 3 && (
            <div style={{ display: "flex", gap: 8 }}>
              <input value={newWord} onChange={e => setNewWord(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="e.g. Confident"
                onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addWord(); } }} />
              <button onClick={addWord} style={{ background: "none", border: `1px solid ${C.border}`, padding: "0 14px", borderRadius: 6, color: C.ink, cursor: "pointer" }}>Add</button>
            </div>
          )}
        </div>
        <div style={{ marginTop: 12 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Preferred style</label>
          <select value={answers.vibe} onChange={e => setAnswers({ ...answers, vibe: e.target.value })} style={{ ...inputStyle, width: "100%" }}>
            <option value="">Select one…</option>
            {VIBE_OPTIONS.map(v => <option key={v} value={v}>{v}</option>)}
          </select>
        </div>
        <div style={{ marginTop: 12 }}>
          <Field label="Anything to avoid (optional)"><input value={answers.avoid} onChange={e => setAnswers({ ...answers, avoid: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Feeling too corporate, bright neon colors" /></Field>
        </div>
        {error && <div style={{ fontSize: 12.5, color: "#E5484D", marginTop: 14 }}>{error}</div>}
        <button onClick={generate} disabled={loading} style={{ marginTop: 18, background: C.indigo, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: loading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8, opacity: loading ? 0.7 : 1 }}>
          <Icon name={loading ? "loader-2" : "palette"} size={14} className={loading ? "spin" : ""} />
          {loading ? "Designing your brand…" : "Generate brand proposal"}
        </button>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640 }}>
      <button onClick={() => setStep("questions")} style={{ background: "none", border: "none", color: C.inkMuted, cursor: "pointer", fontSize: 12.5, marginBottom: 16, display: "flex", alignItems: "center", gap: 4 }}>
        ← Back to questions
      </button>

      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Proposed colors</h3>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 24 }}>
        {result.colors.map((c, i) => (
          <div key={i} style={{ width: 100, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, overflow: "hidden" }}>
            <div style={{ height: 50, background: c.hex }}></div>
            <div style={{ padding: "6px 8px" }}>
              <div style={{ fontSize: 11.5, fontWeight: 600 }}>{c.name}</div>
              <div style={{ fontSize: 10.5, color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{c.hex}</div>
            </div>
          </div>
        ))}
      </div>

      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Proposed typography</h3>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 18, marginBottom: 24 }}>
        <div style={{ fontSize: 24, fontWeight: 700, fontFamily: `'${result.headingFont}', sans-serif` }}>{answers.name || "Your Business"}</div>
        <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 12 }}>Heading font: {result.headingFont}</div>
        <div style={{ fontSize: 14, fontFamily: `'${result.bodyFont}', sans-serif`, color: C.inkMuted, lineHeight: 1.6 }}>The quick brown fox jumps over the lazy dog — this is what body text looks like in {result.bodyFont}.</div>
        <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 6 }}>Body font: {result.bodyFont}</div>
      </div>

      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Tone of voice</h3>
      <div style={{ fontSize: 13.5, color: C.inkMuted, marginBottom: 24, lineHeight: 1.6 }}>{result.tone}</div>

      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Brand rules</h3>
      <ul style={{ margin: "0 0 24px", paddingLeft: 18 }}>
        {result.rules.map((r, i) => <li key={i} style={{ fontSize: 13, color: C.inkMuted, marginBottom: 6 }}>{r}</li>)}
      </ul>

      {result.logoStyle && (
        <React.Fragment>
          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Logo direction</h3>
          <div style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 8 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: C.indigo, marginBottom: 6 }}>{result.logoStyle.direction}</div>
            <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 8 }}>{result.logoStyle.rationale}</div>
            <div style={{ fontSize: 12.5, color: C.inkFaint }}>{result.logoStyle.notes}</div>
          </div>
          <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 24 }}>This is style guidance for a designer, not an actual logo — Vi-SOCEX doesn't generate logo artwork.</div>
        </React.Fragment>
      )}

      <button onClick={applyToBrand} disabled={applied} style={{ background: C.indigo, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: applied ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8, opacity: applied ? 0.7 : 1 }}>
        <Icon name={applied ? "check" : "plus"} size={14} />
        {applied ? "Applied to Brand Guidelines" : "Apply colors, fonts, tone & rules to Brand"}
      </button>
    </div>
  );
}

function BrandView({ brand, setBrand }) {
  const [mode, setMode] = useState("guidelines");
  return (
    <div>
      <SectionHeading>Brand</SectionHeading>
      <PageIntro>Store your brand guidelines here — logo, colors, fonts, voice, and rules — so everything Vi-SOCEX produces stays on-brand. Already have brand docs? Upload and extract them under My Guidelines. Starting from scratch? Try the Brand Wizard.</PageIntro>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <ModeButton active={mode === "guidelines"} onClick={() => setMode("guidelines")}>My Guidelines</ModeButton>
        <ModeButton active={mode === "wizard"} onClick={() => setMode("wizard")}>Brand Wizard</ModeButton>
      </div>
      {mode === "guidelines" ? (
        <BrandGuidelinesPanel brand={brand} setBrand={setBrand} />
      ) : (
        <BrandWizard brand={brand} setBrand={setBrand} />
      )}
    </div>
  );
}

function CompanyInfoView({ companyInfo, setCompanyInfo, setTab, setPendingTopic }) {
  const [overviewLoading, setOverviewLoading] = useState(false);
  const [overviewError, setOverviewError] = useState("");
  const [overviewJustUpdated, setOverviewJustUpdated] = useState(false);
  const fingerprint = JSON.stringify({
    sources: (companyInfo.sources || []).map(s => s.text),
    faqs: companyInfo.faqs, locations: companyInfo.locations, people: companyInfo.people,
    history: companyInfo.history, tagline: companyInfo.tagline, founded: companyInfo.founded,
    contactEmail: companyInfo.contactEmail, contactPhone: companyInfo.contactPhone,
  });

  async function regenerateOverview() {
    const combinedText = (companyInfo.sources || []).map(s => s.text).filter(Boolean).join("\n\n---\n\n");
    if (!combinedText.trim()) { setOverviewError("Add some reference documents first."); return; }
    setOverviewError(""); setOverviewLoading(true); setOverviewJustUpdated(false);
    try {
      const data = await generateEntityOverviewData(combinedText, companyInfo.name || "the company", "company");
      setCompanyInfo({ ...companyInfo, aiOverview: { ...data, generatedDate: todayISO(), sourceCount: (companyInfo.sources || []).length, fingerprint } });
      setOverviewJustUpdated(true);
    } catch (err) {
      setOverviewError(err.message || "Couldn't generate an overview right now.");
    }
    setOverviewLoading(false);
  }

  function draftSuggestionInStudio(suggestion) {
    if (setPendingTopic && setTab) { setPendingTopic(suggestion); setTab("studio"); }
  }

  return (
    <div>
      <SectionHeading>Company Info</SectionHeading>
      <PageIntro>Store company-wide facts here — about/history, locations, people, contact details, and FAQs — separate from individual products. Studio and any general "about us" content can draw on this directly.</PageIntro>
      <AiOverviewPanel sources={companyInfo.sources} aiOverview={companyInfo.aiOverview} fingerprint={fingerprint} loading={overviewLoading} error={overviewError} justUpdated={overviewJustUpdated} onRegenerate={regenerateOverview} onDraftSuggestion={draftSuggestionInStudio} />
      <CompanyInfoPanel companyInfo={companyInfo} setCompanyInfo={setCompanyInfo} onOverviewRegenerate={regenerateOverview} />
    </div>
  );
}

function CompanyInfoPanel({ companyInfo, setCompanyInfo, onOverviewRegenerate }) {
  const [raw, setRaw] = useState("");
  const [sourceLabels, setSourceLabels] = useState([]);
  const [websiteUrl, setWebsiteUrl] = useState("");
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const [scanWarning, setScanWarning] = useState("");
  const [extracting, setExtracting] = useState(false);
  const [extractNote, setExtractNote] = useState("");
  const [extractError, setExtractError] = useState("");
  const [fileLoading, setFileLoading] = useState(false);
  const [fileError, setFileError] = useState("");
  const [expandedSource, setExpandedSource] = useState(null);
  const [newLocation, setNewLocation] = useState({ label: "", address: "" });
  const [newPerson, setNewPerson] = useState({ name: "", role: "" });
  const [newFaq, setNewFaq] = useState({ question: "", answer: "" });
  const fileInputRef = React.useRef(null);
  const sources = companyInfo.sources || [];
  const locations = companyInfo.locations || [];
  const people = companyInfo.people || [];
  const faqs = companyInfo.faqs || [];

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setFileLoading(true);
    try {
      const text = await processUploadedFileShared(file);
      setRaw(prev => prev ? `${prev}\n\n${text}` : text);
      setSourceLabels(prev => [...prev, file.name]);
    } catch (err) {
      setFileError(err.message || "Couldn't read that file.");
    }
    setFileLoading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  async function scanWebsite() {
    if (!websiteUrl.trim()) return;
    setScanning(true); setScanError(""); setScanWarning("");
    try {
      const data = await apiScanWebsite(websiteUrl.trim());
      const combined = [data.title, data.description, data.text].filter(Boolean).join("\n\n");
      setRaw(prev => prev ? `${prev}\n\n${combined}` : combined);
      setSourceLabels(prev => [...prev, websiteUrl.trim()]);
      if (data.warning) setScanWarning(data.warning);
    } catch (err) {
      setScanError(err.message || "Couldn't scan that website.");
    }
    setScanning(false);
  }

  async function runExtract() {
    if (!raw.trim()) return;
    setExtracting(true); setExtractNote(""); setExtractError("");
    try {
      const data = await apiGenerate("company_extract", { text: raw });
      const newLocations = (data.locations || []).filter(l => !locations.some(existing => existing.label === l.label && existing.address === l.address));
      const newPeople = (data.people || []).filter(p => !people.some(existing => existing.name === p.name));
      const newFaqs = (data.faqs || []).filter(f => !faqs.some(existing => existing.question === f.question));
      const labels = sourceLabels.length ? sourceLabels : ["Pasted text"];
      const combinedLabel = labels.join(" + ");
      const sourceType = labels.length > 1 ? "mixed" : (labels[0].match(/^https?:\/\//) ? "website" : (labels[0] === "Pasted text" ? "paste" : "file"));
      const newSource = { id: uid(), type: sourceType, label: combinedLabel, date: todayISO(), text: raw.slice(0, 4000) };
      setCompanyInfo({
        ...companyInfo,
        tagline: companyInfo.tagline || data.tagline || "",
        founded: companyInfo.founded || data.founded || "",
        history: companyInfo.history || data.history || "",
        locations: [...locations, ...newLocations],
        people: [...people, ...newPeople],
        contactEmail: companyInfo.contactEmail || data.contactEmail || "",
        contactPhone: companyInfo.contactPhone || data.contactPhone || "",
        faqs: [...faqs, ...newFaqs],
        sources: [newSource, ...sources],
      });
      const foundAnything = data.tagline || data.founded || data.history || newLocations.length || newPeople.length || newFaqs.length || data.contactEmail || data.contactPhone;
      setExtractNote(foundAnything ? "Read by Vi-SOCEX's AI engine — added what it found below. Review and adjust." : "Couldn't find company details in that text. Fill in the fields below manually.");
      setRaw(""); setSourceLabels([]);
    } catch (err) {
      setExtractError(err.message || "AI engine unavailable right now — try again in a moment, or fill in the fields below manually.");
    }
    setExtracting(false);
  }

  function addLocation() {
    if (!newLocation.label.trim() || !newLocation.address.trim()) return;
    setCompanyInfo({ ...companyInfo, locations: [...locations, { ...newLocation }] });
    setNewLocation({ label: "", address: "" });
  }
  function removeLocation(i) { setCompanyInfo({ ...companyInfo, locations: locations.filter((_, idx) => idx !== i) }); }
  function addPerson() {
    if (!newPerson.name.trim()) return;
    setCompanyInfo({ ...companyInfo, people: [...people, { ...newPerson }] });
    setNewPerson({ name: "", role: "" });
  }
  function removePerson(i) { setCompanyInfo({ ...companyInfo, people: people.filter((_, idx) => idx !== i) }); }
  function addFaq() {
    if (!newFaq.question.trim() || !newFaq.answer.trim()) return;
    setCompanyInfo({ ...companyInfo, faqs: [...faqs, { ...newFaq }] });
    setNewFaq({ question: "", answer: "" });
  }
  function removeFaq(i) { setCompanyInfo({ ...companyInfo, faqs: faqs.filter((_, idx) => idx !== i) }); }
  function removeSource(id) { setCompanyInfo({ ...companyInfo, sources: sources.filter(s => s.id !== id) }); }
  function updateSourceText(id, newText) { setCompanyInfo({ ...companyInfo, sources: sources.map(s => s.id === id ? { ...s, text: newText } : s) }); }

  return (
    <div>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 20, marginBottom: 28 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>Already have an About page or company profile?</div>
        <div style={{ fontSize: 12.5, color: C.inkMuted, marginBottom: 10 }}>Paste text, or upload a file below</div>
        <textarea value={raw} onChange={e => { setRaw(e.target.value); if (sourceLabels.length && !e.target.value.trim()) setSourceLabels([]); }} rows={4} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="Paste text from an About page, company profile, upload a file, or scan a website below…" />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
          <input ref={fileInputRef} type="file" accept={FILE_UPLOAD_ACCEPT} onChange={handleFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={fileLoading}
            style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: fileLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={fileLoading ? "loader-2" : "package"} size={13} className={fileLoading ? "spin" : ""} />
            {fileLoading ? "Reading file…" : "Upload a file"}
          </button>
          <span style={{ fontSize: 11, color: C.inkFaint }}>{FILE_UPLOAD_HINT}</span>
        </div>
        {fileError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 6 }}>{fileError}</div>}
        {sourceLabels.length > 0 && !fileLoading && <div style={{ fontSize: 12, color: C.teal, marginTop: 6 }}>Added text from {sourceLabels[sourceLabels.length - 1]}</div>}

        <div style={{ borderTop: `1px solid ${C.border}`, margin: "16px 0" }} />
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>Or scan an existing website</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input value={websiteUrl} onChange={e => setWebsiteUrl(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="https://yourbusiness.com" />
          <button onClick={scanWebsite} disabled={scanning} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: scanning ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
            <Icon name={scanning ? "loader-2" : "globe"} size={14} className={scanning ? "spin" : ""} />
            {scanning ? "Scanning…" : "Scan site"}
          </button>
        </div>
        {scanError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 6 }}>{scanError}</div>}
        {scanWarning && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 8, lineHeight: 1.5, display: "flex", alignItems: "flex-start", gap: 6 }}><Icon name="alert-triangle" size={12} color={C.amber} />{scanWarning}</div>}

        <button onClick={runExtract} disabled={extracting || !raw.trim()} style={{ marginTop: 16, background: C.purple, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 13.5, fontWeight: 600, cursor: extracting ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name={extracting ? "loader-2" : "pen-square"} size={14} className={extracting ? "spin" : ""} />
          {extracting ? "Extracting…" : "Extract company info"}
        </button>
        {extractNote && <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 8 }}>{extractNote}</div>}
        {extractError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 8 }}>{extractError}</div>}
      </div>

      {sources.length > 0 && (
        <div style={{ marginBottom: 28 }}>
          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Reference files</h3>
          <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 10 }}>Every document, paste, or website scan used to build this profile — kept for reference, not just used once and discarded.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {sources.map(s => (
              <div key={s.id} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Icon name={s.type === "website" ? "globe" : s.type === "paste" ? "pen-square" : "package"} size={13} color={C.inkFaint} />
                  <div style={{ flex: 1, fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.label}</div>
                  <div style={{ fontSize: 10.5, color: C.inkFaint, flexShrink: 0 }}>{formatDate(s.date)}</div>
                  <button onClick={() => setExpandedSource(expandedSource === s.id ? null : s.id)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, flexShrink: 0 }}>
                    <Icon name={expandedSource === s.id ? "chevron-up" : "chevron-down"} size={14} />
                  </button>
                  <DeleteButton onDelete={() => removeSource(s.id)} itemName={s.label || "this source"} iconName="x" style={{ color: C.inkFaint, flexShrink: 0 }} size={13} />
                </div>
                {expandedSource === s.id && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
                    <div style={{ fontSize: 11.5, color: C.inkMuted, lineHeight: 1.5, maxHeight: 180, overflowY: "auto", whiteSpace: "pre-wrap" }}>{s.text}</div>
                    <SourceFixPanel source={s} gaps={(companyInfo.aiOverview && companyInfo.aiOverview.gaps) || []} onUpdateSource={newText => updateSourceText(s.id, newText)} onAfterSave={onOverviewRegenerate} />
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ maxWidth: 640 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>About</h3>
        <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
          <Field label="Company name"><input value={companyInfo.name} onChange={e => setCompanyInfo({ ...companyInfo, name: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Vi-Tech" /></Field>
          <Field label="Founded"><input value={companyInfo.founded} onChange={e => setCompanyInfo({ ...companyInfo, founded: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. 2019" /></Field>
          <Field label="Currency">
            <select value={companyInfo.currency || "£"} onChange={e => setCompanyInfo({ ...companyInfo, currency: e.target.value })} style={{ ...inputStyle, width: "100%" }}>
              {CURRENCY_OPTIONS.map(c => <option key={c.code} value={c.symbol}>{c.label}</option>)}
            </select>
          </Field>
        </div>
        <div style={{ marginBottom: 12 }}>
          <Field label="Tagline"><input value={companyInfo.tagline} onChange={e => setCompanyInfo({ ...companyInfo, tagline: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Brand Leading AI Marketing" /></Field>

const ARTICLE_LENGTHS = [
  { id: "short", label: "Short (~150 words)", paragraphs: 3 },
  { id: "medium", label: "Medium (~400 words)", paragraphs: 5 },
  { id: "long", label: "Long (~700 words)", paragraphs: 7 },
];

function mockArticleTitle(topic) {
  const t = topic.trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function mockArticleParagraphs(topic, tone, count, knowledge, persona) {
  const t = topic.trim().replace(/[.?]+$/, "");
  const openers = {
    Professional: `${t} is a question worth taking seriously, and the answer has real implications for how teams operate day to day.`,
    Playful: `Let's talk about ${t} — because honestly, it's more interesting than it sounds.`,
    Bold: `${t}. Most teams get this wrong, and it's costing them more than they realise.`,
    Inspirational: `Every meaningful change starts with a question like this one: ${t}.`,
    Informative: `Here's a clear look at ${t}, and what it actually means in practice.`,
  };
  const middles = [
    "The core idea is simple, even if putting it into practice takes more discipline than expected.",
    "What tends to separate teams that succeed from teams that struggle isn't access to more resources — it's clarity about what actually matters.",
    "Small, consistent habits compound faster than most people expect, especially once they become part of the routine rather than a special effort.",
    "There's no single right answer here; the best approach depends on the size of the team, the stage of the business, and what's already working.",
    "It helps to measure the outcome you actually care about, rather than the easiest number to track.",
    "Communication tends to matter as much as the underlying process — a good idea poorly explained rarely sticks.",
    "Revisiting the approach every so often, rather than setting it once and forgetting it, keeps it useful as circumstances change.",
  ];
  const closers = {
    Professional: `Getting this right on ${t} won't happen overnight, but the direction matters more than the pace.`,
    Playful: `So next time ${t} comes up, you'll actually have something useful to say.`,
    Bold: `Ignore ${t} at your own risk — the teams paying attention are already pulling ahead.`,
    Inspirational: `${t} isn't just a question to answer once. It's a mindset worth returning to.`,
    Informative: `That's the short version of ${t} — simple in concept, worth the effort in practice.`,
  };
  const paras = [openers[tone] || openers.Professional];
  const personaSentences = (persona && persona.painPoints && persona.painPoints.length)
    ? persona.painPoints.map(p => `For ${persona.role ? "a " + persona.role.toLowerCase() : "many people in this position"}, ${p.replace(/\.$/, "").toLowerCase()} is a familiar problem — and it's exactly what this addresses.`)
    : [];
  const knowledgeSentences = (knowledge && knowledge.keyMessages) ? knowledge.keyMessages : [];
  const middlePool = [...personaSentences, ...knowledgeSentences, ...middles];
  for (let i = 0; i < count - 2; i++) paras.push(middlePool[i % middlePool.length]);
  let closer = closers[tone] || closers.Professional;
  if (knowledge && knowledge.cta) closer += ` ${knowledge.cta}.`;
  if (count > 1) paras.push(closer);
  return paras.slice(0, count);
}

function BarChartSVG({ data }) {
  const max = Math.max(1, ...data.map(d => d.value));
  const w = 480, h = 200, pad = 30, barGap = 18;
  const barW = data.length ? (w - pad * 2 - barGap * (data.length - 1)) / data.length : 0;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 220 }}>
      {data.map((d, i) => {
        const bh = (d.value / max) * (h - pad * 2);
        const x = pad + i * (barW + barGap);
        const y = h - pad - bh;
        return (
          <g key={d.label}>
            <rect x={x} y={y} width={barW} height={bh} rx="4" fill={C.cyan} />
            <text x={x + barW / 2} y={h - pad + 16} textAnchor="middle" fontSize="10" fill={C.inkMuted} fontFamily="Inter">{d.label}</text>
            <text x={x + barW / 2} y={y - 6} textAnchor="middle" fontSize="10" fill={C.ink} fontFamily="Inter">{d.value}</text>
          </g>
        );
      })}
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke={C.border} />
    </svg>
  );
}

function LineChartSVG({ data }) {
  const w = 480, h = 200, pad = 30;
  const max = Math.max(1, ...data.map(d => d.value));
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (d.value / max) * (h - pad * 2);
    return [x, y];
  });
  const path = points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 220 }}>
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke={C.border} />
      {points.length > 1 && <path d={path} fill="none" stroke={C.amber} strokeWidth="2" />}
      {points.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={C.amber} />)}
      {data.map((d, i) => <text key={d.label} x={points[i][0]} y={h - pad + 16} textAnchor="middle" fontSize="9" fill={C.inkMuted} fontFamily="Inter">{d.label}</text>)}
    </svg>
  );
}

function PerformanceView({ posts, updatePost }) {
  const published = posts.filter(p => p.status === "published");
  const totals = published.reduce((acc, p) => {
    const m = p.metrics || {};
    acc.likes += Number(m.likes) || 0; acc.comments += Number(m.comments) || 0;
    acc.shares += Number(m.shares) || 0; acc.reach += Number(m.reach) || 0;
    return acc;
  }, { likes: 0, comments: 0, shares: 0, reach: 0 });
  const totalEngagement = totals.likes + totals.comments + totals.shares;
  const engagementRate = totals.reach > 0 ? ((totalEngagement / totals.reach) * 100).toFixed(1) : null;

  const byPlatform = useMemo(() => {
    const map = {};
    published.forEach(p => {
      const m = p.metrics || {};
      const key = platformInfo(p.platform).label;
      if (!map[key]) map[key] = { label: key, value: 0 };
      map[key].value += (Number(m.likes) || 0) + (Number(m.comments) || 0) + (Number(m.shares) || 0);
    });
    return Object.values(map);
  }, [published]);

  const overTime = useMemo(() => [...published].sort((a, b) => a.date.localeCompare(b.date)).map(p => {
    const m = p.metrics || {};
    return { label: formatDate(p.date), value: (Number(m.likes) || 0) + (Number(m.comments) || 0) + (Number(m.shares) || 0) };
  }), [published]);

  return (
    <div>
      <SectionHeading>Performance</SectionHeading>
      <PageIntro>Performance shows what's actually working. Mark a post as published in Publish, then log its likes, comments, shares, and reach here — engagement rate, per-platform performance, and trends over time are all calculated from what you enter.</PageIntro>
      {published.length === 0 ? (
        <div style={{ color: C.inkMuted, fontSize: 14, marginBottom: 28 }}>No published posts yet. Mark posts as "published" in Publish and log their metrics below to see performance here.</div>
      ) : (
        <React.Fragment>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 30 }}>
            <StatTile label="Published posts" value={published.length} />
            <StatTile label="Total engagement" value={totalEngagement.toLocaleString()} />
            <StatTile label="Total reach" value={totals.reach.toLocaleString()} />
            <StatTile label="Engagement rate" value={engagementRate ? `${engagementRate}%` : "—"} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 36 }}>
            <ChartCard title="Engagement by platform"><BarChartSVG data={byPlatform} /></ChartCard>
            <ChartCard title="Engagement over time"><LineChartSVG data={overTime} /></ChartCard>
          </div>
        </React.Fragment>
      )}
      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700, marginBottom: 12 }}>Log post metrics</h3>
      {posts.filter(p => p.status === "published").length === 0 ? (
        <div style={{ color: C.inkMuted, fontSize: 13 }}>Mark a post as "published" from Publish to log its metrics here.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {posts.filter(p => p.status === "published").map(p => <MetricsRow key={p.id} post={p} updatePost={updatePost} />)}
        </div>
      )}
    </div>
  );
}

function mockAdCopy(product, objective, persona) {
  let headline = product.keyMessages[0]
    ? product.keyMessages[0].split(" ").slice(0, 8).join(" ").replace(/[.,;:]+$/, "")
    : `${product.name}${objective ? ` — ${objective}` : ""}`;
  if (persona && persona.painPoints && persona.painPoints.length) {
    headline = `Still dealing with ${persona.painPoints[0].replace(/\.$/, "").toLowerCase()}?`;
  }
  const bodyParts = product.keyMessages.slice(0, 2);
  let primaryText = bodyParts.length ? bodyParts.join(" ") : (product.description || `Discover ${product.name}.`);
  if (product.cta) primaryText += ` ${product.cta}.`;
  return { headline, primaryText };
}

const emptyLeadDraft = { name: "", company: "", email: "", value: "", stage: "New", source: "Website form", campaignId: "", notes: "", ownerEmail: "", contactId: "", documents: [] };

function mockParseEmail(text) {
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  const email = emailMatch ? emailMatch[0] : "";

  let name = "";
  const fromMatch = text.match(/From:\s*([A-Za-z][A-Za-z.'-]+(?:\s+[A-Za-z][A-Za-z.'-]+){0,2})\s*<[\w.+-]+@/i);
  if (fromMatch) name = fromMatch[1].trim();
  if (!name) {
    const signoffMatch = text.match(/(?:regards|best|thanks|sincerely|cheers|warmly)[,\s]*\n+\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,2})/i);
    if (signoffMatch) name = signoffMatch[1].trim();
  }

  let company = "";
  if (email) {
    const domain = email.split("@")[1] || "";
    const domainBase = domain.split(".")[0];
    const freeMailDomains = ["gmail", "yahoo", "hotmail", "outlook", "icloud", "aol", "proton", "protonmail"];
    if (domainBase && !freeMailDomains.includes(domainBase.toLowerCase())) {
      company = domainBase.charAt(0).toUpperCase() + domainBase.slice(1);
    }
  }

  return { name, email, company };
}

  function parseEmail() {
    if (!emailText.trim()) return;
    setParsing(true);
    setParseNote("");
    setTimeout(() => {
      const result = mockParseEmail(emailText);
      setDraft(prev => ({
        ...prev,
        name: result.name || prev.name,
        email: result.email || prev.email,
        company: result.company || prev.company,
        source: "Referral",
      }));
      setParseNote(!result.name && !result.email ? "Couldn't find a name or email in that text — fill them in manually below." : "Filled in what it could find below — double check before saving.");

  function linkContact(contactId) {

    const co = c.companyId ? companies.find(x => x.id === c.companyId) : null;

function LeadCard({ lead, campaigns, onAdvance, onLost, onEdit, onDelete, currency, token, onUpdateLead, teamMembers }) {
  const campaign = campaigns.find(c => c.id === lead.campaignId);
  const idx = LEAD_STAGES.indexOf(lead.stage);
  const isOpen = lead.stage !== "Won" && lead.stage !== "Lost";
  const nextStage = idx >= 0 && idx < 3 ? LEAD_STAGES[idx + 1] : "Won";
  const [expanded, setExpanded] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const fileInputRef = React.useRef(null);
  const docs = lead.documents || [];
  const needsProposal = lead.stage === "Proposal" && docs.length === 0;

  async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setUploadError("");
    try {
      const result = await apiUploadAsset(token, file);
      onUpdateLead(lead.id, { documents: [...docs, { id: result.id, name: file.name, mimeType: file.type || "application/octet-stream", sizeBytes: result.sizeBytes, uploadedDate: todayISO() }] });
      setExpanded(true);
    } catch (err) {
      setUploadError(err.message || "Upload failed");
    }
    setUploading(false);
    e.target.value = "";
  }
  function removeDoc(id) {
    onUpdateLead(lead.id, { documents: docs.filter(d => d.id !== id) });
    apiDeleteAssetFile(token, id);
  }

  return (
    <div style={{ background: C.surface, border: `1px solid ${needsProposal ? C.amber : C.border}`, borderRadius: 8, padding: 12, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ cursor: "pointer", flex: 1 }} onClick={() => setExpanded(!expanded)}>
          <div style={{ fontSize: 13.5, fontWeight: 700 }}>{lead.name}</div>
          <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 1 }}>{lead.company}</div>
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => onEdit(lead)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, padding: 2 }}><Icon name="pencil" size={12} /></button>
          <DeleteButton onDelete={() => onDelete(lead.id)} itemName={lead.name} size={12} />
          <button onClick={() => setExpanded(!expanded)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, padding: 2 }}><Icon name={expanded ? "chevron-up" : "chevron-down"} size={12} /></button>
        </div>
      </div>
      <div style={{ fontSize: 13, fontFamily: "'IBM Plex Mono', monospace", marginTop: 8 }}>{formatMoney(lead.value, currency)}</div>
      <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 4 }}>{lead.source}{campaign ? ` · ${campaign.name}` : ""}{lead.ownerEmail ? ` · ${(teamMembers && teamMembers.find(m => m.email === lead.ownerEmail) || {}).personName || lead.ownerEmail}` : ""}</div>
      {docs.length > 0 && !expanded && (
        <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
          <Icon name="file-text" size={11} color={C.inkFaint} /> {docs.length} document{docs.length === 1 ? "" : "s"}
        </div>
      )}
      {isOpen && (
        <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
          <button onClick={() => onAdvance(lead)} style={{ flex: 1, background: `${C.green}1F`, border: `1px solid ${C.green}`, color: C.green, padding: "5px 8px", borderRadius: 5, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
            {lead.stage === "Proposal" ? "Mark Won" : `Advance → ${nextStage}`}
          </button>
          <button onClick={() => onLost(lead)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkFaint, padding: "5px 8px", borderRadius: 5, fontSize: 11, cursor: "pointer" }}>Lost</button>
        </div>
      )}
      {needsProposal && !expanded && (
        <button onClick={() => setExpanded(true)} style={{ marginTop: 10, width: "100%", background: `${C.amber}14`, border: `1px solid ${C.amber}`, color: C.amber, padding: "6px 8px", borderRadius: 5, fontSize: 11, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          <Icon name="upload" size={11} /> Upload the proposal
        </button>
      )}
      {expanded && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
          {needsProposal && <div style={{ fontSize: 11, color: C.amber, marginBottom: 8 }}>This lead is at Proposal stage — attach a copy below.</div>}
          {docs.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
              {docs.map(d => (
                <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11.5, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px" }}>
                  <Icon name="file-text" size={12} color={C.inkFaint} />
                  <a href={assetUrl(d.id, token)} target="_blank" rel="noopener noreferrer" style={{ flex: 1, color: C.teal, textDecoration: "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</a>
                  <span style={{ fontSize: 10, color: C.inkFaint }}>{formatBytes(d.sizeBytes)}</span>
                  <DeleteButton onDelete={() => removeDoc(d.id)} itemName={d.name} iconName="x" style={{ color: C.inkFaint }} size={11} />
                </div>
              ))}
            </div>
          )}
          <input ref={fileInputRef} type="file" onChange={handleUpload} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "6px 10px", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: uploading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={uploading ? "loader-2" : "upload"} size={11} className={uploading ? "spin" : ""} />
            {uploading ? "Uploading…" : "Add document"}
          </button>
          {uploadError && <div style={{ fontSize: 10.5, color: "#E5484D", marginTop: 6 }}>{uploadError}</div>}
        </div>
      )}
    </div>
  );
}
