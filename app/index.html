const REPORT_CADENCES = ["None", "Daily", "Weekly", "Monthly"];
const REPORT_SECTIONS = [
  { label: "Recent events", note: "News and announcements in this market over the period." },
  { label: "Trends", note: "What's shifting — demand, channels, pricing, buyer behaviour." },
  { label: "Competitors", note: "What competitors are posting, running as ads, and publishing." },
  { label: "Your website", note: "How your site compares to what's landing in this market." },
  { label: "Your messaging", note: "Checked against your saved Brand voice and Products key messages." },
];

function MarketReports({ market, hasBrand, hasProducts, onSetCadence, onRequestReport, generating, error }) {
  const cadence = market.reportCadence || "None";
  const reports = market.reports || [];
  const [expandedIdx, setExpandedIdx] = useState(reports.length - 1);
  return (
    <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
      <div style={{ fontSize: 11.5, color: C.inkMuted, marginBottom: 8 }}>This report covers:</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 12 }}>
        {REPORT_SECTIONS.map(s => (
          <div key={s.label} style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
            <span style={{ fontSize: 11.5, fontWeight: 600, color: C.orange, minWidth: 92 }}>{s.label}</span>
            <span style={{ fontSize: 11, color: C.inkFaint }}>{s.note}</span>
          </div>
        ))}
      </div>
      {(!hasBrand || !hasProducts) && (
        <div style={{ fontSize: 10.5, color: C.amber, marginBottom: 12 }}>
          {!hasBrand && !hasProducts ? "Add Brand and Products info " : !hasBrand ? "Add Brand info " : "Add Products info "}
          so the "Your messaging" section has something real to check against.
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11.5, color: C.inkMuted }}>Cadence:</span>
          <select value={cadence} onChange={e => onSetCadence(e.target.value)} style={{ ...inputStyle, padding: "5px 8px", fontSize: 12 }}>
            {REPORT_CADENCES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <button onClick={() => { onRequestReport(); setExpandedIdx(reports.length); }} disabled={generating} style={{ background: "none", border: `1px solid ${C.orange}`, color: C.orange, padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: generating ? "default" : "pointer", opacity: generating ? 0.6 : 1, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name={generating ? "loader-2" : "bar-chart-3"} size={12} className={generating ? "spin" : ""} /> {generating ? "Researching…" : "Run report now"}
        </button>
      </div>
      {generating && <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 8, lineHeight: 1.5 }}>Searching the web and compiling a sourced report on {market.name || "this market"} — this can take a minute or two.</div>}
      {error && <div style={{ fontSize: 11, color: "#E5484D", marginTop: 8 }}>{error}</div>}
      {reports.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
          {reports.map((r, i) => (
            <div key={i} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, overflow: "hidden" }}>
              <button onClick={() => setExpandedIdx(expandedIdx === i ? -1 : i)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "none", border: "none", padding: "8px 10px", cursor: "pointer" }}>
                <span style={{ fontSize: 12, color: C.ink, fontWeight: 600 }}>Report — {formatDate(r.date)}</span>
                <Icon name={expandedIdx === i ? "chevron-up" : "chevron-down"} size={13} color={C.inkFaint} />
              </button>
              {expandedIdx === i && (
                <div style={{ padding: "0 12px 12px", fontSize: 12.5, color: C.inkMuted, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{r.content || "No content."}</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MarketsPanel({ markets, personas, addMarket, updateMarket, deleteMarket }) {
  const [showForm, setShowForm] = useState(markets.length === 0);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(emptyMarketDraft);

  function openNew() { setDraft(emptyMarketDraft); setEditingId(null); setShowForm(true); }
  function openEdit(m) { setDraft({ name: m.name, region: m.region, industry: m.industry, description: m.description }); setEditingId(m.id); setShowForm(true); }
  function save() {
    if (!draft.name.trim()) return;
    if (editingId) updateMarket(editingId, draft); else addMarket(draft);
    setShowForm(false);
  }

  return (
    <div>
      {!showForm && (
        <button onClick={openNew} style={{ display: "flex", alignItems: "center", gap: 6, background: C.orange, color: "#fff", border: "none", padding: "9px 16px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 20 }}>
          <Icon name="plus" size={15} /> New market
        </button>
      )}
      {markets.length === 0 && !showForm && <div style={{ padding: "20px 0", color: C.inkMuted, fontSize: 14 }}>No markets yet. Add one to group personas by region and industry — market reports live in the Insights section once you've added one.</div>}
      {markets.length > 0 && !showForm && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 12 }}>
          {markets.map(m => {
            const linkedPersonas = personas.filter(p => p.marketId === m.id);
            return (
              <div key={m.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15 }}>{m.name}</div>
                    <div style={{ fontSize: 12, color: C.inkMuted, marginTop: 2 }}>{[m.region, m.industry].filter(Boolean).join(" · ")}</div>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <button onClick={() => openEdit(m)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, padding: 2 }}><Icon name="pencil" size={14} /></button>
                    <DeleteButton onDelete={() => deleteMarket(m.id)} itemName={m.name} size={14} />
                  </div>
                </div>
                {m.description && <div style={{ fontSize: 13, color: C.inkMuted, marginTop: 8 }}>{m.description}</div>}
                {linkedPersonas.length > 0 ? (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
                    {linkedPersonas.map(p => <Badge key={p.id} color={C.orange}>{p.name}</Badge>)}
                  </div>
                ) : (
                  <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 10 }}>No personas linked yet.</div>
                )}
              </div>
            );
          })}
        </div>
      )}
      {showForm && <MarketForm draft={draft} setDraft={setDraft} onCancel={() => setShowForm(false)} onSave={save} isEdit={!!editingId} />}
    </div>
  );
}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>

        <Field label="Role / title"><input value={draft.role} onChange={e => setDraft({ ...draft, role: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Small business owner" /></Field>

function MarketInsightsView({ markets, brand, products, updateMarket, setTab, connections }) {
  const hasBrand = !!(brand && (brand.logoDataUrl || brand.colors.length > 0 || brand.tone.trim() || brand.rules.length > 0));
  const hasProducts = products && products.length > 0;
  const websiteUrl = (connections && connections.website && connections.website.url) || "";
  const [generatingId, setGeneratingId] = useState(null);
  const [genError, setGenError] = useState({});

  function setCadence(market, cadence) { updateMarket(market.id, { reportCadence: cadence }); }

  async function requestReport(market) {
    setGeneratingId(market.id);
    setGenError(prev => ({ ...prev, [market.id]: "" }));
    const jobId = uid();
    try {
      await fetch("/api/market-report-background", {
        method: "POST",
        headers: __authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({
          jobId, marketName: market.name, region: market.region, industry: market.industry,
          brand: hasBrand ? brand : null, products: hasProducts ? products : null, websiteUrl,
        }),
      });
      // Poll until the background job finishes, checking every few seconds.
      const start = Date.now();
      const maxWaitMs = 10 * 60 * 1000; // 10 minutes
      while (Date.now() - start < maxWaitMs) {
        await new Promise(r => setTimeout(r, 4000));
        const res = await fetch(`/api/report-status?jobId=${encodeURIComponent(jobId)}`, { headers: __authHeaders() });
        if (res.status === 401) {
          setGenError(prev => ({ ...prev, [market.id]: "Your session has expired — sign out and back in, then try again." }));
          setGeneratingId(null);
          return;
        }
        const job = await res.json();
        if (job.status === "done") {
          if (!job.report || !job.report.trim()) {
            setGenError(prev => ({ ...prev, [market.id]: "The report came back empty — try running it again." }));
            setGeneratingId(null);
            return;
          }
          const reports = [...(market.reports || []), { date: todayISO(), content: job.report }];
          updateMarket(market.id, { reports });
          setGeneratingId(null);
          return;
        }
        if (job.status === "error") {
          setGenError(prev => ({ ...prev, [market.id]: job.error || "Couldn't generate a report right now." }));
          setGeneratingId(null);
          return;
        }
      }
      setGenError(prev => ({ ...prev, [market.id]: "This is taking longer than expected — try again in a moment." }));
    } catch (err) {
      setGenError(prev => ({ ...prev, [market.id]: err.message || "Couldn't generate a report right now." }));
    }
    setGeneratingId(null);
  }

  return (
    <div>
      <SectionHeading>Insights</SectionHeading>
      <PageIntro>External market intelligence, separate from your own performance data. Request a report on any market you've defined in Target Audience, covering recent events, trends, competitors, and how your own website and messaging compare.</PageIntro>

      <InfoBox>
        <strong style={{ color: C.ink }}>Before you run a report:</strong> real research takes 1–3 minutes, so keep this tab open while it runs.
        {!websiteUrl && <div style={{ marginTop: 6 }}>Add your website URL under <button onClick={() => setTab("connections")} style={{ background: "none", border: "none", color: C.teal, cursor: "pointer", textDecoration: "underline", padding: 0, font: "inherit" }}>Connections</button> so the "Your website" section can compare it against the market — without it, that section will just say no URL was given.</div>}
        {(!hasBrand || !hasProducts) && <div style={{ marginTop: 6 }}>Add {!hasBrand && !hasProducts ? "your Brand voice and Products" : !hasBrand ? "your Brand voice" : "your Products"} so the "Your messaging" section has something real to check against.</div>}
      </InfoBox>

      {markets.length === 0 ? (
        <div style={{ padding: "40px 0", color: C.inkMuted, fontSize: 14 }}>
          No markets yet. Add one in <button onClick={() => setTab("personas")} style={{ background: "none", border: "none", color: C.orange, cursor: "pointer", textDecoration: "underline", padding: 0, font: "inherit" }}>Target Audience</button> to request a market report.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {markets.map(m => (
            <div key={m.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15 }}>{m.name}</div>
              <div style={{ fontSize: 12, color: C.inkMuted, marginTop: 2 }}>{[m.region, m.industry].filter(Boolean).join(" · ")}</div>
              <MarketReports market={m} hasBrand={hasBrand} hasProducts={hasProducts} onSetCadence={c => setCadence(m, c)} onRequestReport={() => requestReport(m)} generating={generatingId === m.id} error={genError[m.id]} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ConnectionsView({ connections, setConnections, setTab, setPendingTopic, contacts, addContact, updateContact }) {
  const social = connections.social || {};
  const socialHandles = connections.socialHandles || {};
  const emailLists = connections.emailLists || [];
  const website = connections.website || { url: "", feedUrl: "" };
  const [convertResult, setConvertResult] = useState(null);
  function toggleSocial(id, handle) {
    const nextSocial = { ...social, [id]: !!handle };
    const nextHandles = { ...socialHandles };
    if (handle) nextHandles[id] = handle; else delete nextHandles[id];
    setConnections({ ...connections, social: nextSocial, socialHandles: nextHandles });
  }
  function addList(name) { setConnections({ ...connections, emailLists: [...emailLists, { name, members: [] }] }); }
  function removeList(i) { setConnections({ ...connections, emailLists: emailLists.filter((_, idx) => idx !== i) }); }
  function updateListMembers(i, members) {
    setConnections({ ...connections, emailLists: emailLists.map((l, idx) => idx === i ? { name: emailListName(l), members } : l) });
  }
  function updateWebsite(next) { setConnections({ ...connections, website: next }); }
  function useTopic(title) { setPendingTopic(title); setTab("studio"); }

  // Converts a static email list's members into real, tagged Contact records
  // — the list name becomes a tag, so this list becomes a live segment
  // (any contact with that tag) instead of a separate, disconnected database.
  function convertListToContacts(i) {
    const list = emailLists[i];
    const listName = emailListName(list);
    const members = emailListMembers(list);
    let created = 0, tagged = 0;
    members.forEach(raw => {
      const value = raw.trim();
      if (!value) return;
      const looksLikeEmail = value.includes("@");
      const email = looksLikeEmail ? value.toLowerCase() : "";
      const name = looksLikeEmail ? value.split("@")[0] : value;
      const existing = contacts.find(c =>
        (email && c.email && c.email.toLowerCase() === email) ||
        (!email && !c.email && c.name.toLowerCase() === name.toLowerCase())
      );
      if (existing) {
        if (!(existing.tags || []).includes(listName)) {
          updateContact(existing.id, { tags: [...(existing.tags || []), listName] });
          tagged++;
        }
      } else {
        addContact({ name, email, phone: "", jobTitle: "", companyId: "", tags: [listName], notes: "", marketingStatus: "Subscribed", consentSource: "Imported", consentBasis: "Consent" });
        created++;
      }
    });
    setConvertResult({ listName, created, tagged });
  }

  return (
    <div>
      <SectionHeading>Connections</SectionHeading>
      <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 24, maxWidth: 640 }}>
        Connect the social accounts, email lists, and website Publish, Campaigns, and Studio can draw on. Only connected platforms can be scheduled in Publish.
      </div>
      {convertResult && (
        <div style={{ maxWidth: 640, background: `${C.teal}14`, border: `1px solid ${C.teal}`, borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 12.5, color: C.inkMuted, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span>"{convertResult.listName}" converted — {convertResult.created} contact{convertResult.created === 1 ? "" : "s"} created, {convertResult.tagged} tagged. View them under <button onClick={() => setTab("companies")} style={{ background: "none", border: "none", color: C.teal, cursor: "pointer", textDecoration: "underline", padding: 0, font: "inherit" }}>Companies</button>.</span>
          <button onClick={() => setConvertResult(null)} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer" }}><Icon name="x" size={13} /></button>
        </div>
      )}
      <ConnectionsEditor social={social} socialHandles={socialHandles} emailLists={emailLists} website={website} onUpdateWebsite={updateWebsite} onToggleSocial={toggleSocial} onAddList={addList} onRemoveList={removeList} onUpdateMembers={updateListMembers} onConvertList={convertListToContacts} />
      <WebsiteActivityPanel website={website} onUseTopic={useTopic} />
    </div>
  );
}

const TONE_PRESETS = ["Warm", "Endearing", "Engaging", "Professional", "Playful", "Authoritative", "Friendly", "Bold", "Sophisticated", "Reassuring", "Direct", "Empathetic"];

function ToneOfVoicePicker({ brand, setBrand }) {
  const currentTags = (brand.tone || "").split(",").map(t => t.trim()).filter(Boolean);
  const [otherText, setOtherText] = useState("");

  function isPresetSelected(preset) { return currentTags.some(t => t.toLowerCase() === preset.toLowerCase()); }
  function togglePreset(preset) {
    const newTags = isPresetSelected(preset)
      ? currentTags.filter(t => t.toLowerCase() !== preset.toLowerCase())
      : [...currentTags, preset];
    setBrand({ ...brand, tone: newTags.join(", ") });
  }
  function removeTag(tag) { setBrand({ ...brand, tone: currentTags.filter(t => t !== tag).join(", ") }); }
  function addOther() {
    if (!otherText.trim()) return;
    setBrand({ ...brand, tone: [...currentTags, otherText.trim()].join(", ") });
    setOtherText("");
  }

  const customTags = currentTags.filter(t => !TONE_PRESETS.some(p => p.toLowerCase() === t.toLowerCase()));

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
        {TONE_PRESETS.map(preset => {
          const active = isPresetSelected(preset);
          return (
            <button key={preset} onClick={() => togglePreset(preset)} style={{
              padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: active ? `1px solid ${C.indigo}` : `1px solid ${C.border}`,
              background: active ? `${C.indigo}22` : "transparent", color: active ? C.ink : C.inkMuted }}>
              {preset}
            </button>
          );
        })}
      </div>
      {customTags.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
          {customTags.map((tag, i) => (
            <span key={i} style={{ display: "flex", alignItems: "center", gap: 6, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 16, padding: "4px 10px", fontSize: 12.5 }}>
              {tag} <DeleteButton onDelete={() => removeTag(tag)} itemName={tag} iconName="x" style={{ padding: 0, display: "flex" }} size={11} />
            </span>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <input value={otherText} onChange={e => setOtherText(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="Other (e.g. Never oversell, no jargon)"
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addOther(); } }} />
        <button onClick={addOther} style={{ background: "none", border: `1px solid ${C.border}`, padding: "0 16px", borderRadius: 6, color: C.ink, cursor: "pointer" }}>Add</button>
      </div>
    </div>
  );
}

function BrandGuidelinesPanel({ brand, setBrand }) {
  const [raw, setRaw] = useState("");
  const [sourceLabels, setSourceLabels] = useState([]);
  const [websiteUrl, setWebsiteUrl] = useState("");
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const [scanWarning, setScanWarning] = useState("");
  const [extracting, setExtracting] = useState(false);
  const [extractNote, setExtractNote] = useState("");
  const [fileLoading, setFileLoading] = useState(false);
  const [fileError, setFileError] = useState("");
  const [newRule, setNewRule] = useState("");
  const [gaps, setGaps] = useState(null);
  const [gapAnswers, setGapAnswers] = useState({ tone: "", headingFont: "", bodyFont: "", ruleText: "" });
  const [expandedSource, setExpandedSource] = useState(null);
  const fileInputRef = React.useRef(null);
  const logoInputRef = React.useRef(null);
  const assetInputRef = React.useRef(null);
  const [assetLabel, setAssetLabel] = useState("");
  const [assetCategory, setAssetCategory] = useState(BRAND_ASSET_CATEGORIES[0]);
  const [assetError, setAssetError] = useState("");
  const [assetLoading, setAssetLoading] = useState(false);
  const sources = brand.sources || [];
  const assets = brand.assets || [];

  async function handleAssetUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setAssetError("");
    if (!assetLabel.trim()) {
      setAssetError("Give this asset a name first (e.g. \"Business card — front\").");
      if (assetInputRef.current) assetInputRef.current.value = "";
      return;
    }
    setAssetLoading(true);
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Couldn't read that file."));
        reader.readAsDataURL(file);
      });
      const newAsset = { id: uid(), label: assetLabel.trim(), category: assetCategory, dataUrl, mediaType: file.type || "", fileName: file.name, date: todayISO() };
      setBrand({ ...brand, assets: [newAsset, ...assets] });
      setAssetLabel("");
    } catch (err) {
      setAssetError(err.message || "Couldn't add that asset.");
    }
    setAssetLoading(false);
    if (assetInputRef.current) assetInputRef.current.value = "";
  }
  function removeAsset(id) { setBrand({ ...brand, assets: assets.filter(a => a.id !== id) }); }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setFileLoading(true);
    try {
      const text = await processUploadedFileShared(file);
      setRaw(prev => prev ? `${prev}\n\n${text}` : text);
      setSourceLabels(prev => [...prev, file.name]);
    } catch (err) {
      setFileError(err.message || "Couldn't read that file.");
    }
    setFileLoading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  async function scanWebsite() {
    if (!websiteUrl.trim()) return;
    setScanning(true); setScanError(""); setScanWarning("");
    try {
      const data = await apiScanWebsite(websiteUrl.trim());
      const combined = [data.title, data.description, data.text].filter(Boolean).join("\n\n");
      setRaw(prev => prev ? `${prev}\n\n${combined}` : combined);
      setSourceLabels(prev => [...prev, websiteUrl.trim()]);
      if (data.warning) setScanWarning(data.warning);
      if (data.colors && data.colors.length) {
        const newColors = data.colors
          .filter(hex => !brand.colors.some(c => c.hex.toLowerCase() === hex.toLowerCase()))
          .map((hex, i) => ({ name: `Found on site ${i + 1}`, hex }));
        if (newColors.length) setBrand({ ...brand, colors: [...brand.colors, ...newColors] });
      }
    } catch (err) {
      setScanError(err.message || "Couldn't scan that website.");
    }
    setScanning(false);
  }

  function handleLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setBrand({ ...brand, logoDataUrl: reader.result });
    reader.readAsDataURL(file);
    if (logoInputRef.current) logoInputRef.current.value = "";
  }

  async function runExtract() {
    if (!raw.trim()) return;
    setExtracting(true);
    setExtractNote("");
    setGaps(null);
    let aiColors = [], headingFont = "", bodyFont = "", tone = "", rules = [], usedAi = false;
    try {
      const data = await apiGenerate("brand_extract", { text: raw });
      aiColors = data.colors || [];
      headingFont = data.headingFont || "";
      bodyFont = data.bodyFont || "";
      tone = data.tone || "";
      rules = data.rules || [];
      usedAi = true;
    } catch (err) {
      const result = mockExtractBrand(raw);
      aiColors = result.colors.map((hex, i) => ({ name: `Color ${brand.colors.length + i + 1}`, hex }));
      headingFont = result.fonts[0] || "";
      bodyFont = result.fonts[1] || result.fonts[0] || "";
      rules = result.rules;
    }
    const newColors = aiColors.filter(c => !brand.colors.some(existing => existing.hex.toLowerCase() === c.hex.toLowerCase()));
    const labels = sourceLabels.length ? sourceLabels : ["Pasted text"];
    const combinedLabel = labels.join(" + ");
    const sourceType = labels.length > 1 ? "mixed" : (labels[0].match(/^https?:\/\//) ? "website" : (labels[0] === "Pasted text" ? "paste" : "file"));
    const newSource = { id: uid(), type: sourceType, label: combinedLabel, date: todayISO(), text: raw.slice(0, 4000) };
    setBrand({
      ...brand,
      colors: [...brand.colors, ...newColors],
      headingFont: brand.headingFont || headingFont,
      bodyFont: brand.bodyFont || bodyFont,
      tone: brand.tone || tone,
      rules: [...brand.rules, ...rules],
      sources: [newSource, ...sources],
    });
    const foundAnything = newColors.length || headingFont || bodyFont || tone || rules.length;
    setExtractNote(
      !foundAnything ? "Couldn't find brand details in that text. Fill in the fields below manually." :
      usedAi ? "Read by Vi-SOCEX's AI engine — added what it found below. Review and adjust." :
      "AI engine unavailable — used basic pattern matching instead. Review and adjust."
    );
    if (usedAi) {
      const missing = { tone: !tone, fonts: !headingFont && !bodyFont, rules: rules.length === 0 };
      if (missing.tone || missing.fonts || missing.rules) setGaps(missing);
    }
    setRaw(""); setSourceLabels([]); setWebsiteUrl("");
    setExtracting(false);
  }

  function saveGapAnswers() {
    setBrand({
      ...brand,
      tone: gaps.tone && gapAnswers.tone.trim() ? gapAnswers.tone.trim() : brand.tone,
      headingFont: gaps.fonts && gapAnswers.headingFont.trim() ? gapAnswers.headingFont.trim() : brand.headingFont,
      bodyFont: gaps.fonts && gapAnswers.bodyFont.trim() ? gapAnswers.bodyFont.trim() : brand.bodyFont,
      rules: gaps.rules && gapAnswers.ruleText.trim() ? [...brand.rules, gapAnswers.ruleText.trim()] : brand.rules,
    });
    setGaps(null);
    setGapAnswers({ tone: "", headingFont: "", bodyFont: "", ruleText: "" });
  }

  function removeSource(id) { setBrand({ ...brand, sources: sources.filter(s => s.id !== id) }); }

  function updateColor(i, next) { setBrand({ ...brand, colors: brand.colors.map((c, idx) => idx === i ? next : c) }); }
  function removeColor(i) { setBrand({ ...brand, colors: brand.colors.filter((_, idx) => idx !== i) }); }
  function addColor() { setBrand({ ...brand, colors: [...brand.colors, { name: `Color ${brand.colors.length + 1}`, hex: "#2563EB" }] }); }
  function addRule() { if (!newRule.trim()) return; setBrand({ ...brand, rules: [...brand.rules, newRule.trim()] }); setNewRule(""); }
  function removeRule(i) { setBrand({ ...brand, rules: brand.rules.filter((_, idx) => idx !== i) }); }

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) 500px", gap: 40, alignItems: "start", paddingRight: 32 }}>
    <div>
      <div style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 20, maxWidth: 640 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Already have brand guidelines or an existing website?</div>
        <Field label="Paste text, or upload a file below">
          <textarea value={raw} onChange={e => { setRaw(e.target.value); if (sourceLabels.length && !e.target.value.trim()) setSourceLabels([]); }} rows={4} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="Paste text from a brand guidelines doc, upload a file, or scan a website below…" />
        </Field>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
          <input ref={fileInputRef} type="file" accept={FILE_UPLOAD_ACCEPT} onChange={handleFile} style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={fileLoading}
            style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: fileLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={fileLoading ? "loader-2" : "package"} size={13} className={fileLoading ? "spin" : ""} />
            {fileLoading ? "Reading file…" : "Upload a file"}
          </button>
          <span style={{ fontSize: 11, color: C.inkFaint }}>{FILE_UPLOAD_HINT}</span>
        </div>
        {fileError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 8 }}>{fileError}</div>}

        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 14, paddingTop: 14 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Or scan an existing website</label>
          <div style={{ display: "flex", gap: 8 }}>
            <input value={websiteUrl} onChange={e => setWebsiteUrl(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="https://yourbusiness.com"
              onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); scanWebsite(); } }} />
            <button onClick={scanWebsite} disabled={scanning || !websiteUrl.trim()} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "0 16px", borderRadius: 6, cursor: scanning ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600 }}>
              <Icon name={scanning ? "loader-2" : "globe"} size={13} className={scanning ? "spin" : ""} />
              {scanning ? "Scanning…" : "Scan site"}
            </button>
          </div>
          {scanError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 8 }}>{scanError}</div>}
          {scanWarning && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 8, lineHeight: 1.5, display: "flex", alignItems: "flex-start", gap: 6 }}><Icon name="alert-triangle" size={12} color={C.amber} />{scanWarning}</div>}
          <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>Reads the page's public text and any colors in its code — reliable for tone of voice and stated facts, less reliable for an exact color palette since that often lives in images or compiled styles a plain fetch can't see.</div>
        </div>

        <button onClick={runExtract} disabled={extracting || !raw.trim()} style={{ marginTop: 14, background: C.indigo, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: extracting ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name={extracting ? "loader-2" : "pen-square"} size={14} className={extracting ? "spin" : ""} />

        </button>
        {extractNote && <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 8 }}>{extractNote}</div>}

      {gaps && (
        <div style={{ background: C.raised, border: `1px solid ${C.amber}`, borderRadius: 8, padding: 16, marginBottom: 28, maxWidth: 640 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4, color: C.amber }}>A few things weren't in there</div>

            <div style={{ marginBottom: 10 }}>
              <Field label="How should your brand sound, in a sentence or two?"><input value={gapAnswers.tone} onChange={e => setGapAnswers({ ...gapAnswers, tone: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Warm and direct, never salesy" /></Field>
            </div>
          )}
          {gaps.fonts && (
            <div style={{ display: "flex", gap: 12, marginBottom: 10 }}>
              <Field label="Heading font (if you use one)"><input value={gapAnswers.headingFont} onChange={e => setGapAnswers({ ...gapAnswers, headingFont: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Montserrat" /></Field>
              <Field label="Body font (if you use one)"><input value={gapAnswers.bodyFont} onChange={e => setGapAnswers({ ...gapAnswers, bodyFont: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Inter" /></Field>
            </div>
          )}
          {gaps.rules && (
            <div style={{ marginBottom: 10 }}>
              <Field label="Any specific dos or don'ts?"><input value={gapAnswers.ruleText} onChange={e => setGapAnswers({ ...gapAnswers, ruleText: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Never discount language, always credit the customer" /></Field>
            </div>
