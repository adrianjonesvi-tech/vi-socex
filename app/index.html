const OnlineContext = React.createContext(true);
// Lets any form deep in the tree report "I have unsaved changes" without
// threading a setter prop through every intermediate view. Uses a registry
// (not a plain boolean) because many forms can be mounted at once (e.g. one
// per row in a list) — each guard owns its own id, so one form closing can
// never accidentally clear another form's still-unsaved flag.
const UnsavedChangesContext = React.createContext(() => {});
function useOnline() { return React.useContext(OnlineContext); }
// Call with a boolean each render: true while the form has changes the user
// hasn't saved yet. Automatically clears itself when the form unmounts
// (after a save or cancel), so it never leaks into the next screen.
function useUnsavedGuard(dirty) {
  const registerDirty = useContext(UnsavedChangesContext);
  const idRef = React.useRef(null);
  if (idRef.current === null) idRef.current = `guard_${Math.random().toString(36).slice(2)}`;
  useEffect(() => {
    registerDirty(idRef.current, dirty);
    return () => registerDirty(idRef.current, false);
  }, [dirty]);
}

// Several people (and several tabs) work on the same company data at once, so:
//  * every section remembers the server's version stamp for what it loaded;
//  * saves send that stamp — if a teammate saved in between, the server refuses
//    (409) and returns their copy, and we MERGE both sets of changes instead of
//    overwriting theirs;

//    changed and quietly pulls in teammates' updates;

// version, theirs = what a teammate saved. Keeps every change that only one side
// made; only when both changed the exact same value does this tab's edit win.

    const json = await res.json();

// Debounced per-key: rapid edits (every keystroke) collapse into one save 700ms

async function __flush(key) {

    if (__sync.confirmed[key] !== undefined && __stable(value) === __stable(JSON.parse(__sync.confirmed[key]))) continue;
    const body = JSON.stringify(value);
    __sync.inflight[key] = true;
    let retryLater = false;
    try {
      const res = await fetch(`/api/data?key=${encodeURIComponent(key)}`, {
        method: "PUT",
        headers: __authHeaders({ "Content-Type": "application/json", "X-Base-Version": __sync.versions[key] || "none" }),
        body,
      });

        __sync.versions[key] = j.version || __sync.versions[key];
        __sync.confirmed[key] = body;
      } else if (res.status === 409) {
        const j = await res.json();
        const base = __sync.confirmed[key] !== undefined ? JSON.parse(__sync.confirmed[key]) : null;

        headers: __authHeaders({ "Content-Type": "application/json", "X-Base-Version": __sync.versions[key] || "none" }),
        body: JSON.stringify(__sync.queued[key]),

// Shared extraction helpers — used by both Brand and Products upload flows so
// PDF/Excel/image support and the scanned-PDF OCR fallback stay consistent
// in one place rather than duplicated per form.
async function extractPdfTextShared(buf, onProgress) {
  if (!window.pdfjsLib) throw new Error("PDF reader failed to load — check your internet connection and try again.");
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    pages.push(content.items.map(it => it.str).join(" "));
  }
  const text = pages.join("\n\n").trim();
  if (text) return text;
  // No text layer found (a scanned/image-only PDF, or slides that are really
  // just pasted screenshots) — pdf.js can only read existing text objects,
  // not perform OCR. Fall back to rendering every page as an image and
  // running them through the real AI's vision capability, in batches (the
  // vision endpoint caps at 5 images per call).
  const BATCH_SIZE = 5;
  const MAX_PAGES = 40;
  const totalPages = Math.min(pdf.numPages, MAX_PAGES);
  const results = [];
  for (let start = 1; start <= totalPages; start += BATCH_SIZE) {
    const end = Math.min(start + BATCH_SIZE - 1, totalPages);
    if (onProgress) onProgress(start, end, totalPages);
    const images = [];
    for (let i = start; i <= end; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      const dataUrl = canvas.toDataURL("image/png");
      images.push({ data: dataUrl.split(",")[1], mediaType: "image/png" });
    }
    const result = await apiVisionExtract(images);
    results.push(`[Pages ${start}-${end}]\n${result.text}`);
  }
  if (pdf.numPages > MAX_PAGES) {
    results.push(`[Note: this document has ${pdf.numPages} pages — only the first ${MAX_PAGES} were read.]`);
  }
  return results.join("\n\n");
}
async function extractDocxTextShared(buf) {
  if (!window.mammoth) throw new Error("Word reader failed to load — check your internet connection and try again.");
  const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}
async function extractExcelTextShared(buf) {
  if (!window.XLSX) throw new Error("Spreadsheet reader failed to load — check your internet connection and try again.");
  const wb = window.XLSX.read(buf, { type: "array" });
  const parts = [];
  wb.SheetNames.forEach(name => {
    const csv = window.XLSX.utils.sheet_to_csv(wb.Sheets[name]).trim();
    if (csv) parts.push(`Sheet: ${name}\n${csv}`);
  });
  const combined = parts.join("\n\n");
  if (!combined) throw new Error("Couldn't find any data in that spreadsheet.");
  return combined;
}
async function extractImageTextShared(file) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Couldn't read that image file."));
    reader.readAsDataURL(file);
  });
  const base64 = dataUrl.split(",")[1];
  const result = await apiVisionExtract([{ data: base64, mediaType: file.type || "image/png" }]);
  return result.text;
}
const FILE_UPLOAD_ACCEPT = ".txt,.md,.pdf,.docx,.xlsx,.xls,.png,.jpg,.jpeg";
const FILE_UPLOAD_HINT = ".txt, .md, .pdf, .docx, .xlsx, .xls, .png, .jpg";
async function processUploadedFileShared(file) {
  const name = file.name.toLowerCase();
  let text = "";
  if (name.endsWith(".txt") || name.endsWith(".md")) {
    text = await file.text();
  } else if (name.endsWith(".pdf")) {
    text = await extractPdfTextShared(await file.arrayBuffer());
  } else if (name.endsWith(".docx")) {
    text = await extractDocxTextShared(await file.arrayBuffer());
  } else if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
    text = await extractExcelTextShared(await file.arrayBuffer());
  } else if (name.endsWith(".png") || name.endsWith(".jpg") || name.endsWith(".jpeg")) {
    text = await extractImageTextShared(file);
  } else {
    throw new Error("Unsupported file type. Use .txt, .md, .pdf, .docx, .xlsx, .xls, .png, or .jpg.");
  }
  text = (text || "").trim();
  if (!text) throw new Error("Couldn't find any readable content in that file.");
  return text;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function apiUploadAsset(token, file) {
  const dataBase64 = await fileToBase64(file);
  const res = await fetch("/api/assets?action=upload", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Session-Token": token },
    body: JSON.stringify({ name: file.name, mimeType: file.type || "application/octet-stream", dataBase64 }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Upload failed");
  return data;
}

  await fetch("/api/assets?action=delete", {

function formatBytes(n) {
  if (!n) return "0 KB";
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
}

// A genuine score built from what's actually logged — how much and how
// recently a contact's had real activity — not fabricated email-open or
// click data, since nothing in this app tracks that yet.
function computeEngagementScore(contactId, activities) {
  const own = (activities || []).filter(a => a.contactId === contactId);
  if (own.length === 0) return { score: 0, label: "New", color: C.inkFaint };
  const dates = own.map(a => new Date((a.date || a.createdDate) + "T00:00:00").getTime());
  const mostRecent = Math.max(...dates);
  const daysSince = Math.floor((Date.now() - mostRecent) / (1000 * 60 * 60 * 24));
  const recentCount = own.filter(a => {
    const d = new Date((a.date || a.createdDate) + "T00:00:00").getTime();
    return (Date.now() - d) / (1000 * 60 * 60 * 24) <= 30;
  }).length;
  let score = Math.min(recentCount * 12, 60);
  if (daysSince <= 7) score += 25;
  else if (daysSince <= 14) score += 10;
  score = Math.min(score, 100);
  const label = score >= 60 ? "Hot" : score >= 30 ? "Warm" : "Cold";
  const color = score >= 60 ? C.green : score >= 30 ? C.amber : C.inkFaint;
  return { score, label, color };
}

function questionnaireTopicAverages(template, submissions) {
  const totals = {};
  template.groups.forEach(g => { totals[g.id] = { sum: 0, count: 0 }; });
  submissions.forEach(s => s.answers.forEach(a => {
    if (a.score == null || !totals[a.groupId]) return;
    totals[a.groupId].sum += a.score;
    totals[a.groupId].count += 1;
  }));
  const avgs = {};
  template.groups.forEach(g => { avgs[g.id] = totals[g.id].count > 0 ? totals[g.id].sum / totals[g.id].count : null; });
  return avgs;
}
function questionnaireQuestionBreakdown(template, submissions) {
  const flat = flattenQuestionnaireGroups(template.groups);
  return flat.filter(q => q.type === "multi" || q.type === "text" || q.type === "matrix" || q.type === "ranking").map(q => {
    const answersForQ = submissions.flatMap(s => s.answers.filter(a => a && a.topic === q.topic && a.groupId === q.groupId));
    if (q.type === "multi") {
      const tally = {};
      (q.options || []).forEach(opt => { tally[opt] = 0; });
      answersForQ.forEach(a => (a.answerLabels || []).forEach(label => { tally[label] = (tally[label] || 0) + 1; }));
      const respondentCount = answersForQ.length;
      return { ...q, respondentCount, tally: Object.entries(tally).sort((a, b) => b[1] - a[1]) };
    }
    if (q.type === "matrix") {
      const scaleMax = (q.scaleLabels || []).length - 1;
      const itemStats = (q.items || []).map(item => {
        const ratings = answersForQ.map(a => a.ratings && a.ratings[item]).filter(v => v != null);
        const avg = ratings.length ? ratings.reduce((s, v) => s + v, 0) / ratings.length : null;
        const pct = avg != null && scaleMax > 0 ? Math.round((avg / scaleMax) * 100) : 0;
        return { item, avg, pct, label: avg != null ? q.scaleLabels[Math.round(avg)] : null, count: ratings.length };
      }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
      return { ...q, itemStats, respondentCount: answersForQ.length };
    }
    if (q.type === "ranking") {
      const rankCount = q.rankCount || (q.items || []).length;
      const points = {};
      (q.items || []).forEach(item => { points[item] = 0; });
      answersForQ.forEach(a => (a.rankedItems || []).forEach((item, i) => { points[item] = (points[item] || 0) + Math.max(rankCount - i, 0); }));
      const maxPossible = answersForQ.length * rankCount;
      const itemStats = Object.entries(points).map(([item, score]) => ({ item, score, pct: maxPossible > 0 ? Math.round((score / maxPossible) * 100) : 0 })).sort((a, b) => b.score - a.score);
      return { ...q, itemStats, respondentCount: answersForQ.length };
    }
    const responses = answersForQ.map(a => a.answerText).filter(t => t && t.trim());
    return { ...q, responses };
  });
}

  if (avgs.people != null) { if (avgs.people >= 4) toneWords.push("people-first"); else if (avgs.people < 3) rules.push("Be cautious with \"we value our people\" messaging — internal sentiment suggests this isn't fully felt yet."); }

function Icon({ name, size = 16, color = "currentColor", className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" className={className} style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0 }}>
      {ICON_PATHS[name] || null}
    </svg>
  );
}

function ConfirmDialog({ title, message, confirmLabel, onConfirm, onCancel }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(3,9,20,0.7)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onCancel}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 24, maxWidth: 420, width: "100%", boxShadow: "0 20px 50px rgba(0,0,0,0.5)" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 16 }}>
          <div style={{ width: 36, height: 36, borderRadius: "50%", background: "rgba(229,72,77,0.15)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name="alert-triangle" size={18} color="#E5484D" />
          </div>
          <div>
            <div style={{ fontSize: 15.5, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{title || "Delete this?"}</div>
            <div style={{ fontSize: 13, color: C.inkMuted, lineHeight: 1.5 }}>{message || "This can't be undone."}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "8px 16px", borderRadius: 7, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>Cancel</button>
          <button onClick={onConfirm} style={{ background: "#E5484D", color: "#fff", border: "none", padding: "8px 16px", borderRadius: 7, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>{confirmLabel || "Delete"}</button>
        </div>
      </div>
    </div>
  );
}

function DeleteButton({ onDelete, itemName, message, size, style, iconName, label }) {
  const [confirming, setConfirming] = useState(false);
  return (
    <React.Fragment>
      {label ? (
        <button onClick={() => setConfirming(true)} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 12, cursor: "pointer", textDecoration: "underline", ...(style || {}) }}>{label}</button>
      ) : (
        <button onClick={() => setConfirming(true)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, padding: 2, ...(style || {}) }}>
          <Icon name={iconName || "trash-2"} size={size || 14} />
        </button>
      )}
      {confirming && (
        <ConfirmDialog
          title={`Delete ${itemName || "this"}?`}
          message={message || "This can't be undone — everything stored against it will be permanently lost."}
          confirmLabel="Delete"
          onConfirm={() => { setConfirming(false); onDelete(); }}
          onCancel={() => setConfirming(false)}
        />
      )}
    </React.Fragment>
  );
}

function App({ tenant, onLogout, token, onUpdateTenant }) {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTabRaw] = useState("publish");
  const dirtyFormsRef = React.useRef(new Set());
  const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
  function registerDirty(id, dirty) {
    if (dirty) dirtyFormsRef.current.add(id); else dirtyFormsRef.current.delete(id);
    setHasUnsavedChanges(dirtyFormsRef.current.size > 0);
  }
  const [pendingTab, setPendingTab] = useState(null);
  function setTab(next) {
    if (hasUnsavedChanges) {
      setPendingTab(next);
    } else {
      setTabRaw(next);
    }
  }
  useEffect(() => {
    function handler(e) {
      if (hasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = "";
      }
    }
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [hasUnsavedChanges]);
  const [pendingTopic, setPendingTopic] = useState("");
  const [teamMembers, setTeamMembers] = useState([]);
  useEffect(() => {
    let cancelled = false;
    apiListMembers(token).then(m => { if (!cancelled) setTeamMembers(m); }).catch(() => {});
    return () => { cancelled = true; };
  }, [token]);
  const [posts, setPosts] = useState(SEED);

  useEffect(() => {

      const [
        postsD, campaignsD, adsD, articlesD, productsD, connectionsD, onboardedD,
        leadsD, brandD, personasD, marketsD, templatesD, submissionsD, sendsD, companyInfoD, caseStudiesD,
        companiesD, contactsD, activitiesD, tasksD, documentsD, assetsD,
      ] = await Promise.all([
        loadPosts(), loadCampaigns(), loadAds(), loadArticles(), loadProducts(),
        loadConnections(), loadOnboarded(), loadLeads(), loadBrand(), loadPersonas(),
        loadMarkets(), loadQuestionnaireTemplates(), loadQuestionnaireSubmissions(), loadQuestionnaireSends(), loadCompanyInfo(), loadCaseStudies(),
        loadCompanies(), loadContacts(), loadActivities(), loadTasks(), loadDocuments(), loadAssets(),
      ]);
      if (cancelled) return;
      setPosts(postsD); setCampaigns(campaignsD); setAds(adsD); setArticles(articlesD);
      setProducts(productsD); setConnectionsState(connectionsD); setOnboardedState(onboardedD);
      setLeads(leadsD); setBrandState(brandD); setPersonas(personasD); setMarkets(marketsD);
      setQuestionnaireTemplates(templatesD); setQuestionnaireSubmissions(submissionsD); setQuestionnaireSends(sendsD);
      setCompanyInfoState(companyInfoD);
      setCaseStudies(caseStudiesD);
      setCompanies(companiesD); setContacts(contactsD); setActivities(activitiesD);
      setTasks(tasksD); setDocuments(documentsD); setAssets(assetsD);
      setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => { if (loaded) savePosts(posts); }, [posts, loaded]);
  useEffect(() => { if (loaded) saveCampaigns(campaigns); }, [campaigns, loaded]);
  useEffect(() => { if (loaded) saveAds(ads); }, [ads, loaded]);
  useEffect(() => { if (loaded) saveArticles(articles); }, [articles, loaded]);
  useEffect(() => { if (loaded) saveProducts(products); }, [products, loaded]);
  useEffect(() => { if (loaded) saveConnections(connections); }, [connections, loaded]);
  useEffect(() => { if (loaded) saveLeads(leads); }, [leads, loaded]);
  useEffect(() => { if (loaded) saveBrandLS(brand); }, [brand, loaded]);
  useEffect(() => { if (loaded) saveCompanyInfoLS(companyInfo); }, [companyInfo, loaded]);
  useEffect(() => { if (loaded) saveCaseStudiesLS(caseStudies); }, [caseStudies, loaded]);
  useEffect(() => { if (loaded) saveCompanies(companies); }, [companies, loaded]);
  useEffect(() => { if (loaded) saveContacts(contacts); }, [contacts, loaded]);

  useEffect(() => { if (loaded) saveMarkets(markets); }, [markets, loaded]);
  useEffect(() => { if (loaded) saveQuestionnaireTemplatesLS(questionnaireTemplates); }, [questionnaireTemplates, loaded]);
  useEffect(() => { if (loaded) saveQuestionnaireSubmissions(questionnaireSubmissions); }, [questionnaireSubmissions, loaded]);
  useEffect(() => { if (loaded) saveQuestionnaireSends(questionnaireSends); }, [questionnaireSends, loaded]);

  // Keep every open screen in step with teammates: pull in sections other people
  // have changed, merge rather than overwrite on clashes, and keep the team list fresh.
  const [syncNotice, setSyncNotice] = useState(null);
  useEffect(() => {
    if (!loaded) return;
    const setters = {
      posts: setPosts, campaigns: setCampaigns, ads: setAds, articles: setArticles, products: setProducts,
      case_studies: setCaseStudies, connections: setConnectionsState, leads: setLeads, companies: setCompanies,
      contacts: setContacts, activities: setActivities, tasks: setTasks, documents: setDocuments, assets: setAssets,
      brand: setBrandState, company_info: setCompanyInfoState, personas: setPersonas, markets: setMarkets,
      questionnaire_templates: setQuestionnaireTemplates, questionnaire_submissions: setQuestionnaireSubmissions,
      questionnaire_sends: setQuestionnaireSends,
    };
    const labels = {
      posts: "Publish", campaigns: "Campaigns", ads: "Ads", articles: "Articles", products: "Products",
      case_studies: "Case Studies", connections: "Connections", leads: "Leads", companies: "Companies",
      contacts: "Contacts", activities: "Activity", tasks: "Tasks", documents: "Documents", assets: "Assets",
      brand: "Brand", company_info: "Company Info", personas: "Target Audience", markets: "Target Audience",
      questionnaire_templates: "Questionnaires", questionnaire_submissions: "Questionnaire responses",
      questionnaire_sends: "Questionnaire sends",
    };
    let noticeTimer = null;
    function notify(text) {
      setSyncNotice(text);
      if (noticeTimer) clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => setSyncNotice(null), 5000);
    }
    __sync.onMerged = (key, merged) => {
      if (setters[key]) setters[key](merged);
      notify(`A teammate changed ${labels[key] || key} at the same time — both sets of changes have been kept.`);
    };
    let stopped = false, checking = false, ticks = 0;
    async function refreshTeam() {
      try { const m = await apiListMembers(token); if (!stopped) setTeamMembers(m); } catch (e) {}
    }
    async function check(force) {
      if (stopped || checking) return;
      if (!force && document.visibilityState === "hidden") return;
      checking = true;
      try {
        const res = await fetch("/api/data?versions=1", { headers: __authHeaders(), cache: "no-store" });
        if (!res.ok) return;
        const { versions } = await res.json();
        const changed = new Set();
        for (const [key, v] of Object.entries(versions || {})) {
          if (!setters[key] || __sync.versions[key] === v || __hasPending(key)) continue;
          const r = await fetch(`/api/data?key=${encodeURIComponent(key)}`, { headers: __authHeaders(), cache: "no-store" });
          if (!r.ok) continue;
          const j = await r.json();
          if (stopped || __hasPending(key)) continue;
          __sync.versions[key] = j.version || "none";
          if (j.value === null || j.value === undefined) { __sync.confirmed[key] = undefined; continue; }
          __sync.confirmed[key] = JSON.stringify(j.value);
          setters[key](j.value);
          changed.add(labels[key] || key);
        }
        if (changed.size) notify(`Updated with a teammate's latest changes: ${[...changed].join(", ")}.`);
      } catch (e) {
      } finally {
        checking = false;
      }
      ticks++;
      if (force || ticks % 3 === 0) refreshTeam();
    }
    const iv = setInterval(() => check(false), 20000);
    const onFocus = () => check(true);
    const onVisible = () => { if (document.visibilityState === "visible") check(true); };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      stopped = true; clearInterval(iv); if (noticeTimer) clearTimeout(noticeTimer);
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVisible);
      __sync.onMerged = null;
    };
  }, [loaded, token]);
  useEffect(() => { if (tab === "team") apiListMembers(token).then(setTeamMembers).catch(() => {}); }, [tab, token]);

  function setConnections(c) { setConnectionsState(c); }

function mockRevise(caption, instruction) {
  let text = caption;
  const inst = instruction.toLowerCase();
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  let matched = false;

  if (/short|shorten|concise|brief|trim|tighter/.test(inst) && sentences.length > 1) {
    text = sentences[0];
    matched = true;
  }
  if (/longer|expand|more detail|elaborate|add more/.test(inst)) {
    text = `${text} Here's a bit more context on why this matters right now.`;
    matched = true;
  }
  if (/casual|friendly|fun|playful|relaxed/.test(inst)) {
    text = text.replace(/^Here's an update on/i, "Quick update —").replace(/\.$/, "!");
    matched = true;
  }
  if (/professional|formal|serious|business/.test(inst)) {
    text = text.replace(/!/g, ".").replace(/^Quick update —/i, "Update:");
    matched = true;
  }
  if (/call.to.action|\bcta\b/.test(inst)) {
    if (!/learn more|sign up|book|shop|subscribe|get started/i.test(text)) text = `${text} Learn more today.`;
    matched = true;
  }
  if (/question|engage|\bask\b/.test(inst)) {
    if (!text.trim().endsWith("?")) text = `${text} What do you think?`;
    matched = true;
  }
  if (/urgen|hurry|limited|deadline/.test(inst)) {
    text = `${text} Don't wait — this won't last.`;
    matched = true;
  }
  return { text: text.trim(), matched };
}

function PublishView({ posts, campaigns, connections, setTab, addPost, updatePost, deletePost }) {
  const [showForm, setShowForm] = useState(false);

  const [draft, setDraft] = useState(emptyDraft);
  const [aiInstruction, setAiInstruction] = useState("");
  const [revising, setRevising] = useState(false);
  const [reviseNote, setReviseNote] = useState("");
  const [platformError, setPlatformError] = useState("");
  const sorted = useMemo(() => [...posts].sort((a, b) => a.date.localeCompare(b.date)), [posts]);
  const campaignName = id => { const c = campaigns.find(c => c.id === id); return c ? c.name : null; };

  function openNew() {
    const firstConnected = PLATFORMS.find(p => isPlatformConnected(p.id, connections));
    setDraft({ ...emptyDraft, platform: firstConnected ? firstConnected.id : "other" });
    setEditingId(null); setAiInstruction(""); setReviseNote(""); setPlatformError(""); setShowForm(true);
  }
  function openEdit(p) { setDraft({ date: p.date, platform: p.platform, content: p.content, hashtags: p.hashtags || "", status: p.status, campaignId: p.campaignId || "", link: p.link || "" }); setEditingId(p.id); setAiInstruction(""); setReviseNote(""); setPlatformError(""); setShowForm(true); }
  function submit() {
    if (!draft.content.trim()) return;
    if (!isPlatformConnected(draft.platform, connections)) {
      setPlatformError(`Connect ${platformInfo(draft.platform).label} before scheduling to it.`);
      return;
    }
    setPlatformError("");
    if (editingId) updatePost(editingId, draft); else addPost(draft);
    setShowForm(false);
  }
  function reviseWithAI() {
    if (!aiInstruction.trim() || !draft.content.trim()) return;
    setRevising(true);
    setReviseNote("");
    setTimeout(() => {
      const result = mockRevise(draft.content, aiInstruction);
      setDraft(prev => ({ ...prev, content: result.text }));
      setReviseNote(result.matched ? "" : `Didn't recognize "${aiInstruction}" — try things like "shorter", "more casual", "add a call to action", or "ask a question". Caption left unchanged.`);
      setRevising(false);
      setAiInstruction("");
    }, 600);
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 28 }}>

const STOPWORDS = new Set(["the","a","an","and","or","of","to","for","in","on","with","our","your","is","are","this","that","new","we","us"]);
function mockHashtags(topic, knowledge) {
  const words = topic.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w && !STOPWORDS.has(w));
  const tags = [...new Set(words)].slice(0, 4).map(w => "#" + w);
  const base = tags.length ? tags : ["#update"];
  if (knowledge && knowledge.name) {
    const nameTag = "#" + knowledge.name.replace(/[^a-z0-9]/gi, "").toLowerCase();
    if (nameTag !== "#" && !base.includes(nameTag)) return [nameTag, ...base].slice(0, 5);
  }
  return base;
}
function applyBrandVoice(text, brand) {
  if (!brand) return text;
  const combined = `${brand.tone || ""} ${(brand.rules || []).join(" ")}`.toLowerCase();
  if (!combined.trim()) return text;
  let out = text;
  if (/short|concise|brief|to the point/.test(combined)) {
    const sentences = out.split(/(?<=[.!?])\s+/).filter(Boolean);
    if (sentences.length > 1) out = sentences[0];
  }
  if (/no exclamation|never use exclamation|avoid exclamation|no !/.test(combined)) {
    out = out.replace(/!/g, ".");
  }
  if (/casual|friendly|warm|approachable/.test(combined) && !/formal|professional/.test(combined)) {
    out = out.replace(/^Here's an update on/i, "Quick update —").replace(/^Here's a clear look at/i, "Let's talk about");
  }
  if (/formal|professional|no slang|no jargon/.test(combined)) {
    out = out.replace(/!/g, ".");
  }
  return out;
}
function mockCaption(topic, tone, platformLabel, knowledge, persona) {
  const openers = {
    Professional: `Here's an update on ${topic.replace(/\.$/, "")}.`,
    Playful: `Guess what? ${topic.replace(/\.$/, "")}!`,
    Bold: `${topic.replace(/\.$/, "")} — and we're not slowing down.`,
    Inspirational: `Every step forward starts somewhere. Today, that's ${topic.replace(/\.$/, "")}.`,
    Informative: `${topic.replace(/\.$/, "")}. Here's what you need to know.`,
  };
  const closers = {
    Instagram: "Tap the link in bio to learn more.",
    LinkedIn: "We'd love to hear your thoughts in the comments.",
    Facebook: "Drop a comment below and let us know what you think.",
    TikTok: "Follow along for more behind-the-scenes.",
    "X / Twitter": "More details soon.",
    YouTube: "Full video coming to the channel this week.",
    Email: "Reply to this email with any questions.",
    Other: "Stay tuned for more.",
  };
  let body = openers[tone] || openers.Professional;
  if (persona && persona.painPoints && persona.painPoints.length) {
    body += ` If ${persona.painPoints[0].replace(/\.$/, "").toLowerCase()} sounds familiar, this is for you.`;
  }
  if (knowledge && knowledge.keyMessages && knowledge.keyMessages.length) {
    body += " " + knowledge.keyMessages[0];
  }
  const closer = (knowledge && knowledge.cta) ? `${knowledge.cta}.` : (closers[platformLabel] || closers.Other);
  return `${body} ${closer}`;
}

// Shows money in a compact, abbreviated form (e.g. £4.2k, £1.3m) rather than
// spelling out every digit — a pipeline of tens of thousands reads far
// faster this way.
function formatMoney(amount, symbol) {
  const n = Number(amount) || 0;
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  const sym = symbol || "£";
  if (abs >= 1_000_000) return `${sign}${sym}${(abs / 1_000_000).toFixed(1).replace(/\.0$/, "")}m`;
  if (abs >= 1000) return `${sign}${sym}${(abs / 1000).toFixed(1).replace(/\.0$/, "")}k`;
  return `${sign}${sym}${abs.toLocaleString()}`;
}

function mockExtractBrand(rawText) {
  const colors = [...new Set(rawText.match(/#[0-9A-Fa-f]{6}\b/g) || [])].slice(0, 5);
  const lower = rawText.toLowerCase();

  const rules = sentences.filter(s => ruleKeywords.test(s) && s.length > 15 && s.length < 200).slice(0, 4);
  return { colors, fonts, rules };
}
function mockIngest(rawText) {
  const sentences = rawText.replace(/\s+/g, " ").split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 20);
  const keyMessages = sentences.slice(0, 4);
  const lower = rawText.toLowerCase();
  let cta = "Learn more";
  if (lower.includes("sign up")) cta = "Sign up today";
  else if (lower.includes("book a demo") || lower.includes("book demo")) cta = "Book a demo";
  else if (lower.includes("buy") || lower.includes("shop")) cta = "Shop now";
  else if (lower.includes("get started")) cta = "Get started";
  else if (lower.includes("subscribe")) cta = "Subscribe today";
  return { keyMessages, cta };
}

function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function SourceFixPanel({ source, gaps, onUpdateSource, onAfterSave }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [revised, setRevised] = useState(null); // { changes }
  const [editedText, setEditedText] = useState("");
  const [saved, setSaved] = useState(false);

  async function generate() {
    setError(""); setLoading(true); setSaved(false);
    try {
      const data = await apiGenerate("document_revise", { text: source.text, gaps: gaps || [] });
      setRevised({ changes: data.changes || [] });
      setEditedText(data.revisedText || "");
    } catch (err) {
      setError(err.message || "Couldn't generate a revision right now.");
    }
    setLoading(false);
  }

  function saveToSource() {
    onUpdateSource(editedText);
    setSaved(true);
    if (onAfterSave) onAfterSave();
  }

  function download() {
    const base = (source.label || "document").replace(/\.[^.]+$/, "").replace(/[^a-z0-9\-_ ]/gi, "").trim() || "document";
    downloadTextFile(`${base}-revised.txt`, editedText);
  }

  if (!revised) {
    return (
      <div style={{ marginTop: 10 }}>
        <button onClick={generate} disabled={loading} style={{ background: "none", border: `1px solid ${C.purple}`, color: C.purple, padding: "5px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: loading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name={loading ? "loader-2" : "pen-square"} size={11} className={loading ? "spin" : ""} />
          {loading ? "Reviewing document…" : "Fix with AI"}
        </button>
        {error && <div style={{ fontSize: 11.5, color: "#E5484D", marginTop: 6 }}>{error}</div>}
      </div>
    );
  }

  return (
    <div style={{ marginTop: 10, background: C.surface, border: `1px solid ${C.purple}`, borderRadius: 8, padding: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 8, color: C.ink }}>Suggested revision — review and edit before saving</div>
      {revised.changes.length > 0 && (
        <ul style={{ margin: "0 0 10px", paddingLeft: 16 }}>
          {revised.changes.map((c, i) => <li key={i} style={{ fontSize: 11, color: C.inkMuted, marginBottom: 3, lineHeight: 1.4 }}>{c}</li>)}
        </ul>
      )}
      <textarea value={editedText} onChange={e => setEditedText(e.target.value)} rows={10} style={{ ...inputStyle, width: "100%", resize: "vertical", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5 }} />
      <div style={{ fontSize: 10.5, color: C.amber, marginTop: 6 }}>Look for [NEEDS INPUT: ...] markers and fill those in with the real answer before saving — the AI won't invent facts your source didn't have.</div>
      <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
        <button onClick={saveToSource} style={{ background: saved ? C.green : C.purple, color: "#fff", border: "none", padding: "6px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name={saved ? "check" : "pen-square"} size={11} />
          {saved ? "Saved" : "Save as reference text"}
        </button>
        <button onClick={download} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "6px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="package" size={11} /> Download .txt
        </button>
        <button onClick={() => { setRevised(null); setError(""); }} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}>Discard</button>
      </div>
    </div>
  );
}

                ))}
              </div>
            </div>
          )}
          {detail === "basic" && (gaps.length > 0 || suggestions.length > 0) && (
            <div style={{ fontSize: 11, color: C.amber, marginBottom: 8 }}>
              {gaps.length > 0 ? `${gaps.length} gap${gaps.length === 1 ? "" : "s"}` : ""}
              {gaps.length > 0 && suggestions.length > 0 ? " · " : ""}
              {suggestions.length > 0 ? `${suggestions.length} content idea${suggestions.length === 1 ? "" : "s"}` : ""}
              {" — switch to Detailed to see them."}
            </div>
          )}
          <div style={{ fontSize: 10, color: C.inkFaint }}>Based on {aiOverview.sourceCount} document{aiOverview.sourceCount === 1 ? "" : "s"} as of {formatDate(aiOverview.generatedDate)}. Add more sources and regenerate to refine this.</div>
        </div>
      )}
    </div>
  );
}

function ProductForm({ draft, setDraft, onCancel, onSave, isEdit, setTab, setPendingTopic }) {
  const online = useOnline();
  const initialDraftRef = React.useRef(draft);
  useUnsavedGuard(JSON.stringify(draft) !== JSON.stringify(initialDraftRef.current));
  const [raw, setRaw] = useState("");
  const [ingesting, setIngesting] = useState(false);
  const [newMessage, setNewMessage] = useState("");
  const [fileLoading, setFileLoading] = useState(false);
  const [fileError, setFileError] = useState("");
  const [sourceLabels, setSourceLabels] = useState([]);
  const [queuedFile, setQueuedFile] = useState(null);
  const [expandedSource, setExpandedSource] = useState(null);
  const [overviewLoading, setOverviewLoading] = useState(false);
  const [overviewError, setOverviewError] = useState("");
  const [overviewJustUpdated, setOverviewJustUpdated] = useState(false);
  const fileInputRef = React.useRef(null);
  const sources = draft.sources || [];
  const overviewFingerprint = JSON.stringify({ sources: sources.map(s => s.text), keyMessages: draft.keyMessages, description: draft.description, audience: draft.audience, cta: draft.cta });

  async function regenerateOverview() {
    const combinedText = sources.map(s => s.text).filter(Boolean).join("\n\n---\n\n");
    if (!combinedText.trim()) { setOverviewError("Add some reference documents first."); return; }
    setOverviewError(""); setOverviewLoading(true); setOverviewJustUpdated(false);
    try {
      const data = await generateEntityOverviewData(combinedText, draft.name || "this product", "product");
      setDraft(prev => ({ ...prev, aiOverview: { ...data, generatedDate: todayISO(), sourceCount: sources.length, fingerprint: overviewFingerprint } }));
      setOverviewJustUpdated(true);
    } catch (err) {
      setOverviewError(err.message || "Couldn't generate an overview right now.");
    }
    setOverviewLoading(false);
  }

  function draftSuggestionInStudio(suggestion) {
    if (setPendingTopic && setTab) { setPendingTopic(suggestion); setTab("studio"); }
  }

  async function processFile(file) {
    const text = await processUploadedFileShared(file);
    setRaw(prev => prev ? `${prev}\n\n${text}` : text);
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError("");
    setSourceLabels(prev => [...prev, file.name]);
    const name = file.name.toLowerCase();
    const needsNetwork = name.endsWith(".pdf") || name.endsWith(".docx") || name.endsWith(".png") || name.endsWith(".jpg") || name.endsWith(".jpeg");
    if (needsNetwork && !online) {
      setQueuedFile(file);
      if (fileInputRef.current) fileInputRef.current.value = "";
      return;
    }
    setFileLoading(true);
    try {
      await processFile(file);
    } catch (err) {
      setFileError(err.message || "Couldn't read that file.");
    }
    setFileLoading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  useEffect(() => {
    if (online && queuedFile) {
      const f = queuedFile;
      setQueuedFile(null);
      setFileLoading(true);
      processFile(f)
        .catch(err => setFileError(err.message || "Couldn't read that file."))
        .then(() => setFileLoading(false));
    }
  }, [online]);

  function runIngestion() {
    if (!raw.trim()) return;
    setIngesting(true);
    setTimeout(() => {
      const extracted = mockIngest(raw);
      const labels = sourceLabels.length ? sourceLabels : ["Pasted text"];
      const combinedLabel = labels.join(" + ");
      const sourceType = labels.length > 1 ? "mixed" : (labels[0] === "Pasted text" ? "paste" : "file");
      const newSource = { id: uid(), type: sourceType, label: combinedLabel, date: todayISO(), text: raw.slice(0, 4000) };
      setDraft(prev => ({
        ...prev,
        keyMessages: [...prev.keyMessages, ...extracted.keyMessages].slice(0, 6),
        cta: prev.cta || extracted.cta,
        description: prev.description || raw.trim().slice(0, 240),
        sources: [newSource, ...(prev.sources || [])],
      }));
      setRaw(""); setSourceLabels([]);
      setIngesting(false);
    }, 700);
  }

  function removeSource(id) { setDraft(prev => ({ ...prev, sources: (prev.sources || []).filter(s => s.id !== id) })); }
  function updateSourceText(id, newText) { setDraft(prev => ({ ...prev, sources: (prev.sources || []).map(s => s.id === id ? { ...s, text: newText } : s) })); }

  function removeMessage(i) { setDraft(prev => ({ ...prev, keyMessages: prev.keyMessages.filter((_, idx) => idx !== i) })); }
  function addMessage() {
    if (!newMessage.trim()) return;
    setDraft(prev => ({ ...prev, keyMessages: [...prev.keyMessages, newMessage.trim()] }));
    setNewMessage("");
  }

  return (
    <div style={{ background: C.surface, border: `1px solid ${C.purple}`, borderRadius: 10, padding: 20, marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, margin: 0 }}>{isEdit ? "Edit product" : "New product"}</h3>
        <button onClick={onCancel} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted }}><Icon name="x" size={16} /></button>
      </div>
      <div style={{ fontSize: 12, color: C.inkMuted, marginBottom: 16 }}>
        Ingest raw product info once — Studio and Ads can both draw on it.
      </div>

      <AiOverviewPanel sources={sources} aiOverview={draft.aiOverview} fingerprint={overviewFingerprint} loading={overviewLoading} error={overviewError} justUpdated={overviewJustUpdated} onRegenerate={regenerateOverview} onDraftSuggestion={draftSuggestionInStudio} />

      <Field label="Product / business name"><input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Rewards+" /></Field>

      <div style={{ marginTop: 12 }}>
        <Field label="Paste content to ingest (website copy, one-pager, brief)">
          <textarea value={raw} onChange={e => setRaw(e.target.value)} rows={4} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="Paste product description, website copy, or a brand brief here…" />
        </Field>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
        <input ref={fileInputRef} type="file" accept={FILE_UPLOAD_ACCEPT} onChange={handleFile} style={{ display: "none" }} />
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={fileLoading}
          style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "8px 14px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: fileLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name={fileLoading ? "loader-2" : "package"} size={14} className={fileLoading ? "spin" : ""} />
          {fileLoading ? "Reading file…" : "Upload a file"}
        </button>
        <span style={{ fontSize: 11, color: C.inkFaint }}>{FILE_UPLOAD_HINT} — text is appended above</span>
      </div>
      {queuedFile && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: C.amber, marginTop: 8 }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.amber, display: "inline-block", flexShrink: 0 }}></span>
          You're offline — "{queuedFile.name}" will be read automatically once you're back online. Keep this form open until then.
        </div>
      )}
      {sourceLabels.length > 0 && !fileLoading && !fileError && !queuedFile && <div style={{ fontSize: 12, color: C.teal, marginTop: 6 }}>Added text from {sourceLabels[sourceLabels.length - 1]}</div>}
      {fileError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 6 }}>{fileError}</div>}
      {!online && (
        <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 8, lineHeight: 1.5 }}>
          Note: while offline, Studio and Ads can only draw on product info already saved here — anything still waiting in an unread file won't be included until it's processed.
        </div>
      )}

      <button onClick={runIngestion} disabled={ingesting || !raw.trim()} style={{ marginTop: 14, background: C.purple, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: ingesting ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8 }}>
        <Icon name={ingesting ? "loader-2" : "pen-square"} size={14} className={ingesting ? "spin" : ""} />
        {ingesting ? "Ingesting…" : "Run AI ingestion"}
      </button>

      {sources.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>Reference files</div>
          <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 10 }}>Every document, paste, or combined upload used to build this product — kept for reference, not just used once and discarded.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {sources.map(s => (
              <div key={s.id} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Icon name={s.type === "paste" ? "pen-square" : "package"} size={13} color={C.inkFaint} />
                  <div style={{ flex: 1, fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.label}</div>
                  <div style={{ fontSize: 10.5, color: C.inkFaint, flexShrink: 0 }}>{formatDate(s.date)}</div>
                  <button onClick={() => setExpandedSource(expandedSource === s.id ? null : s.id)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, flexShrink: 0 }}>
                    <Icon name={expandedSource === s.id ? "chevron-up" : "chevron-down"} size={14} />
                  </button>
                  <DeleteButton onDelete={() => removeSource(s.id)} itemName={s.label || "this source"} iconName="x" style={{ color: C.inkFaint, flexShrink: 0 }} size={13} />
                </div>
                {expandedSource === s.id && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
                    <div style={{ fontSize: 11.5, color: C.inkMuted, lineHeight: 1.5, maxHeight: 180, overflowY: "auto", whiteSpace: "pre-wrap" }}>{s.text}</div>
                    <SourceFixPanel source={s} gaps={(draft.aiOverview && draft.aiOverview.gaps) || []} onUpdateSource={newText => updateSourceText(s.id, newText)} onAfterSave={regenerateOverview} />
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ marginTop: 18 }}>
        <Field label="Description"><textarea value={draft.description} onChange={e => setDraft({ ...draft, description: e.target.value })} rows={2} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="Short summary of the product or business" /></Field>
      </div>

      <div style={{ display: "flex", gap: 12, marginTop: 12 }}>
        <Field label="Audience"><input value={draft.audience} onChange={e => setDraft({ ...draft, audience: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Existing customers" /></Field>
        <Field label="Preferred CTA"><input value={draft.cta} onChange={e => setDraft({ ...draft, cta: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Book a demo" /></Field>
      </div>

      <div style={{ marginTop: 12 }}>
        <Field label="Website page (optional)"><input value={draft.website} onChange={e => setDraft({ ...draft, website: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. https://yourbusiness.com/rewards" /></Field>
        <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 4 }}>Studio and Ads can reference this real link when generating content, instead of a placeholder.</div>
      </div>

      <div style={{ marginTop: 16 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500 }}>Key messages</label>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 6 }}>
          {draft.keyMessages.map((m, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px" }}>
              <div style={{ flex: 1, fontSize: 12.5 }}>{m}</div>
              <DeleteButton onDelete={() => removeMessage(i)} itemName="this key message" iconName="x" size={13} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <input value={newMessage} onChange={e => setNewMessage(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="Add a key message manually"
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addMessage(); } }} />
          <button onClick={addMessage} style={{ background: "none", border: `1px solid ${C.border}`, padding: "0 14px", borderRadius: 6, color: C.ink, cursor: "pointer" }}>Add</button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
        <button onClick={onSave} style={{ background: C.purple, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>{isEdit ? "Save changes" : "Save product"}</button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Cancel</button>
      </div>
    </div>
  );
}

function ProductsPanel({ products, addProduct, updateProduct, deleteProduct, posts, articles, setTab, setPendingTopic }) {
  const [showForm, setShowForm] = useState(products.length === 0);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(emptyProductDraft);
  const [expandedContentId, setExpandedContentId] = useState(null);

  function openNew() { setDraft(emptyProductDraft); setEditingId(null); setShowForm(true); }
  function openEdit(p) { setDraft({ name: p.name, description: p.description, keyMessages: p.keyMessages, audience: p.audience, cta: p.cta, website: p.website || "", sources: p.sources || [], aiOverview: p.aiOverview || null }); setEditingId(p.id); setShowForm(true); }
  function save() {
    if (!draft.name.trim()) return;
    if (editingId) updateProduct(editingId, draft); else addProduct(draft);
    setShowForm(false);
  }
  function contentFor(productId) {
    const linkedPosts = (posts || []).filter(p => p.productId === productId);
    const linkedArticles = (articles || []).filter(a => a.productId === productId);
    return { linkedPosts, linkedArticles, total: linkedPosts.length + linkedArticles.length };
  }

  return (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, margin: 0 }}>Products</h3>
        {!showForm && (
          <button onClick={openNew} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: `1px solid ${C.purple}`, color: C.purple, padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            <Icon name="plus" size={13} /> Add product
          </button>
        )}
      </div>

      {products.length > 0 && !showForm && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 4 }}>
          {products.map(p => {
            const { linkedPosts, linkedArticles, total } = contentFor(p.id);
            const expanded = expandedContentId === p.id;
            return (
              <div key={p.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13 }}>{p.name}</div>
                    <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 2 }}>{p.keyMessages.length} key message{p.keyMessages.length === 1 ? "" : "s"} · CTA: {p.cta || "—"}</div>
                  </div>
                  <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                    <button onClick={() => setExpandedContentId(expanded ? null : p.id)} style={{ background: "none", border: "none", color: total ? C.cyan : C.inkFaint, fontSize: 11.5, cursor: total ? "pointer" : "default", textDecoration: total ? "underline" : "none" }}>
                      {total} content item{total === 1 ? "" : "s"}
                    </button>
                    <button onClick={() => openEdit(p)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, padding: 2 }}><Icon name="pencil" size={14} /></button>
                    <DeleteButton onDelete={() => deleteProduct(p.id)} itemName={p.name} size={14} />
                  </div>
                </div>
                {expanded && total > 0 && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}`, display: "flex", flexDirection: "column", gap: 8 }}>
                    {linkedPosts.map(post => (
                      <div key={post.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12 }}>
                        <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, marginRight: 10 }}>
                          <Icon name="pen-square" size={11} color={C.inkFaint} /> <span style={{ color: C.inkMuted }}>{platformInfo(post.platform).label} post</span> — {post.content}
                        </div>
                        <div style={{ color: C.inkFaint, flexShrink: 0 }}>{formatDate(post.date)}</div>
                      </div>
                    ))}
                    {linkedArticles.map(a => (
                      <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12 }}>
                        <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, marginRight: 10 }}>
                          <Icon name="package" size={11} color={C.inkFaint} /> <span style={{ color: C.inkMuted }}>Article</span> — {a.title}
                        </div>
                        <div style={{ color: C.inkFaint, flexShrink: 0 }}>{formatDate(a.date)}</div>
                      </div>
                    ))}
                    {setTab && <button onClick={() => setTab("publish")} style={{ background: "none", border: "none", color: C.cyan, fontSize: 11.5, cursor: "pointer", textDecoration: "underline", textAlign: "left", marginTop: 2 }}>Open Publish calendar</button>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {products.length === 0 && !showForm && (
        <div style={{ fontSize: 12, color: C.inkMuted }}>No products yet. Add one so Studio and Ads can draw on real product info.</div>
      )}

      {showForm && <ProductForm draft={draft} setDraft={setDraft} onCancel={() => setShowForm(false)} onSave={save} isEdit={!!editingId} setTab={setTab} setPendingTopic={setPendingTopic} />}
    </div>
  );
}

function ImagePicker({ imageDataUrl, onChange, brand }) {
  const fileRef = React.useRef(null);
  const [showBrandPicker, setShowBrandPicker] = useState(false);
  const brandImages = [
    ...(brand && brand.logoDataUrl ? [{ id: "__logo", label: "Logo", dataUrl: brand.logoDataUrl }] : []),
    ...((brand && brand.assets) || []).filter(a => a.mediaType && a.mediaType.startsWith("image/")).map(a => ({ id: a.id, label: a.label, dataUrl: a.dataUrl })),
  ];
  async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Couldn't read that image."));
        reader.readAsDataURL(file);
      });
      onChange(dataUrl);
    } catch (e) {}
    if (fileRef.current) fileRef.current.value = "";
  }
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12, color: C.inkMuted, marginBottom: 8, fontWeight: 600 }}>Image (optional)</div>
      {imageDataUrl ? (
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <img src={imageDataUrl} style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.border}` }} />
          <DeleteButton onDelete={() => onChange("")} itemName="this image" label="Remove" message="This can't be undone — you'll need to upload it again if you want it back." />
        </div>
      ) : (
        <div style={{ display: "flex", gap: 8, position: "relative" }}>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleUpload} style={{ display: "none" }} />
          <button onClick={() => fileRef.current && fileRef.current.click()} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Upload image</button>
          {brandImages.length > 0 && (
            <button onClick={() => setShowBrandPicker(!showBrandPicker)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Use from Brand assets</button>
          )}
          {showBrandPicker && (
            <div style={{ position: "absolute", top: "110%", left: 0, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 10, zIndex: 10, display: "flex", gap: 8, flexWrap: "wrap", width: 290, boxShadow: "0 10px 30px rgba(0,0,0,0.4)" }}>
              {brandImages.map(img => (
                <button key={img.id} onClick={() => { onChange(img.dataUrl); setShowBrandPicker(false); }} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, width: 70 }}>

function CaseStudyAiAssist({ onGenerated, onCancel, products }) {
  const [raw, setRaw] = useState("");
  const [fileLoading, setFileLoading] = useState(false);
  const [fileError, setFileError] = useState("");
  const [fileLabel, setFileLabel] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const fileInputRef = React.useRef(null);

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileError(""); setFileLoading(true);
    try {
      const text = await processUploadedFileShared(file);
      setRaw(prev => prev ? `${prev}\n\n${text}` : text);
      setFileLabel(file.name);
    } catch (err) {
      setFileError(err.message || "Couldn't read that file.");
    }
    setFileLoading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  async function generate() {
    if (!raw.trim()) { setError("Paste some source text or upload a file first."); return; }
    setError(""); setLoading(true);
    try {
      const data = await apiGenerate("case_study_extract", { text: raw, products });
      onGenerated({
        title: data.title || "", client: data.client || "", industry: data.industry || "", location: data.location || "",
        overview: data.overview || "", challenge: data.challenge || "", approach: data.approach || "",
        keyFindings: data.keyFindings || [], metrics: data.metrics || [],
        outcome: data.outcome || "", insight: data.insight || "", tagline: data.tagline || "",
        ctaText: "For further information, contact us.", status: "draft", productIds: [], sources: [{ id: uid(), label: fileLabel || "Pasted text", date: todayISO() }],
      });
    } catch (err) {
      setError(err.message || "Couldn't generate a case study — the AI engine may be unavailable.");
    }
    setLoading(false);
  }

  return (
    <div style={{ maxWidth: 600, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22 }}>
      <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 16 }}>Paste a rough draft, interview notes, or an existing write-up, and AI will restructure it into the standard case-study format — which you can then review and edit before saving.</div>
      <textarea value={raw} onChange={e => setRaw(e.target.value)} rows={8} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="Paste source material here…" />
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
        <input ref={fileInputRef} type="file" accept={FILE_UPLOAD_ACCEPT} onChange={handleFile} style={{ display: "none" }} />
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={fileLoading}
          style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: fileLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name={fileLoading ? "loader-2" : "package"} size={13} className={fileLoading ? "spin" : ""} />
          {fileLoading ? "Reading file…" : "Upload a file"}
        </button>
        <span style={{ fontSize: 11, color: C.inkFaint }}>{FILE_UPLOAD_HINT}</span>
      </div>
      {fileError && <div style={{ fontSize: 12, color: "#E5484D", marginTop: 6 }}>{fileError}</div>}
      {fileLabel && !fileLoading && <div style={{ fontSize: 12, color: C.teal, marginTop: 6 }}>Added text from {fileLabel}</div>}
      {error && <div style={{ fontSize: 12.5, color: "#E5484D", marginTop: 14 }}>{error}</div>}
      <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
        <button onClick={generate} disabled={loading} style={{ background: C.orange, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: loading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8, opacity: loading ? 0.7 : 1 }}>
          <Icon name={loading ? "loader-2" : "pen-square"} size={14} className={loading ? "spin" : ""} />
          {loading ? "Structuring your case study…" : "Generate case study"}
        </button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Cancel</button>
      </div>
    </div>
  );
}

function CaseStudyEditor({ draft, setDraft, onCancel, onSave, isEdit, products, companyInfo }) {
  const [showPreview, setShowPreview] = useState(false);
  const [newFinding, setNewFinding] = useState("");
  const [newMetric, setNewMetric] = useState({ label: "", result: "" });

  function toggleProduct(id) { setDraft({ ...draft, productIds: draft.productIds.includes(id) ? draft.productIds.filter(p => p !== id) : [...draft.productIds, id] }); }
  function addFinding() { if (!newFinding.trim()) return; setDraft({ ...draft, keyFindings: [...draft.keyFindings, newFinding.trim()] }); setNewFinding(""); }
  function removeFinding(i) { setDraft({ ...draft, keyFindings: draft.keyFindings.filter((_, idx) => idx !== i) }); }
  function addMetric() { if (!newMetric.label.trim() || !newMetric.result.trim()) return; setDraft({ ...draft, metrics: [...draft.metrics, newMetric] }); setNewMetric({ label: "", result: "" }); }
  function removeMetric(i) { setDraft({ ...draft, metrics: draft.metrics.filter((_, idx) => idx !== i) }); }

  return (
    <div style={{ maxWidth: 680 }}>
      <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
        <Field label="Title"><input value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="A compelling headline" /></Field>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
        <Field label="Client"><input value={draft.client} onChange={e => setDraft({ ...draft, client: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="Client / project name (or keep anonymous)" /></Field>
        <Field label="Industry"><input value={draft.industry} onChange={e => setDraft({ ...draft, industry: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Oil & Gas" /></Field>
        <Field label="Location"><input value={draft.location} onChange={e => setDraft({ ...draft, location: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="Optional" /></Field>

      {products && products.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Products/tools used</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {products.map(p => {
              const active = draft.productIds.includes(p.id);
              return (
                <button key={p.id} onClick={() => toggleProduct(p.id)} style={{
                  padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                  border: active ? `1px solid ${C.orange}` : `1px solid ${C.border}`,
                  background: active ? `${C.orange}22` : "transparent", color: active ? C.ink : C.inkMuted }}>

      <div style={{ marginBottom: 16 }}><Field label="The Challenge"><textarea value={draft.challenge} onChange={e => setDraft({ ...draft, challenge: e.target.value })} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} /></Field></div>
      <div style={{ marginBottom: 16 }}><Field label="The Vi-Tech Approach"><textarea value={draft.approach} onChange={e => setDraft({ ...draft, approach: e.target.value })} rows={4} style={{ ...inputStyle, width: "100%", resize: "vertical" }} /></Field></div>

        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Key findings (optional)</label>

          <button onClick={addFinding} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "0 14px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Add</button>
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Results table (optional)</label>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {draft.metrics.map((m, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 12px" }}>
              <span style={{ flex: 1, fontSize: 12.5, fontWeight: 600 }}>{m.label}</span>
              <span style={{ flex: 1, fontSize: 12.5, color: C.inkMuted }}>{m.result}</span>
              <DeleteButton onDelete={() => removeMetric(i)} itemName={m.label || "this metric"} iconName="x" size={13} />

          ))}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={newMetric.label} onChange={e => setNewMetric({ ...newMetric, label: e.target.value })} style={{ ...inputStyle, flex: 1 }} placeholder="Metric, e.g. Team Collaboration" />
          <input value={newMetric.result} onChange={e => setNewMetric({ ...newMetric, result: e.target.value })} style={{ ...inputStyle, flex: 1 }} placeholder="Result, e.g. Observed throughout all tiers" onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addMetric(); } }} />
          <button onClick={addMetric} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "0 14px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Add</button>
        </div>
      </div>

      <div style={{ marginBottom: 16 }}><Field label="Outcome and Impact"><textarea value={draft.outcome} onChange={e => setDraft({ ...draft, outcome: e.target.value })} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} /></Field></div>
      <div style={{ marginBottom: 16 }}><Field label="Closing insight"><textarea value={draft.insight} onChange={e => setDraft({ ...draft, insight: e.target.value })} rows={2} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder='"This case study demonstrates/highlights..."' /></Field></div>
      <div style={{ marginBottom: 16 }}><Field label="Closing tagline"><input value={draft.tagline} onChange={e => setDraft({ ...draft, tagline: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="A short, punchy one-liner" /></Field></div>
      <div style={{ marginBottom: 24 }}><Field label="Contact CTA"><input value={draft.ctaText} onChange={e => setDraft({ ...draft, ctaText: e.target.value })} style={{ ...inputStyle, width: "100%" }} /></Field></div>

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500 }}>Status</label>
        <ModeButton active={draft.status !== "published"} onClick={() => setDraft({ ...draft, status: "draft" })}>Draft</ModeButton>
        <ModeButton active={draft.status === "published"} onClick={() => setDraft({ ...draft, status: "published" })}>Published</ModeButton>
        <span style={{ fontSize: 10.5, color: C.inkFaint }}>Published marks it ready to feed the website — pushing it live still needs your website's own publishing step.</span>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
        <button onClick={onSave} style={{ background: C.orange, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>{isEdit ? "Save changes" : "Create case study"}</button>
        <button onClick={() => setShowPreview(!showPreview)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="eye" size={14} /> {showPreview ? "Hide preview" : "Preview"}
        </button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Cancel</button>
      </div>

      {showPreview && <CaseStudyPreview cs={draft} />}
    </div>
  );
}

const emptyPersonaDraft = { name: "", role: "", marketId: "", preferredTone: "Professional", painPoints: [], language: [], goals: "" };
const emptyMarketDraft = { name: "", region: "", industry: "", description: "" };

function TagListEditor({ items, onAdd, onRemove, placeholder }) {
  const [value, setValue] = useState("");
  function submit() { if (!value.trim()) return; onAdd(value.trim()); setValue(""); }
  return (
    <div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
        {items.map((it, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px" }}>
            <div style={{ flex: 1, fontSize: 12.5 }}>{it}</div>
            <DeleteButton onDelete={() => onRemove(i)} itemName="this item" iconName="x" size={13} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={value} onChange={e => setValue(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder={placeholder}
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submit(); } }} />
        <button onClick={submit} style={{ background: "none", border: `1px solid ${C.border}`, padding: "0 16px", borderRadius: 6, color: C.ink, cursor: "pointer" }}>Add</button>
      </div>
    </div>
  );
}

function MarketForm({ draft, setDraft, onCancel, onSave, isEdit }) {

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700, margin: 0 }}>{isEdit ? "Edit market" : "New market"}</h3>

      <div style={{ display: "flex", gap: 12, marginTop: 12 }}>
        <Field label="Region"><input value={draft.region} onChange={e => setDraft({ ...draft, region: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. United Kingdom" /></Field>

        <Field label="Description"><textarea value={draft.description} onChange={e => setDraft({ ...draft, description: e.target.value })} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder="What defines this market? Who's in it, what's the competitive landscape like?" /></Field>
