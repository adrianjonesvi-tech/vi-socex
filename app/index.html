            {CONSENT_SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={draft.consentBasis || "Consent"} onChange={e => setDraft({ ...draft, consentBasis: e.target.value })} style={{ ...inputStyle, fontSize: 11.5, padding: "6px 8px" }}>
            {CONSENT_BASES.map(b => <option key={b} value={b}>{b}</option>)}
          </select>
        </div>
        {SUPPRESSED_STATUSES.includes(draft.marketingStatus) && (
          <div style={{ fontSize: 10.5, color: C.amber, marginTop: 6, lineHeight: 1.4 }}>This contact will be excluded from every real send, regardless of tags or sector — their record stays, only marketing to them stops.</div>
        )}
        {draft.consentHistory && draft.consentHistory.length > 0 && (
          <div style={{ fontSize: 10, color: C.inkFaint, marginTop: 6 }}>
            History: {draft.consentHistory.map(h => `${h.status} (${formatDate(h.date)})`).join(" → ")}
          </div>
        )}
      </div>
      <textarea value={draft.notes} onChange={e => setDraft({ ...draft, notes: e.target.value })} rows={2} style={{ ...inputStyle, width: "100%", fontSize: 12, resize: "vertical", marginBottom: 10 }} placeholder="Notes (optional)" />
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onSubmit} disabled={!draft.name.trim()} style={{ background: C.rose, color: "#fff", border: "none", padding: "7px 14px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, cursor: draft.name.trim() ? "pointer" : "default", opacity: draft.name.trim() ? 1 : 0.5 }}>{isEdit ? "Save contact" : "Add contact"}</button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 6, fontSize: 12.5, cursor: "pointer" }}>Cancel</button>
      </div>
    </div>
  );
}

function ActivityTimeline({ contactId, activities, onAddActivity, onDeleteActivity }) {
  const [type, setType] = useState("note");
  const [summary, setSummary] = useState("");
  const contactActivities = activities.filter(a => a.contactId === contactId).sort((a, b) => (b.date || b.createdDate).localeCompare(a.date || a.createdDate));

  function submit() {
    if (!summary.trim()) return;
    onAddActivity({ contactId, type, summary: summary.trim(), date: todayISO() });
    setSummary("");
  }

  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <select value={type} onChange={e => setType(e.target.value)} style={{ ...inputStyle, fontSize: 11.5, padding: "5px 8px", width: 110 }}>
          {ACTIVITY_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
        </select>
        <input value={summary} onChange={e => setSummary(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submit(); } }} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder="What happened?" />
        <button onClick={submit} disabled={!summary.trim()} style={{ background: C.rose, color: "#fff", border: "none", padding: "5px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: summary.trim() ? "pointer" : "default", opacity: summary.trim() ? 1 : 0.5 }}>Log</button>
      </div>
      {contactActivities.length === 0 ? (
        <div style={{ fontSize: 11.5, color: C.inkFaint }}>No activity logged yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {contactActivities.map(a => {
            const typeInfo = ACTIVITY_TYPES.find(t => t.id === a.type) || ACTIVITY_TYPES[3];
            return (
              <div key={a.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12 }}>
                <Icon name={typeInfo.icon} size={12} color={C.inkFaint} />
                <div style={{ flex: 1 }}>
                  <span style={{ color: C.inkFaint, fontSize: 11 }}>{formatDate(a.date || a.createdDate)} — </span>
                  <span style={{ color: C.inkMuted }}>{a.summary}</span>
                </div>
                <DeleteButton onDelete={() => onDeleteActivity(a.id)} itemName="this logged activity" iconName="x" style={{ color: C.inkFaint, flexShrink: 0 }} size={11} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TaskList({ contactId, tasks, onAddTask, onUpdateTask, onDeleteTask, teamMembers }) {
  const [title, setTitle] = useState("");
  const [dueDate, setDueDate] = useState(todayISO());
  const [ownerEmail, setOwnerEmail] = useState("");
  const ownTasks = tasks.filter(t => t.contactId === contactId).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  function ownerName(email) {
    const m = teamMembers && teamMembers.find(x => x.email === email);
    return m ? (m.personName || m.email) : email;
  }

  function submit() {
    if (!title.trim()) return;
    onAddTask({ contactId, companyId: "", title: title.trim(), dueDate, completed: false, ownerEmail });
    setTitle("");
  }

  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
      <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        <input value={title} onChange={e => setTitle(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submit(); } }} style={{ ...inputStyle, flex: 1, fontSize: 12, minWidth: 140 }} placeholder="e.g. Follow up on proposal" />
        <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} style={{ ...inputStyle, fontSize: 11.5, padding: "5px 8px", width: 130 }} />
        {teamMembers && teamMembers.length > 0 && (
          <select value={ownerEmail} onChange={e => setOwnerEmail(e.target.value)} style={{ ...inputStyle, fontSize: 11.5, padding: "5px 8px", width: 130 }}>
            <option value="">Unassigned</option>
            {teamMembers.map(m => <option key={m.email} value={m.email}>{m.personName || m.email}</option>)}
          </select>
        )}
        <button onClick={submit} disabled={!title.trim()} style={{ background: C.rose, color: "#fff", border: "none", padding: "5px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: title.trim() ? "pointer" : "default", opacity: title.trim() ? 1 : 0.5 }}>Add</button>
      </div>
      {ownTasks.length === 0 ? (
        <div style={{ fontSize: 11.5, color: C.inkFaint }}>No tasks yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {ownTasks.map(t => {
            const overdue = !t.completed && t.dueDate && t.dueDate < todayISO();
            return (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
                <input type="checkbox" checked={t.completed} onChange={() => onUpdateTask(t.id, { completed: !t.completed })} style={{ cursor: "pointer" }} />
                <div style={{ flex: 1, textDecoration: t.completed ? "line-through" : "none", color: t.completed ? C.inkFaint : C.inkMuted }}>
                  {t.title} <span style={{ fontSize: 10.5, color: overdue ? "#E5484D" : C.inkFaint }}>— {overdue ? "overdue " : "due "}{formatDate(t.dueDate)}</span>
                  {t.ownerEmail && <span style={{ fontSize: 10.5, color: C.inkFaint }}> · {ownerName(t.ownerEmail)}</span>}
                </div>
                <DeleteButton onDelete={() => onDeleteTask(t.id)} itemName={t.title || "this task"} iconName="x" style={{ color: C.inkFaint }} size={11} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DocumentList({ contactId, documents, onAddDocument, onDeleteDocument }) {
  const [showForm, setShowForm] = useState(false);
  const [draft, setDraft] = useState(emptyDocumentDraft);
  const ownDocs = documents.filter(d => d.contactId === contactId);

  function submit() {
    if (!draft.title.trim()) return;
    onAddDocument({ ...draft, contactId });
    setDraft(emptyDocumentDraft);
    setShowForm(false);
  }

  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
      {ownDocs.length === 0 && !showForm && <div style={{ fontSize: 11.5, color: C.inkFaint, marginBottom: 8 }}>No documents yet.</div>}
      {ownDocs.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {ownDocs.map(d => (
            <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px" }}>
              <Icon name="file-text" size={12} color={C.inkFaint} />
              <span style={{ fontSize: 10.5, background: `${C.rose}1A`, color: C.rose, borderRadius: 4, padding: "1px 6px" }}>{d.type}</span>
              <span style={{ flex: 1, color: C.inkMuted }}>{d.title}</span>
              <span style={{ fontSize: 10.5, color: C.inkFaint }}>{formatDate(d.uploadedDate)}</span>
              <DeleteButton onDelete={() => onDeleteDocument(d.id)} itemName={d.title || "this document"} iconName="x" style={{ color: C.inkFaint }} size={11} />
            </div>
          ))}
        </div>
      )}
      {showForm ? (
        <div style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: 10 }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
            <input value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder="Document title" autoFocus />
            <select value={draft.type} onChange={e => setDraft({ ...draft, type: e.target.value })} style={{ ...inputStyle, fontSize: 11.5, width: 130 }}>
              {DOCUMENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <textarea value={draft.text} onChange={e => setDraft({ ...draft, text: e.target.value })} rows={3} style={{ ...inputStyle, width: "100%", fontSize: 11.5, resize: "vertical", marginBottom: 6 }} placeholder="Paste the content or notes for this document (optional)" />
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={submit} disabled={!draft.title.trim()} style={{ background: C.rose, color: "#fff", border: "none", padding: "5px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: draft.title.trim() ? "pointer" : "default", opacity: draft.title.trim() ? 1 : 0.5 }}>Save</button>
            <button onClick={() => { setShowForm(false); setDraft(emptyDocumentDraft); }} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "5px 12px", borderRadius: 6, fontSize: 11.5, cursor: "pointer" }}>Cancel</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setShowForm(true)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.rose, padding: "5px 12px", borderRadius: 6, fontSize: 11.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="plus" size={11} /> Add document
        </button>
      )}
    </div>
  );
}

function ContactRow({ contact, onEdit, onDelete, activities, onAddActivity, onDeleteActivity, tasks, onAddTask, onUpdateTask, onDeleteTask, documents, onAddDocument, onDeleteDocument, teamMembers }) {
  const [expanded, setExpanded] = useState(false);
  const [detailTab, setDetailTab] = useState("timeline");
  const activityCount = activities ? activities.filter(a => a.contactId === contact.id).length : 0;
  const openTaskCount = tasks ? tasks.filter(t => t.contactId === contact.id && !t.completed).length : 0;
  const engagement = activities ? computeEngagementScore(contact.id, activities) : null;
  const canExpand = !!activities;
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 7, padding: "9px 12px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0, cursor: canExpand ? "pointer" : "default", flex: 1 }} onClick={() => canExpand && setExpanded(!expanded)}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{contact.name}</span>
            {contact.jobTitle && <span style={{ fontSize: 11.5, color: C.inkFaint }}>{contact.jobTitle}</span>}
            {SUPPRESSED_STATUSES.includes(contact.marketingStatus) && (
              <span style={{ fontSize: 9.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.3, color: C.amber, border: `1px solid ${C.amber}`, borderRadius: 4, padding: "1px 5px" }}>{contact.marketingStatus}</span>
            )}
            {engagement && engagement.score > 0 && (
              <span title={`Engagement score: ${engagement.score}`} style={{ fontSize: 9.5, fontWeight: 700, color: engagement.color, border: `1px solid ${engagement.color}`, borderRadius: 4, padding: "1px 5px" }}>{engagement.label} · {engagement.score}</span>
            )}
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 2, flexWrap: "wrap" }}>
            {contact.email && <span style={{ fontSize: 11.5, color: C.inkMuted, display: "flex", alignItems: "center", gap: 4 }}><Icon name="mail" size={11} color={C.inkFaint} />{contact.email}</span>}
            {contact.phone && <span style={{ fontSize: 11.5, color: C.inkMuted, display: "flex", alignItems: "center", gap: 4 }}><Icon name="phone" size={11} color={C.inkFaint} />{contact.phone}</span>}
          </div>
          {contact.tags && contact.tags.length > 0 && (
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 5 }}>
              {contact.tags.map(t => <span key={t} style={{ fontSize: 10.5, background: `${C.rose}1A`, color: C.rose, borderRadius: 4, padding: "2px 6px" }}>{t}</span>)}
            </div>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
          {openTaskCount > 0 && <span style={{ fontSize: 10.5, color: C.amber, marginRight: 2 }}>{openTaskCount} open task{openTaskCount === 1 ? "" : "s"}</span>}
          {activities && <span style={{ fontSize: 10.5, color: C.inkFaint, marginRight: 4 }}>{activityCount} logged</span>}
          <button onClick={onEdit} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", padding: 4 }}><Icon name="pencil" size={13} /></button>
          <DeleteButton onDelete={onDelete} itemName={contact.name} message="This can't be undone — their activity history, tasks, and documents will be deleted too." size={13} />
          {canExpand && <button onClick={() => setExpanded(!expanded)} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", padding: 4 }}><Icon name={expanded ? "chevron-up" : "chevron-down"} size={13} /></button>}
        </div>
      </div>
      {expanded && canExpand && (
        <div>
          <div style={{ display: "flex", gap: 4, marginTop: 10 }}>
            {[["timeline", "Timeline"], ["tasks", "Tasks"], ["documents", "Documents"]].map(([id, label]) => (
              <button key={id} onClick={() => setDetailTab(id)} style={{
                background: detailTab === id ? `${C.rose}1A` : "none", border: `1px solid ${detailTab === id ? C.rose : C.border}`,
                color: detailTab === id ? C.rose : C.inkMuted, padding: "4px 10px", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                {label}
              </button>
            ))}
          </div>
          {detailTab === "timeline" && <ActivityTimeline contactId={contact.id} activities={activities} onAddActivity={onAddActivity} onDeleteActivity={onDeleteActivity} />}
          {detailTab === "tasks" && tasks && <TaskList contactId={contact.id} tasks={tasks} onAddTask={onAddTask} onUpdateTask={onUpdateTask} onDeleteTask={onDeleteTask} teamMembers={teamMembers} />}
          {detailTab === "documents" && documents && <DocumentList contactId={contact.id} documents={documents} onAddDocument={onAddDocument} onDeleteDocument={onDeleteDocument} />}
        </div>
      )}
    </div>
  );
}

function CompanyCard({ company, contacts, onUpdateCompany, onDeleteCompany, onAddContact, onUpdateContact, onDeleteContact, activities, onAddActivity, onDeleteActivity, companies, tasks, onAddTask, onUpdateTask, onDeleteTask, documents, onAddDocument, onDeleteDocument, markets, teamMembers }) {
  const [expanded, setExpanded] = useState(false);
  const [editingCompany, setEditingCompany] = useState(false);
  const [companyDraft, setCompanyDraft] = useState(company);
  useUnsavedGuard(editingCompany && JSON.stringify(companyDraft) !== JSON.stringify(company));
  const [showContactForm, setShowContactForm] = useState(false);
  const [editingContactId, setEditingContactId] = useState(null);
  const [contactDraft, setContactDraft] = useState(emptyContactDraft);
  const contactBaselineRef = React.useRef(null);
  useEffect(() => { if (showContactForm) contactBaselineRef.current = contactDraft; }, [showContactForm]);
  useUnsavedGuard(showContactForm && contactBaselineRef.current && JSON.stringify(contactDraft) !== JSON.stringify(contactBaselineRef.current));

  function saveCompany() { onUpdateCompany(company.id, companyDraft); setEditingCompany(false); }
  function openNewContact() { setContactDraft({ ...emptyContactDraft, companyId: company.id }); setEditingContactId(null); setShowContactForm(true); }
  function openEditContact(c) { setContactDraft({ name: c.name, email: c.email, phone: c.phone || "", jobTitle: c.jobTitle || "", companyId: company.id, tags: c.tags || [], notes: c.notes || "", marketingStatus: c.marketingStatus || "Subscribed", consentSource: c.consentSource || "Manual entry", consentBasis: c.consentBasis || "Consent", consentHistory: c.consentHistory || [] }); setEditingContactId(c.id); setShowContactForm(true); }
  function submitContact() {
    if (editingContactId) onUpdateContact(editingContactId, contactDraft); else onAddContact(contactDraft);
    setShowContactForm(false);
  }

  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16 }}>
      {editingCompany ? (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          <input value={companyDraft.name} onChange={e => setCompanyDraft({ ...companyDraft, name: e.target.value })} style={{ ...inputStyle, fontSize: 13 }} placeholder="Company name" />
          <input value={companyDraft.industry} onChange={e => setCompanyDraft({ ...companyDraft, industry: e.target.value })} style={{ ...inputStyle, fontSize: 13 }} placeholder="Industry" />
          <input value={companyDraft.region} onChange={e => setCompanyDraft({ ...companyDraft, region: e.target.value })} style={{ ...inputStyle, fontSize: 13 }} placeholder="Region" />
          <input value={companyDraft.website} onChange={e => setCompanyDraft({ ...companyDraft, website: e.target.value })} style={{ ...inputStyle, fontSize: 13 }} placeholder="Website" />
          {markets && (
            <select value={companyDraft.marketId || ""} onChange={e => setCompanyDraft({ ...companyDraft, marketId: e.target.value })} style={{ ...inputStyle, fontSize: 13, gridColumn: "1 / -1" }}>
              <option value="">No target market linked</option>
              {markets.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          )}
          <textarea value={companyDraft.notes} onChange={e => setCompanyDraft({ ...companyDraft, notes: e.target.value })} rows={2} style={{ ...inputStyle, gridColumn: "1 / -1", fontSize: 12.5, resize: "vertical" }} placeholder="Notes" />
          <div style={{ gridColumn: "1 / -1", display: "flex", gap: 8 }}>
            <button onClick={saveCompany} disabled={!companyDraft.name.trim()} style={{ background: C.rose, color: "#fff", border: "none", padding: "6px 14px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Save</button>
            <button onClick={() => { setEditingCompany(false); setCompanyDraft(company); }} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "6px 14px", borderRadius: 6, fontSize: 12.5, cursor: "pointer" }}>Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div style={{ minWidth: 0, cursor: "pointer", flex: 1 }} onClick={() => setExpanded(!expanded)}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <Icon name="building" size={15} color={C.rose} />
              <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15 }}>{company.name}</span>
            </div>
            <div style={{ fontSize: 12, color: C.inkMuted, marginTop: 2 }}>{[company.industry, company.region].filter(Boolean).join(" · ")}</div>
            {company.website && <div style={{ fontSize: 11.5, color: C.teal, marginTop: 2 }}>{company.website}</div>}
            {company.marketId && markets && (() => { const m = markets.find(x => x.id === company.marketId); return m ? <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 2 }}>Target market: {m.name}</div> : null; })()}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
            <span style={{ fontSize: 11.5, color: C.inkFaint }}>{contacts.length} contact{contacts.length === 1 ? "" : "s"}</span>
            <button onClick={() => setEditingCompany(true)} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", padding: 4 }}><Icon name="pencil" size={13} /></button>
            <DeleteButton onDelete={() => onDeleteCompany(company.id)} itemName={company.name} message="This can't be undone — all contacts, activities, and tasks linked to this company will lose their company link." size={13} />
            <button onClick={() => setExpanded(!expanded)} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", padding: 4 }}><Icon name={expanded ? "chevron-up" : "chevron-down"} size={15} /></button>
          </div>
        </div>
      )}

      {expanded && !editingCompany && (
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
          {company.notes && <div style={{ fontSize: 12, color: C.inkMuted, marginBottom: 10, lineHeight: 1.5 }}>{company.notes}</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {contacts.map(c => (
              editingContactId === c.id ? (
                <ContactForm key={c.id} draft={contactDraft} setDraft={setContactDraft} onCancel={() => setShowContactForm(false)} onSubmit={submitContact} isEdit companies={companies} />
              ) : (
                <ContactRow key={c.id} contact={c} onEdit={() => openEditContact(c)} onDelete={() => onDeleteContact(c.id)} activities={activities} onAddActivity={onAddActivity} onDeleteActivity={onDeleteActivity} tasks={tasks} onAddTask={onAddTask} onUpdateTask={onUpdateTask} onDeleteTask={onDeleteTask} documents={documents} onAddDocument={onAddDocument} onDeleteDocument={onDeleteDocument} teamMembers={teamMembers} />
              )
            ))}
            {contacts.length === 0 && !showContactForm && <div style={{ fontSize: 12, color: C.inkFaint }}>No contacts yet.</div>}
          </div>
          {showContactForm && !editingContactId && <ContactForm draft={contactDraft} setDraft={setContactDraft} onCancel={() => setShowContactForm(false)} onSubmit={submitContact} companies={companies} />}
          {!showContactForm && (
            <button onClick={openNewContact} style={{ marginTop: 10, background: "none", border: `1px solid ${C.border}`, color: C.rose, padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
              <Icon name="user-plus" size={12} /> Add contact
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function AssetCard({ asset, token, onDelete }) {
  const isImage = asset.mimeType && asset.mimeType.startsWith("image/");
  const isVideo = asset.mimeType && asset.mimeType.startsWith("video/");
  const url = assetUrl(asset.id, token);
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
      <div style={{ height: 120, background: C.raised, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
        {isImage ? (
          <img src={url} alt={asset.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
        ) : isVideo ? (
          <video src={url} style={{ width: "100%", height: "100%", objectFit: "cover" }} muted />
        ) : (
          <Icon name="file-text" size={32} color={C.inkFaint} />
        )}
      </div>
      <div style={{ padding: 12 }}>

function AssetsView({ assets, addAsset, deleteAsset, token }) {

  const [error, setError] = useState("");
  const [filter, setFilter] = useState("All");

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setError("");
    try {
      await addAsset(file, category);
    } catch (err) {
      setError(err.message || "Upload failed");

    setUploading(false);
    e.target.value = "";

  const visible = filter === "All" ? assets : assets.filter(a => a.category === filter);

  return (
    <div>
      <SectionHeading>Assets</SectionHeading>
      <PageIntro>A shared library for the files your team actually needs to hand over or reuse — logos, brochures, presentations, photos, short videos.</PageIntro>

      <InfoBox>
        Files up to about <strong style={{ color: C.ink }}>4.5MB</strong> each — comfortable for documents, PDFs, images, and short clips. Longer videos won't fit here; host those elsewhere and link to them instead.
      </InfoBox>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, marginBottom: 24, maxWidth: 560 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Upload a file</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select value={category} onChange={e => setCategory(e.target.value)} style={{ ...inputStyle, width: 160 }}>
            {ASSET_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading} style={{ display: "flex", alignItems: "center", gap: 6, background: C.rose, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: uploading ? "default" : "pointer", opacity: uploading ? 0.6 : 1 }}>
            {uploading ? <Icon name="loader-2" size={14} className="spin" /> : <Icon name="upload" size={14} />}
            {uploading ? "Uploading…" : "Choose file"}
          </button>
          <input ref={fileInputRef} type="file" onChange={handleFile} style={{ display: "none" }} />
        </div>
        {error && <div style={{ fontSize: 11.5, color: "#E5484D", marginTop: 8 }}>{error}</div>}
      </div>

      {assets.length > 0 && (
        <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
          {["All", ...ASSET_CATEGORIES].map(c => (
            <button key={c} onClick={() => setFilter(c)} style={{
              background: filter === c ? `${C.rose}1F` : "none", border: `1px solid ${filter === c ? C.rose : C.border}`,
              color: filter === c ? C.rose : C.inkMuted, padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              {c}
            </button>
          ))}
        </div>
      )}

      {visible.length === 0 ? (
        <div style={{ padding: "20px 0", color: C.inkMuted, fontSize: 14 }}>{assets.length === 0 ? "No assets yet — upload your first file above." : "Nothing in this category yet."}</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 14, maxWidth: 900 }}>
          {visible.map(a => <AssetCard key={a.id} asset={a} token={token} onDelete={deleteAsset} />)}
        </div>
      )}
    </div>
  );
}

function TeamView({ teamMembers, token, tenant, onRefresh, onUpdateTenant }) {
  const [showInvite, setShowInvite] = useState(false);
  const [inviteEmail, setInviteEmail] = useState("");
  const [inviteStatus, setInviteStatus] = useState(null);
  const [inviteLoading, setInviteLoading] = useState(false);
  const [editingSelf, setEditingSelf] = useState(false);
  const [profileDraft, setProfileDraft] = useState({ personName: tenant.personName || "", role: tenant.role || "", phone: tenant.phone || "" });
  const [profileSaving, setProfileSaving] = useState(false);

  async function sendInvite() {
    if (!inviteEmail.trim()) return;
    setInviteLoading(true); setInviteStatus(null);
    try {
      const result = await apiInvite(token, inviteEmail.trim());
      setInviteStatus(result);
      if (result.emailSent) setInviteEmail("");
    } catch (err) {
      setInviteStatus({ error: err.message });
    }
    setInviteLoading(false);
  }

  async function saveProfile() {
    setProfileSaving(true);
    try {
      const updated = await apiUpdateProfile(token, profileDraft);
      onUpdateTenant(updated);
      onRefresh();
      setEditingSelf(false);
    } catch (err) {}
    setProfileSaving(false);
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 20 }}>

          <Icon name="user-plus" size={15} /> Invite teammate

          <div style={{ display: "flex", gap: 8 }}>
            <input type="email" value={inviteEmail} onChange={e => setInviteEmail(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); sendInvite(); } }} placeholder="name@company.com" style={{ ...inputStyle, flex: 1 }} autoFocus />
            <button onClick={sendInvite} disabled={inviteLoading || !inviteEmail.trim()} style={{ background: C.cyan, color: "#032430", border: "none", padding: "0 16px", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: (inviteLoading || !inviteEmail.trim()) ? "default" : "pointer", opacity: (inviteLoading || !inviteEmail.trim()) ? 0.6 : 1 }}>
              {inviteLoading ? "Sending…" : "Send invite"}

          </div>
          {inviteStatus && inviteStatus.error && <div style={{ fontSize: 11.5, color: "#E5484D", marginTop: 8 }}>{inviteStatus.error}</div>}

              <button onClick={onRefresh} style={{ background: "none", border: "none", color: C.teal, cursor: "pointer", textDecoration: "underline", padding: 0, font: "inherit", marginLeft: 4 }}>refresh</button>.
            </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, maxWidth: 460 }}>

          return (
            <div key={m.email} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>

                    <input value={profileDraft.personName} onChange={e => setProfileDraft({ ...profileDraft, personName: e.target.value })} style={{ ...inputStyle, flex: 1, fontSize: 12.5 }} placeholder="Your name" />

                  </div>

function TasksView({ tasks, contacts, companies, updateTask, deleteTask, setTab, teamMembers }) {
  const [showCompleted, setShowCompleted] = useState(false);
  const [ownerFilter, setOwnerFilter] = useState("");
  function contactFor(t) { return contacts.find(c => c.id === t.contactId); }
  function companyFor(t) {
    const c = contactFor(t);
    return c && c.companyId ? companies.find(co => co.id === c.companyId) : null;
  }
  function ownerName(email) {
    const m = teamMembers && teamMembers.find(x => x.email === email);
    return m ? (m.personName || m.email) : email;
  }
  const visible = tasks.filter(t => (showCompleted || !t.completed) && (!ownerFilter || t.ownerEmail === ownerFilter))
    .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  const overdueCount = tasks.filter(t => !t.completed && t.dueDate && t.dueDate < todayISO()).length;

  return (
    <div>
      <SectionHeading>Tasks</SectionHeading>
      <PageIntro>Every follow-up and reminder logged against a contact, in one place — so nobody quietly falls through the cracks.</PageIntro>
      {overdueCount > 0 && (
        <div style={{ background: "#E5484D14", border: "1px solid #E5484D", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 12.5, color: C.inkMuted, maxWidth: 640 }}>
          <strong style={{ color: "#E5484D" }}>{overdueCount} overdue task{overdueCount === 1 ? "" : "s"}</strong> — shown first below.
        </div>
      )}
      <div style={{ marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={() => setShowCompleted(!showCompleted)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "5px 12px", borderRadius: 6, fontSize: 11.5, cursor: "pointer" }}>
          {showCompleted ? "Hide completed" : "Show completed"}
        </button>
        {teamMembers && teamMembers.length > 0 && (
          <select value={ownerFilter} onChange={e => setOwnerFilter(e.target.value)} style={{ ...inputStyle, fontSize: 11.5, padding: "5px 8px", width: 180 }}>
            <option value="">Everyone</option>
            {teamMembers.map(m => <option key={m.email} value={m.email}>{m.personName || m.email}</option>)}
          </select>
        )}
      </div>
      {visible.length === 0 ? (
        <div style={{ padding: "20px 0", color: C.inkMuted, fontSize: 14 }}>No tasks yet — add one from a contact's detail view under <button onClick={() => setTab("companies")} style={{ background: "none", border: "none", color: C.rose, cursor: "pointer", textDecoration: "underline", padding: 0, font: "inherit" }}>Companies</button>.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxWidth: 720 }}>
          {visible.map(t => {
            const contact = contactFor(t);
            const company = companyFor(t);
            const overdue = !t.completed && t.dueDate && t.dueDate < todayISO();
            return (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, background: C.surface, border: `1px solid ${overdue ? "#E5484D" : C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                <input type="checkbox" checked={t.completed} onChange={() => updateTask(t.id, { completed: !t.completed })} style={{ cursor: "pointer" }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, color: t.completed ? C.inkFaint : C.ink, textDecoration: t.completed ? "line-through" : "none" }}>{t.title}</div>
                  <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 2 }}>
                    {contact ? contact.name : "Unknown contact"}{company ? ` · ${company.name}` : ""} · <span style={{ color: overdue ? "#E5484D" : C.inkFaint }}>{overdue ? "overdue " : "due "}{formatDate(t.dueDate)}</span>{t.ownerEmail ? ` · ${ownerName(t.ownerEmail)}` : ""}
                  </div>
                </div>
                <DeleteButton onDelete={() => deleteTask(t.id)} itemName={t.title} size={13} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function LeadsView({ leads, campaigns, addLead, updateLead, deleteLead, currency, contacts, companies, token, teamMembers }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(emptyLeadDraft);

  function openNew() { setDraft(emptyLeadDraft); setEditingId(null); setShowForm(true); }
  function openEdit(l) { setDraft({ name: l.name, company: l.company, email: l.email, value: l.value, stage: l.stage, source: l.source, campaignId: l.campaignId || "", notes: l.notes || "" }); setEditingId(l.id); setShowForm(true); }
  function submit() {
    if (!draft.name.trim()) return;
    if (editingId) updateLead(editingId, draft); else addLead({ ...draft, createdDate: todayISO() });
    setShowForm(false);
  }
  function advance(lead) {
    const idx = LEAD_STAGES.indexOf(lead.stage);
    const next = lead.stage === "Proposal" ? "Won" : LEAD_STAGES[Math.min(idx + 1, 3)];
    updateLead(lead.id, { stage: next });
  }
  function markLost(lead) { updateLead(lead.id, { stage: "Lost" }); }

  const openLeads = leads.filter(l => l.stage !== "Won" && l.stage !== "Lost");
  const won = leads.filter(l => l.stage === "Won");
  const lost = leads.filter(l => l.stage === "Lost");
  const pipelineValue = openLeads.reduce((s, l) => s + (Number(l.value) || 0), 0);
  const wonValue = won.reduce((s, l) => s + (Number(l.value) || 0), 0);
  const closedCount = won.length + lost.length;
  const conversionRate = closedCount > 0 ? ((won.length / closedCount) * 100).toFixed(0) : null;
  const avgDeal = leads.length > 0 ? Math.round(leads.reduce((s, l) => s + (Number(l.value) || 0), 0) / leads.length) : 0;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 28 }}>
        <SectionHeading>Leads</SectionHeading>
        <button onClick={openNew} style={{ display: "flex", alignItems: "center", gap: 6, background: C.rose, color: "#fff", border: "none", padding: "9px 16px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
          <Icon name="plus" size={15} /> New lead
        </button>
      </div>
      <PageIntro>Leads tracks prospects from first contact through to a closed sale. Attribute each one to the campaign that brought it in, move it through the pipeline, and see which channels are actually converting.</PageIntro>

      {leads.length === 0 && !showForm ? (
        <div style={{ padding: "40px 0", color: C.inkMuted, fontSize: 14 }}>No leads yet. Add one manually, or attribute one to a campaign as enquiries come in.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 30 }}>
          <StatTile label="Open pipeline value" value={formatMoney(pipelineValue, currency)} />
          <StatTile label="Won value" value={formatMoney(wonValue, currency)} />
          <StatTile label="Win rate" value={conversionRate !== null ? `${conversionRate}%` : "—"} />
          <StatTile label="Avg deal value" value={formatMoney(avgDeal, currency)} />
        </div>
      )}

      {showForm && <LeadForm draft={draft} setDraft={setDraft} campaigns={campaigns} onCancel={() => setShowForm(false)} onSubmit={submit} isEdit={!!editingId} contacts={contacts} companies={companies} currency={currency} teamMembers={teamMembers} />}

      {leads.length > 0 && (
        <div style={{ display: "flex", gap: 14, overflowX: "auto", paddingBottom: 8 }}>
          {LEAD_STAGES.map(stage => {
            const stageLeads = leads.filter(l => l.stage === stage);
            return (
              <div key={stage} style={{ minWidth: 220, flex: "1 0 220px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: leadStageColor(stage), display: "inline-block" }}></span>
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: C.inkMuted }}>{stage}</span>
                  <span style={{ fontSize: 11, color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{stageLeads.length}</span>
                </div>
                {stageLeads.length === 0 ? (
                  <div style={{ fontSize: 11.5, color: C.inkFaint, padding: "8px 0" }}>—</div>
                ) : (
                  stageLeads.map(l => (
                    <LeadCard key={l.id} lead={l} campaigns={campaigns} onAdvance={advance} onLost={markLost} onEdit={openEdit} onDelete={deleteLead} currency={currency} token={token} onUpdateLead={updateLead} teamMembers={teamMembers} />
                  ))
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [mode, setMode] = useState("login"); // login | forgot | forgotSent
  const [forgotEmail, setForgotEmail] = useState("");
  const [forgotLoading, setForgotLoading] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!email.trim() || !password) return;
    setError("");
    setLoading(true);
    try {
      const result = await apiLogin(email.trim(), password);
      onLogin(result);
    } catch (err) {
      setError(err.message || "Login failed");
      setLoading(false);
    }
  }

  async function submitForgot(e) {
    e.preventDefault();
    if (!forgotEmail.trim()) return;
    setForgotLoading(true);
    try {
      await apiForgotPassword(forgotEmail.trim());
      setMode("forgotSent");
    } catch (err) {
      // still show the generic confirmation — never reveal whether the email exists
      setMode("forgotSent");
    }
    setForgotLoading(false);
  }

  if (mode === "forgot" || mode === "forgotSent") {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, padding: 20 }}>
        <div style={{ width: 360, maxWidth: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 28 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
            <Mark />
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, fontWeight: 700, color: C.ink }}>Vi-SOCEX</div>
          </div>
          {mode === "forgot" ? (
            <React.Fragment>
              <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 20 }}>Enter your email and we'll send you a link to reset your password.</div>
              <form onSubmit={submitForgot}>
                <Field label="Email">
                  <input type="email" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} style={{ ...inputStyle, width: "100%" }} placeholder="you@company.com" autoFocus />
                </Field>
                <button type="submit" disabled={forgotLoading || !forgotEmail.trim()} style={{
                  marginTop: 18, width: "100%", background: C.cyan, color: "#032430", border: "none", padding: "10px 18px", borderRadius: 7,
                  fontSize: 14, fontWeight: 600, cursor: (forgotLoading || !forgotEmail.trim()) ? "default" : "pointer",
                  opacity: (forgotLoading || !forgotEmail.trim()) ? 0.6 : 1 }}>
                  {forgotLoading ? "Sending…" : "Send reset link"}
                </button>
              </form>
              <button onClick={() => setMode("login")} style={{ marginTop: 14, background: "none", border: "none", color: C.inkFaint, fontSize: 12.5, cursor: "pointer", padding: 0 }}>← Back to sign in</button>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div style={{ fontSize: 13, color: C.ink, lineHeight: 1.6 }}>If an account exists for that email, we've sent a link to reset the password. Check your inbox.</div>
              <button onClick={() => setMode("login")} style={{ marginTop: 18, background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "8px 16px", borderRadius: 7, fontSize: 13, cursor: "pointer" }}>Back to sign in</button>
            </React.Fragment>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, padding: 20 }}>
      <form onSubmit={submit} style={{ width: 360, maxWidth: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 28 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <Mark />
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, fontWeight: 700, color: C.ink }}>Vi-SOCEX</div>
        </div>
        <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 20 }}>Sign in to your workspace.</div>
        <Field label="Email">
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} style={{ ...inputStyle, width: "100%" }} placeholder="you@company.com" autoFocus />
        </Field>
        <div style={{ marginTop: 12 }}>
          <Field label="Password">
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, width: "100%" }} placeholder="••••••••" />
          </Field>
        </div>
        <div style={{ marginTop: 8, textAlign: "right" }}>
          <button type="button" onClick={() => { setMode("forgot"); setForgotEmail(email); }} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 12, cursor: "pointer", padding: 0 }}>Forgot password?</button>
        </div>
        {error && <div style={{ fontSize: 12.5, color: "#E5484D", marginTop: 12 }}>{error}</div>}
        <button type="submit" disabled={loading || !email.trim() || !password} style={{
          marginTop: 18, width: "100%", background: C.cyan, color: "#032430", border: "none", padding: "10px 18px", borderRadius: 7,
          fontSize: 14, fontWeight: 600, cursor: (loading || !email.trim() || !password) ? "default" : "pointer",
          opacity: (loading || !email.trim() || !password) ? 0.6 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          {loading && <Icon name="loader-2" size={14} className="spin" color="#032430" />}
          {loading ? "Signing in…" : "Sign in"}
        </button>
      </form>
    </div>
  );
}

    apiValidateInvite(token)

      .catch(err => { setError(err.message); setStatus("error"); });

  async function submit(e) {
    e.preventDefault();
    if (password.length < 8) { setError("Password needs to be at least 8 characters."); return; }
    if (password !== confirmPassword) { setError("Passwords don't match."); return; }
    setError(""); setStatus("submitting");

      const result = await apiAcceptInvite(token, password);
      onDone(result);
    } catch (err) {
      setError(err.message || "Couldn't set up your account.");

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <Mark />
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, fontWeight: 700, color: C.ink }}>Vi-SOCEX</div>

              opacity: (status === "submitting" || !password || !confirmPassword) ? 0.6 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {status === "submitting" && <Icon name="loader-2" size={14} className="spin" color="#032430" />}
              {status === "submitting" ? "Setting up…" : "Set password & sign in"}

  const [confirmPassword, setConfirmPassword] = useState("");

  useEffect(() => {
    apiValidateReset(token)
      .then(data => { setEmail(data.email); setStatus("ready"); })
      .catch(err => { setError(err.message); setStatus("error"); });
  }, [token]);

  async function submit(e) {
    e.preventDefault();
    if (password.length < 8) { setError("Password needs to be at least 8 characters."); return; }
    if (password !== confirmPassword) { setError("Passwords don't match."); return; }
    setError(""); setStatus("submitting");
    try {
      await apiResetPassword(token, password);
      setStatus("done");
    } catch (err) {
      setError(err.message || "Couldn't reset your password.");

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, padding: 20 }}>

              marginTop: 18, width: "100%", background: C.cyan, color: "#032430", border: "none", padding: "10px 18px", borderRadius: 7,
              fontSize: 14, fontWeight: 600, cursor: (status === "submitting" || !password || !confirmPassword) ? "default" : "pointer",

              {status === "submitting" && <Icon name="loader-2" size={14} className="spin" color="#032430" />}
              {status === "submitting" ? "Saving…" : "Reset password"}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

function Root() {
  const [token, setTokenState] = useState(() => getSessionToken());
  const [tenant, setTenant] = useState(null);
  const [checking, setChecking] = useState(true);
  const [pendingProfile, setPendingProfile] = useState(null); // {token, tenant} while profile setup is shown

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const t = getSessionToken();
      if (!t) { if (!cancelled) setChecking(false); return; }
      try {
        const data = await apiMe(t);
        if (!cancelled) { setTenant(data.tenant); setTokenState(t); }
      } catch (e) {
        try { localStorage.removeItem("visocex_session_token"); } catch (e2) {}
        if (!cancelled) setTokenState(null);
      }
      if (!cancelled) setChecking(false);
    })();
    return () => { cancelled = true; };
  }, []);

  function handleLogin(result) {
    try { localStorage.setItem("visocex_session_token", result.token); } catch (e) {}
    setTokenState(result.token);
    setTenant(result.tenant);
  }
  function handleLogout() {
    apiLogout(token);
    try { localStorage.removeItem("visocex_session_token"); } catch (e) {}
    setTokenState(null);
    setTenant(null);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const inviteToken = urlParams.get("invite");
  const resetToken = urlParams.get("reset");

  if (pendingProfile) {
    return <ProfileSetupScreen token={pendingProfile.token} tenant={pendingProfile.tenant} onDone={updatedTenant => { const result = { token: pendingProfile.token, tenant: updatedTenant }; setPendingProfile(null); handleLogin(result); }} />;
  }

  if (inviteToken) {
    return <AcceptInviteScreen token={inviteToken} onDone={result => {
      if (token) apiLogout(token);
      window.history.replaceState({}, "", window.location.pathname);
      setPendingProfile(result);
    }} />;
  }
  if (resetToken) {
    return <ResetPasswordScreen token={resetToken} onDone={() => { window.history.replaceState({}, "", window.location.pathname); window.location.reload(); }} />;
  }

  if (checking) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, color: C.inkMuted, fontFamily: "'Inter', sans-serif", fontSize: 14 }}>
        <Icon name="loader-2" size={18} className="spin" color={C.inkMuted} />
        <span style={{ marginLeft: 10 }}>Checking your session…</span>
      </div>
    );
  }

  if (!token || !tenant) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return <App tenant={tenant} onLogout={handleLogout} token={token} onUpdateTenant={setTenant} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
