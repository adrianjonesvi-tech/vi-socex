          <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 12 }}>No colors found? Add them directly in the Colors section below — this only covers tone, fonts, and rules.</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={saveGapAnswers} style={{ background: C.amber, color: "#3D2A00", border: "none", padding: "7px 14px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Save details</button>
            <button onClick={() => setGaps(null)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 6, fontSize: 12.5, cursor: "pointer" }}>Skip</button>
          </div>
        </div>
      )}

      {sources.length > 0 && (
        <div style={{ maxWidth: 640, marginBottom: 28 }}>
          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Reference files</h3>
          <div style={{ fontSize: 11.5, color: C.inkMuted, marginBottom: 10 }}>Every document, paste, or website scan used to build this profile — kept for reference, not just used once and discarded.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {sources.map(s => (
              <div key={s.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Icon name={s.type === "website" ? "globe" : s.type === "paste" ? "pen-square" : "package"} size={13} color={C.inkFaint} />
                  <div style={{ flex: 1, fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.label}</div>
                  <div style={{ fontSize: 10.5, color: C.inkFaint, flexShrink: 0 }}>{formatDate(s.date)}</div>
                  <button onClick={() => setExpandedSource(expandedSource === s.id ? null : s.id)} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted, flexShrink: 0 }}>
                    <Icon name={expandedSource === s.id ? "chevron-up" : "chevron-down"} size={14} />
                  </button>
                  <DeleteButton onDelete={() => removeSource(s.id)} itemName={s.label || "this source"} iconName="x" style={{ color: C.inkFaint, flexShrink: 0 }} size={13} />
                </div>
                {expandedSource === s.id && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}`, fontSize: 11.5, color: C.inkMuted, lineHeight: 1.5, maxHeight: 180, overflowY: "auto", whiteSpace: "pre-wrap" }}>{s.text}</div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ maxWidth: 640 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Logo</h3>
        <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 28 }}>
          <div style={{ width: 64, height: 64, borderRadius: 10, background: C.raised, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", flexShrink: 0 }}>
            {brand.logoDataUrl ? <img src={brand.logoDataUrl} alt="Logo" style={{ width: "100%", height: "100%", objectFit: "contain" }} /> : <Icon name="package" size={22} color={C.inkFaint} />}
          </div>
          <div>
            <input ref={logoInputRef} type="file" accept="image/*" onChange={handleLogo} style={{ display: "none" }} />
            <button onClick={() => logoInputRef.current && logoInputRef.current.click()} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
              {brand.logoDataUrl ? "Replace logo" : "Upload logo"}
            </button>
            {brand.logoDataUrl && (
              <DeleteButton onDelete={() => setBrand({ ...brand, logoDataUrl: "" })} itemName="your logo" label="Remove" message="This can't be undone — you'll need to upload it again if you want it back, and anywhere it's previewed (like the Brand preview pane) will show nothing until you do." style={{ marginLeft: 10 }} />
            )}
          </div>
        </div>

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Brand assets</h3>
        <div style={{ fontSize: 12, color: C.inkFaint, marginBottom: 14, lineHeight: 1.5 }}>
          Store business card layouts, letterheads, slide backgrounds, pitch deck templates, or logo variants here — anything beyond the primary logo that a pitch deck, print job, or e-business card might need to pull from later.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
          <input value={assetLabel} onChange={e => setAssetLabel(e.target.value)} style={{ ...inputStyle, flex: "1 1 220px" }} placeholder='Name this asset, e.g. "Business card — front"' />
          <select value={assetCategory} onChange={e => setAssetCategory(e.target.value)} style={{ ...inputStyle, flex: "0 0 auto" }}>
            {BRAND_ASSET_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
          </select>
        </div>
        <input ref={assetInputRef} type="file" accept=".png,.jpg,.jpeg,.pdf" onChange={handleAssetUpload} style={{ display: "none" }} />
        <button onClick={() => assetInputRef.current && assetInputRef.current.click()} disabled={assetLoading}
          style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "7px 14px", borderRadius: 7, fontSize: 12.5, fontWeight: 600, cursor: assetLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
          <Icon name={assetLoading ? "loader-2" : "package"} size={13} className={assetLoading ? "spin" : ""} />
          {assetLoading ? "Adding…" : "Add asset"}
        </button>
        <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 8 }}>.png, .jpg, .pdf</div>
        {assetError && <div style={{ fontSize: 12, color: "#E5484D", marginBottom: 8 }}>{assetError}</div>}
        {assets.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10, marginBottom: 28 }}>
            {assets.map(a => (
              <div key={a.id} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: 10, position: "relative" }}>
                <DeleteButton onDelete={() => removeAsset(a.id)} itemName={a.label || "this asset"} iconName="x" style={{ position: "absolute", top: 6, right: 6, background: "rgba(0,0,0,0.5)", borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", zIndex: 1 }} size={11} />
                <div style={{ width: "100%", height: 80, borderRadius: 6, background: C.surface, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", marginBottom: 8 }}>
                  {a.mediaType.startsWith("image/") ? <img src={a.dataUrl} alt={a.label} style={{ width: "100%", height: "100%", objectFit: "contain" }} /> : <Icon name="package" size={22} color={C.inkFaint} />}
                </div>
                <div style={{ fontSize: 11.5, fontWeight: 600, marginBottom: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.label}</div>
                <div style={{ fontSize: 10, color: C.inkFaint }}>{a.category}</div>
              </div>
            ))}
          </div>
        )}
        {assets.length === 0 && <div style={{ marginBottom: 28 }} />}

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Colors</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
          {brand.colors.map((c, i) => <ColorSwatchRow key={i} color={c} onChange={next => updateColor(i, next)} onRemove={() => removeColor(i)} />)}
        </div>
        <button onClick={addColor} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "6px 14px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: 28 }}>+ Add color</button>

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Typography</h3>
        <div style={{ display: "flex", gap: 12, marginBottom: 28 }}>
          <Field label="Heading font"><input value={brand.headingFont} onChange={e => setBrand({ ...brand, headingFont: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Space Grotesk" /></Field>
          <Field label="Body font"><input value={brand.bodyFont} onChange={e => setBrand({ ...brand, bodyFont: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Inter" /></Field>
        </div>

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Tone of voice</h3>
        <div style={{ marginBottom: 28 }}>
          <ToneOfVoicePicker brand={brand} setBrand={setBrand} />
        </div>

        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Brand rules</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {brand.rules.map((r, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px" }}>
              <div style={{ flex: 1, fontSize: 12.5 }}>{r}</div>
              <DeleteButton onDelete={() => removeRule(i)} itemName="this brand rule" iconName="x" size={13} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={newRule} onChange={e => setNewRule(e.target.value)} style={{ ...inputStyle, flex: 1 }} placeholder="e.g. Never use the logo on a busy background"
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addRule(); } }} />
          <button onClick={addRule} style={{ background: "none", border: `1px solid ${C.border}`, padding: "0 16px", borderRadius: 6, color: C.ink, cursor: "pointer" }}>Add rule</button>
        </div>
      </div>
    </div>
    <BrandPreviewPane brand={brand} />
    </div>
  );
}

function QuestionnaireSurvey({ template, onSubmit, onCancel }) {
  const [step, setStep] = useState("setup");
  const [orgLevel, setOrgLevel] = useState("");
  const [teamName, setTeamName] = useState("");
  const [respondentName, setRespondentName] = useState("");
  const [qIndex, setQIndex] = useState(0);
  const [answers, setAnswers] = useState([]);
  const flat = useMemo(() => flattenQuestionnaireGroups(template.groups), [template]);
  const isInternal = template.audienceType === "internal";

  function start() {
    if (isInternal && !orgLevel) return;
    setStep("questions");
  }
  function selectOption(optionIndex) {
    const q = flat[qIndex];
    const next = [...answers];
    next[qIndex] = { groupId: q.groupId, groupName: q.groupName, topic: q.topic, text: q.text, answerLabel: q.options[optionIndex], score: optionScore(optionIndex), optionIndex };
    setAnswers(next);
  }
  function toggleMultiOption(opt) {
    const q = flat[qIndex];
    const current = answers[qIndex];
    const existing = (current && current.answerLabels) || [];
    let nextLabels;
    if (existing.includes(opt)) {
      nextLabels = existing.filter(o => o !== opt);
    } else {
      if (q.maxSelections && existing.length >= q.maxSelections) return;
      nextLabels = [...existing, opt];
    }
    const next = [...answers];
    next[qIndex] = nextLabels.length > 0 ? { groupId: q.groupId, groupName: q.groupName, topic: q.topic, text: q.text, answerLabels: nextLabels, score: null } : null;
    setAnswers(next);
  }
  function setTextAnswer(value) {
    const q = flat[qIndex];
    const next = [...answers];
    next[qIndex] = { groupId: q.groupId, groupName: q.groupName, topic: q.topic, text: q.text, answerText: value, score: null };
    setAnswers(next);
  }
  function setMatrixRating(item, scaleIndex) {
    const q = flat[qIndex];
    const current = answers[qIndex];
    const ratings = { ...((current && current.ratings) || {}), [item]: scaleIndex };
    const next = [...answers];
    next[qIndex] = { groupId: q.groupId, groupName: q.groupName, topic: q.topic, text: q.text, ratings, score: null };
    setAnswers(next);
  }
  function toggleRankItem(item) {
    const q = flat[qIndex];
    const current = answers[qIndex];
    const existing = (current && current.rankedItems) || [];
    let nextRanked;
    if (existing.includes(item)) {
      nextRanked = existing.filter(o => o !== item);
    } else {
      if (q.rankCount && existing.length >= q.rankCount) return;
      nextRanked = [...existing, item];
    }
    const next = [...answers];
    next[qIndex] = nextRanked.length > 0 ? { groupId: q.groupId, groupName: q.groupName, topic: q.topic, text: q.text, rankedItems: nextRanked, score: null } : null;
    setAnswers(next);
  }
  function goNext() { if (qIndex < flat.length - 1) setQIndex(qIndex + 1); else setStep("review"); }
  function goPrev() { if (qIndex > 0) setQIndex(qIndex - 1); }
  function submit() {
    onSubmit({ templateId: template.id, orgLevel: isInternal ? orgLevel : "", teamName: teamName.trim(), respondentName: respondentName.trim(), date: todayISO(), answers: answers.filter(Boolean) });
    setStep("complete");
  }

  if (step === "setup") {
    return (
      <div style={{ maxWidth: 520, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22 }}>
        <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 18 }}>{flat.length} questions across {template.groups.length} topics. {isInternal ? "Answers are anonymous and only used in aggregate." : "Responses are used to understand overall sentiment."}</div>
        {isInternal ? (
          <React.Fragment>
            <Field label="Your organisational level">
              <select value={orgLevel} onChange={e => setOrgLevel(e.target.value)} style={{ ...inputStyle, width: "100%" }}>
                <option value="">Select one…</option>
                {ORG_LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
              </select>
            </Field>
            <div style={{ marginTop: 12 }}>
              <Field label="Team name (optional)"><input value={teamName} onChange={e => setTeamName(e.target.value)} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Warehouse Team A" /></Field>
            </div>
          </React.Fragment>
        ) : (
          <Field label="Your name (optional)"><input value={respondentName} onChange={e => setRespondentName(e.target.value)} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Priya Shah" /></Field>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={start} disabled={isInternal && !orgLevel} style={{ background: template.color, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: (isInternal && !orgLevel) ? "default" : "pointer", opacity: (isInternal && !orgLevel) ? 0.5 : 1 }}>Start questionnaire</button>
          <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Cancel</button>
        </div>
      </div>
    );
  }

  if (step === "questions") {
    const q = flat[qIndex];
    const current = answers[qIndex];
    const qType = q.type || "single";
    const progress = Math.round(((qIndex + 1) / flat.length) * 100);
    const canProceed = qType === "text" ? true
      : qType === "matrix" ? (current && q.items.every(item => current.ratings && current.ratings[item] != null))
      : qType === "ranking" ? (current && current.rankedItems && current.rankedItems.length >= (q.rankCount || q.items.length))
      : !!current;
    return (
      <div style={{ maxWidth: 640 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: C.inkMuted, marginBottom: 6 }}>
          <span>{q.groupName} · {q.topic}</span>
          <span>{progress}%</span>
        </div>
        <div style={{ height: 4, background: C.raised, borderRadius: 2, marginBottom: 20 }}>
          <div style={{ height: 4, width: `${progress}%`, background: template.color, borderRadius: 2 }}></div>
        </div>
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22 }}>
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>{q.text}</div>

          {qType === "single" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {q.options.map((opt, i) => {
                const selected = current && current.answerLabel === opt;
                return (
                  <button key={i} onClick={() => selectOption(i)} style={{
                    textAlign: "left", padding: "10px 14px", borderRadius: 7, fontSize: 13.5, cursor: "pointer",
                    border: selected ? `1px solid ${template.color}` : `1px solid ${C.border}`,
                    background: selected ? `${template.color}1F` : "none", color: selected ? C.ink : C.inkMuted }}>
                    {opt}
                  </button>
                );
              })}
            </div>
          )}

          {qType === "multi" && (
            <div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {q.options.map((opt, i) => {
                  const selected = current && (current.answerLabels || []).includes(opt);
                  return (
                    <button key={i} onClick={() => toggleMultiOption(opt)} style={{
                      textAlign: "left", padding: "10px 14px", borderRadius: 7, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 10,
                      border: selected ? `1px solid ${template.color}` : `1px solid ${C.border}`,
                      background: selected ? `${template.color}1F` : "none", color: selected ? C.ink : C.inkMuted }}>
                      <span style={{ width: 15, height: 15, borderRadius: 4, border: `1.5px solid ${selected ? template.color : C.inkFaint}`, background: selected ? template.color : "none", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        {selected && <Icon name="check" size={10} color="#fff" />}
                      </span>
                      {opt}
                    </button>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 10 }}>
                Select all that apply{q.maxSelections ? ` — up to ${q.maxSelections}` : ""}.
              </div>
            </div>
          )}

          {qType === "text" && (
            <textarea value={(current && current.answerText) || ""} onChange={e => setTextAnswer(e.target.value)} rows={4}
              style={{ ...inputStyle, width: "100%", resize: "vertical", fontSize: 13.5 }} placeholder="Type your answer…" />
          )}

          {qType === "matrix" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {q.items.map((item, ii) => {
                const rating = current && current.ratings ? current.ratings[item] : null;
                return (
                  <div key={ii}>
                    <div style={{ fontSize: 13, marginBottom: 6, color: C.ink }}>{item}</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {q.scaleLabels.map((label, si) => {
                        const selected = rating === si;
                        return (
                          <button key={si} onClick={() => setMatrixRating(item, si)} style={{
                            padding: "6px 12px", borderRadius: 6, fontSize: 12, cursor: "pointer",
                            border: selected ? `1px solid ${template.color}` : `1px solid ${C.border}`,
                            background: selected ? `${template.color}1F` : "none", color: selected ? C.ink : C.inkMuted }}>
                            {label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {qType === "ranking" && (
            <div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {q.items.map((item, i) => {
                  const rank = current && current.rankedItems ? current.rankedItems.indexOf(item) : -1;
                  const selected = rank >= 0;
                  return (
                    <button key={i} onClick={() => toggleRankItem(item)} style={{
                      textAlign: "left", padding: "10px 14px", borderRadius: 7, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 10,
                      border: selected ? `1px solid ${template.color}` : `1px solid ${C.border}`,
                      background: selected ? `${template.color}1F` : "none", color: selected ? C.ink : C.inkMuted }}>
                      <span style={{ width: 20, height: 20, borderRadius: "50%", border: `1.5px solid ${selected ? template.color : C.inkFaint}`, background: selected ? template.color : "none", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: selected ? "#fff" : "transparent" }}>
                        {selected ? rank + 1 : "•"}
                      </span>
                      {item}
                    </button>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 10 }}>
                Click to rank your top {q.rankCount || q.items.length}, in order — click again to remove.
              </div>
            </div>
          )}

          {template.mode === "selfAssessment" && qType === "single" && current && current.optionIndex < 3 && q.advice && q.advice[current.optionIndex] && (
            <div style={{ marginTop: 14, background: C.raised, border: `1px solid ${template.color}`, borderRadius: 8, padding: "12px 14px" }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: template.color, marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.3 }}>Guidance for this answer</div>
              <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.5 }}>{q.advice[current.optionIndex]}</div>
            </div>
          )}
          <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 16, lineHeight: 1.5 }}>{q.guidance}</div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16 }}>
          <button onClick={goPrev} disabled={qIndex === 0} style={{ background: "none", border: `1px solid ${C.border}`, padding: "8px 16px", borderRadius: 7, fontSize: 13, cursor: qIndex === 0 ? "default" : "pointer", color: qIndex === 0 ? C.inkFaint : C.ink, opacity: qIndex === 0 ? 0.5 : 1 }}>Previous</button>
          <span style={{ fontSize: 12, color: C.inkFaint }}>Question {qIndex + 1} of {flat.length}</span>
          <button onClick={goNext} disabled={!canProceed} style={{ background: template.color, color: "#fff", border: "none", padding: "8px 18px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: canProceed ? "pointer" : "default", opacity: canProceed ? 1 : 0.5 }}>
            {qIndex === flat.length - 1 ? "Review" : "Next"}
          </button>
        </div>
      </div>
    );
  }

  if (step === "review") {
    return (
      <div style={{ maxWidth: 640 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700, marginBottom: 6 }}>Review your answers</h3>
        <div style={{ fontSize: 12.5, color: C.inkMuted, marginBottom: 16 }}>Check everything looks right, then submit.</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {answers.map((a, i) => a && (
            <div key={i} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
              <div style={{ fontSize: 11, color: C.inkFaint }}>{a.groupName} · {a.topic}</div>
              <div style={{ fontSize: 13, marginTop: 2 }}>
                {a.answerLabel || (a.answerLabels && a.answerLabels.join(", ")) || a.answerText
                  || (a.rankedItems && a.rankedItems.map((it, i) => `${i + 1}. ${it}`).join(" · "))
                  || (a.ratings && Object.entries(a.ratings).map(([item, idx]) => `${item}: ${(flat.find(fq => fq.groupId === a.groupId && fq.topic === a.topic) || {}).scaleLabels?.[idx] ?? idx}`).join(" · "))
                  || <span style={{ color: C.inkFaint, fontStyle: "italic" }}>(no answer)</span>}
              </div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={submit} style={{ background: template.color, color: "#fff", border: "none", padding: "9px 18px", borderRadius: 7, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>Submit questionnaire</button>
          <button onClick={() => setStep("questions")} style={{ background: "none", border: `1px solid ${C.border}`, padding: "9px 18px", borderRadius: 7, fontSize: 14, cursor: "pointer", color: C.ink }}>Back to questions</button>
        </div>
      </div>
    );
  }

  // step === "complete"
  const scored = answers.filter(a => a && a.score != null);
  const overallAvg = scored.length ? scored.reduce((s, a) => s + a.score, 0) / scored.length : null;
  const overallStatus = overallAvg == null ? null : overallAvg >= 4 ? { label: "Strong", color: C.green } : overallAvg >= 2.5 ? { label: "Developing", color: C.amber } : { label: "At Risk", color: "#E5484D" };
  const groupSummaries = template.mode === "selfAssessment" ? template.groups.map(g => {
    const gAnswers = answers.filter(a => a && a.groupId === g.id && a.score != null);
    const avg = gAnswers.length ? gAnswers.reduce((s, a) => s + a.score, 0) / gAnswers.length : null;
    return { name: g.name, avg };
  }) : [];

  if (template.mode === "selfAssessment") {
    return (
      <div style={{ maxWidth: 560 }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", background: `${template.color}22`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 12px" }}>
            <Icon name="check" size={22} color={template.color} />
          </div>
          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 18, fontWeight: 700, margin: 0 }}>Assessment complete</h3>
          {overallStatus && <div style={{ fontSize: 13, color: overallStatus.color, fontWeight: 600, marginTop: 6 }}>Overall: {overallStatus.label}</div>}
        </div>

        {groupSummaries.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
            {groupSummaries.map((g, i) => {
              const status = g.avg == null ? null : g.avg >= 4 ? C.green : g.avg >= 2.5 ? C.amber : "#E5484D";
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                  <span style={{ fontSize: 13 }}>{g.name}</span>
                  {status && <span style={{ width: 10, height: 10, borderRadius: "50%", background: status }}></span>}
                </div>
              );
            })}
          </div>
        )}

        <div style={{ background: C.surface, border: `1px solid ${template.color}`, borderRadius: 10, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.5, marginBottom: 14 }}>{template.ctaMessage || "Did you find these results useful? If you'd like to talk through next steps, we're happy to help."}</div>
          <button style={{ background: template.color, color: "#fff", border: "none", padding: "9px 20px", borderRadius: 7, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>{template.ctaButtonLabel || "Get in touch"}</button>
        </div>

        <div style={{ textAlign: "center", marginTop: 18 }}>
          <button onClick={onCancel} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 12.5, cursor: "pointer", textDecoration: "underline" }}>Done</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 480, textAlign: "center" }}>
      <div style={{ width: 48, height: 48, borderRadius: "50%", background: `${template.color}22`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
        <Icon name="check" size={22} color={template.color} />
      </div>
      <div style={{ fontSize: 14, color: C.ink, lineHeight: 1.6, marginBottom: 20 }}>{template.completionMessage || "Thank you for taking part — your involvement and responses will be collated and published as a collective set of results."}</div>
      <button onClick={onCancel} style={{ background: "none", border: `1px solid ${C.border}`, color: C.ink, padding: "8px 18px", borderRadius: 7, fontSize: 13, cursor: "pointer" }}>Done</button>
    </div>
  );
}

function QuestionnaireResults({ template, submissions, brand, setBrand, products }) {
  const avgs = questionnaireTopicAverages(template, submissions);
  const questionBreakdown = questionnaireQuestionBreakdown(template, submissions);
  const byLevel = template.audienceType === "internal" ? ORG_LEVELS.map(level => {
    const subs = submissions.filter(s => s.orgLevel === level);
    const a = questionnaireTopicAverages(template, subs);
    const overall = Object.values(a).filter(v => v != null);
    return { level, count: subs.length, overall: overall.length ? (overall.reduce((s, v) => s + v, 0) / overall.length) : null };
  }) : null;
  const suggestions = template.id === "culture" ? buildBrandSuggestionsFromCulture(submissions) : null;
  const [applied, setApplied] = useState(false);
  const linkedProducts = (products || []).filter(p => (template.productIds || []).includes(p.id));
  const [insights, setInsights] = useState(null);
  const [insightsLoading, setInsightsLoading] = useState(false);
  const [insightsError, setInsightsError] = useState("");

  function applyToBrand() {
    const newRules = suggestions.rules.filter(r => !brand.rules.includes(r));
    const newTone = suggestions.tone && !brand.tone.includes(suggestions.tone) ? (brand.tone ? `${brand.tone} ${suggestions.tone}` : suggestions.tone) : brand.tone;
    setBrand({ ...brand, tone: newTone, rules: [...brand.rules, ...newRules] });
    setApplied(true);
  }

  async function generateInsights() {
    setInsightsLoading(true); setInsightsError("");
    try {
      const topicAverages = {};
      template.groups.forEach(g => { topicAverages[g.name] = avgs[g.id]; });
      const data = await apiGenerate("questionnaire_insights", { products: linkedProducts, topicAverages, templateName: template.name });
      setInsights(data);
    } catch (err) {
      setInsightsError(err.message || "Couldn't generate insights — the AI engine may be unavailable.");
    }
    setInsightsLoading(false);
  }

  if (submissions.length === 0) {
    return <div style={{ padding: "20px 0", color: C.inkMuted, fontSize: 14 }}>No responses yet. Take the survey, or distribute it, to start collecting real data.</div>;
  }

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: byLevel ? "repeat(4, 1fr)" : "repeat(2, 1fr)", gap: 14, marginBottom: 30 }}>
        <StatTile label="Total responses" value={submissions.length} />
        {byLevel ? byLevel.map(l => <StatTile key={l.level} label={l.level} value={l.overall != null ? `${l.overall.toFixed(1)} / 5 (${l.count})` : "—"} />) : (
          (() => { const overall = Object.values(avgs).filter(v => v != null); const avg = overall.length ? overall.reduce((s, v) => s + v, 0) / overall.length : null; return <StatTile label="Overall avg score" value={avg != null ? `${avg.toFixed(1)} / 5` : "—"} />; })()
        )}
      </div>

      <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Average score by topic</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 28, maxWidth: 640 }}>
        {template.groups.map(g => (
          <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 12, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 14px" }}>
            <div style={{ flex: 1, fontSize: 13 }}>{g.name}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: avgs[g.id] == null ? C.inkFaint : avgs[g.id] >= 4 ? C.green : avgs[g.id] >= 3 ? C.amber : "#E5484D" }}>
              {avgs[g.id] != null ? `${avgs[g.id].toFixed(1)} / 5` : "—"}
            </div>
          </div>
        ))}
      </div>

      {questionBreakdown.length > 0 && (
        <div style={{ marginBottom: 28, maxWidth: 640 }}>
          <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Multi-select, ratings & open text</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {questionBreakdown.map((q, i) => (
              <div key={i} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 14 }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>{q.text}</div>
                {q.type === "multi" && (
                  q.respondentCount === 0 ? (
                    <div style={{ fontSize: 12, color: C.inkFaint }}>No responses yet.</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                      {q.tally.map(([opt, count]) => {
                        const pct = Math.round((count / q.respondentCount) * 100);
                        return (
                          <div key={opt} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ width: 160, fontSize: 11.5, color: C.inkMuted, flexShrink: 0 }}>{opt}</div>
                            <div style={{ flex: 1, height: 6, background: C.raised, borderRadius: 3, overflow: "hidden" }}>
                              <div style={{ height: "100%", width: `${pct}%`, background: template.color, borderRadius: 3 }}></div>
                            </div>
                            <div style={{ fontSize: 11, color: C.inkFaint, width: 60, textAlign: "right", flexShrink: 0 }}>{count} ({pct}%)</div>
                          </div>
                        );
                      })}
                    </div>
                  )
                )}
                {(q.type === "matrix" || q.type === "ranking") && (
                  q.respondentCount === 0 ? (
                    <div style={{ fontSize: 12, color: C.inkFaint }}>No responses yet.</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                      {q.itemStats.map((s, si) => (
                        <div key={si} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <div style={{ width: 160, fontSize: 11.5, color: C.inkMuted, flexShrink: 0 }}>{s.item}</div>
                          <div style={{ flex: 1, height: 6, background: C.raised, borderRadius: 3, overflow: "hidden" }}>
                            <div style={{ height: "100%", width: `${s.pct}%`, background: template.color, borderRadius: 3 }}></div>
                          </div>
                          <div style={{ fontSize: 11, color: C.inkFaint, width: 90, textAlign: "right", flexShrink: 0 }}>
                            {q.type === "matrix" ? (s.label || "—") : `${s.score} pts`}
                          </div>
                        </div>
                      ))}
                    </div>
                  )
                )}
                {q.type === "text" && (
                  q.responses.length === 0 ? (
                    <div style={{ fontSize: 12, color: C.inkFaint }}>No responses yet.</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {q.responses.map((r, ri) => (
                        <div key={ri} style={{ fontSize: 12.5, color: C.inkMuted, background: C.raised, borderRadius: 6, padding: "8px 10px", lineHeight: 1.5 }}>{r}</div>
                      ))}
                    </div>
                  )
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {template.id === "culture" && (
        <div style={{ background: C.raised, border: `1px solid ${C.indigo}`, borderRadius: 10, padding: 18, maxWidth: 640, marginBottom: 28 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="palette" size={14} color={C.indigo} /> Suggested for Brand
          </div>
          {suggestions.tone && <div style={{ fontSize: 12.5, color: C.inkMuted, marginBottom: 8 }}><strong style={{ color: C.ink }}>Tone:</strong> {suggestions.tone}</div>}
          {suggestions.rules.length > 0 && (
            <ul style={{ margin: "0 0 12px", paddingLeft: 18 }}>
              {suggestions.rules.map((r, i) => <li key={i} style={{ fontSize: 12.5, color: C.inkMuted, marginBottom: 4 }}>{r}</li>)}
            </ul>
          )}
          {!suggestions.tone && suggestions.rules.length === 0 && <div style={{ fontSize: 12.5, color: C.inkFaint, marginBottom: 12 }}>Not enough signal yet — collect a few more responses first.</div>}
          <button onClick={applyToBrand} disabled={!suggestions.tone && suggestions.rules.length === 0} style={{ background: C.indigo, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={applied ? "check" : "plus"} size={13} /> {applied ? "Applied to Brand" : "Apply to Brand"}
          </button>
        </div>
      )}

      {linkedProducts.length > 0 && (
        <div style={{ background: C.raised, border: `1px solid ${C.teal}`, borderRadius: 10, padding: 18, maxWidth: 640 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="package" size={14} color={C.teal} /> Product Insights
          </div>
          <div style={{ fontSize: 12, color: C.inkMuted, marginBottom: 14 }}>Linked to {linkedProducts.map(p => p.name).join(", ")}. See where these already help, or where responses point to a real gap.</div>
          <button onClick={generateInsights} disabled={insightsLoading} style={{ background: C.teal, color: "#04302A", border: "none", padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: insightsLoading ? "default" : "pointer", display: "flex", alignItems: "center", gap: 8, marginBottom: 14, opacity: insightsLoading ? 0.7 : 1 }}>
            <Icon name={insightsLoading ? "loader-2" : "pen-square"} size={13} className={insightsLoading ? "spin" : ""} />
            {insightsLoading ? "Analyzing…" : insights ? "Refresh insights" : "Generate insights"}
          </button>
          {insightsError && <div style={{ fontSize: 12.5, color: "#E5484D", marginBottom: 12 }}>{insightsError}</div>}
          {insights && (
            <div>
              {insights.opportunities.length > 0 && (
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.green, marginBottom: 8 }}>Where your products already help</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {insights.opportunities.map((o, i) => (
                      <div key={i} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                        <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 4 }}>{o.topic} · {o.product}</div>
                        <div style={{ fontSize: 12.5, color: C.inkMuted }}>{o.insight}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {insights.featureGaps.length > 0 && (
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.amber, marginBottom: 8 }}>Possible feature gaps</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {insights.featureGaps.map((g, i) => (
                      <div key={i} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 14px" }}>
                        <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 4 }}>{g.topic}</div>
                        <div style={{ fontSize: 12.5, color: C.inkMuted }}>{g.suggestion}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {insights.opportunities.length === 0 && insights.featureGaps.length === 0 && (
                <div style={{ fontSize: 12.5, color: C.inkFaint }}>No strong signal either way yet — collect more responses and try again.</div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DistributionPanel({ template, connections, leads, sends, onSend, onUpdateSend, submissions, tenantId, contacts, companies }) {
  const [audienceType, setAudienceType] = useState("email");
  const [linkCopied, setLinkCopied] = useState(false);
  const [audienceRef, setAudienceRef] = useState("");
  const [sectorFilter, setSectorFilter] = useState("");
  const [customText, setCustomText] = useState("");
  const [subject, setSubject] = useState(`You're invited: ${template.name}`);
  const [message, setMessage] = useState(`Hi there,\n\nWe'd really value your input. We've put together a short questionnaire — ${template.name} — and it should only take a few minutes.\n\n${template.description}\n\nThanks in advance,\nThe team`);
  const [sending, setSending] = useState(false);
  const [sendResult, setSendResult] = useState(null);
  const emailLists = connections.emailLists || [];
  const allContacts = contacts || [];
  const allCompanies = companies || [];
  const allTags = Array.from(new Set(allContacts.flatMap(c => c.tags || []))).sort();
  const allSectors = Array.from(new Set(allCompanies.map(co => co.industry).filter(Boolean))).sort();
  function contactSector(c) {
    const co = allCompanies.find(x => x.id === c.companyId);
    return co ? co.industry : "";
  }
  function matchesFilters(c) {
    if (SUPPRESSED_STATUSES.includes(c.marketingStatus)) return false;
    if (audienceRef && !(c.tags || []).includes(audienceRef)) return false;
    if (sectorFilter && contactSector(c) !== sectorFilter) return false;
    return true;
  }
  const shareLink = `${window.location.origin}/survey/?t=${encodeURIComponent(tenantId)}&q=${encodeURIComponent(template.id)}`;

  const customRecipients = customText.split(/[\n,]/).map(s => s.trim()).filter(Boolean);

  async function attemptRealSend(recipients, emailCandidates) {
    setSending(true); setSendResult(null);
    try {
      const fullMessage = `${message}\n\nTake the survey here: ${shareLink}`;
      const res = await fetch("/api/send-email", {
        method: "POST",
        headers: __authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ recipients: emailCandidates, subject, message: fullMessage }),
      });
      const data = await res.json();
      if (res.status === 401) setSendResult({ error: "Your session has expired — sign out and back in, then send again." });
      else if (res.status === 501) setSendResult({ needsSetup: true, message: data.error });
      else setSendResult({ sent: data.sent || [], failed: data.failed || [], skipped: data.skipped || [] });
    } catch (err) {
      setSendResult({ error: "Couldn't reach the email service — check your connection and try again." });
    }
    setSending(false);
  }

  function send() {
    if (audienceType === "custom") {
      if (customRecipients.length === 0) return;
      onSend({ templateId: template.id, date: todayISO(), audienceType, audienceLabel: customRecipients.join(", "), recipientCount: customRecipients.length, recipients: customRecipients, respondentStatus: {}, subject, message });
      attemptRealSend(customRecipients, customRecipients);
      return;
    }
    if (audienceType === "leads") {
      const recipients = leads.map(l => l.name);
      const emails = leads.map(l => l.email).filter(Boolean);
      onSend({ templateId: template.id, date: todayISO(), audienceType, audienceLabel: "All leads", recipientCount: leads.length, recipients, respondentStatus: {}, subject, message });
      attemptRealSend(recipients, emails);
      return;
    }
    if (audienceType === "tag") {
      if (!audienceRef && !sectorFilter) return;
      const matching = allContacts.filter(matchesFilters);
      const recipients = matching.map(c => c.name);
      const emails = matching.map(c => c.email).filter(Boolean);
      const labelParts = [];
      if (audienceRef) labelParts.push(`Tag: ${audienceRef}`);
      if (sectorFilter) labelParts.push(`Sector: ${sectorFilter}`);
      onSend({ templateId: template.id, date: todayISO(), audienceType, audienceLabel: labelParts.join(" · "), recipientCount: matching.length, recipients, respondentStatus: {}, subject, message });
      attemptRealSend(recipients, emails);
      return;
    }
    if (!audienceRef) return;
    const selectedList = emailLists[Number(audienceRef)];
    const recipients = selectedList ? emailListMembers(selectedList) : [];
    onSend({ templateId: template.id, date: todayISO(), audienceType, audienceLabel: selectedList ? emailListName(selectedList) : audienceRef, recipientCount: recipients.length, recipients, respondentStatus: {}, subject, message });
    attemptRealSend(recipients, recipients);
  }

  const canSend = audienceType === "custom" ? customRecipients.length > 0
    : audienceType === "leads" ? leads.length > 0
    : audienceType === "tag" ? (!!audienceRef || !!sectorFilter)
    : !!audienceRef;
  const templateSends = sends.filter(s => s.templateId === template.id);
  const templateSubmissions = submissions.filter(s => s.templateId === template.id);

  function normalizeName(s) { return (s || "").trim().toLowerCase(); }
  function isRecipientComplete(s, recipient) {
    const override = s.respondentStatus && s.respondentStatus[recipient];
    if (override != null) return override;
    const norm = normalizeName(recipient);
    return templateSubmissions.some(sub => normalizeName(sub.respondentName) === norm && norm !== "");
  }
  function toggleRecipient(s, recipient) {
    const current = isRecipientComplete(s, recipient);
    const nextStatus = { ...(s.respondentStatus || {}), [recipient]: !current };
    onUpdateSend(s.id, { respondentStatus: nextStatus });
  }

  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>Shareable link</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <div style={{ flex: 1, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: template.color, background: C.raised, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", wordBreak: "break-all" }}>{shareLink}</div>
          <button onClick={() => { navigator.clipboard.writeText(shareLink); setLinkCopied(true); setTimeout(() => setLinkCopied(false), 2000); }} style={{ flexShrink: 0, background: "none", border: `1px solid ${C.border}`, color: linkCopied ? C.green : C.inkMuted, padding: "8px 14px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
            <Icon name={linkCopied ? "check" : "link"} size={12} /> {linkCopied ? "Copied" : "Copy"}
          </button>
        </div>
        <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 8 }}>This link is live — anyone with it can take the survey without logging in, and their response is saved straight to your account.</div>
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Send to</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <ModeButton active={audienceType === "email"} onClick={() => { setAudienceType("email"); setAudienceRef(""); }}>Email list</ModeButton>
          <ModeButton active={audienceType === "tag"} onClick={() => { setAudienceType("tag"); setAudienceRef(""); setSectorFilter(""); }}>Contacts</ModeButton>
          <ModeButton active={audienceType === "leads"} onClick={() => { setAudienceType("leads"); setAudienceRef("All leads"); }}>Leads (CRM)</ModeButton>
          <ModeButton active={audienceType === "custom"} onClick={() => { setAudienceType("custom"); setAudienceRef(""); }}>Custom list</ModeButton>
        </div>
        {audienceType === "tag" && (
          (allTags.length > 0 || allSectors.length > 0) ? (
            <div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <select value={audienceRef} onChange={e => setAudienceRef(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 180 }}>
                  <option value="">Any tag</option>
                  {allTags.map(t => {
                    const count = allContacts.filter(c => (c.tags || []).includes(t)).length;
                    return <option key={t} value={t}>{t} ({count} contact{count === 1 ? "" : "s"})</option>;
                  })}
                </select>
                <select value={sectorFilter} onChange={e => setSectorFilter(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 180 }}>
                  <option value="">Any sector</option>
                  {allSectors.map(s => {
                    const count = allContacts.filter(c => contactSector(c) === s).length;
                    return <option key={s} value={s}>{s} ({count} contact{count === 1 ? "" : "s"})</option>;
                  })}
                </select>
              </div>
              {(audienceRef || sectorFilter) && (
                <div style={{ fontSize: 11.5, color: template.color, marginTop: 8, fontWeight: 600 }}>
                  {allContacts.filter(matchesFilters).length} matching contact{allContacts.filter(matchesFilters).length === 1 ? "" : "s"}
                </div>
              )}
              <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>Pulled live from Companies & Contacts — sector comes from each contact's linked company, so healthcare content never reaches a manufacturing contact and vice versa. Combine both filters for tighter targeting. Unsubscribed and suppressed contacts are always excluded, regardless of these filters.</div>
            </div>
          ) : (
            <div style={{ fontSize: 11.5, color: C.inkFaint }}>No tags or sectors yet — add tags to contacts, or an industry to their company, under Companies to create a sendable segment.</div>
          )
        )}
        {audienceType === "email" && (
          emailLists.length > 0 ? (
            <div>
              <select value={audienceRef} onChange={e => setAudienceRef(e.target.value)} style={{ ...inputStyle, width: "100%" }}>
                <option value="">Select a list…</option>
                {emailLists.map((l, i) => <option key={i} value={i}>{emailListName(l)} ({emailListMembers(l).length} member{emailListMembers(l).length === 1 ? "" : "s"})</option>)}
              </select>
              {audienceRef !== "" && emailListMembers(emailLists[Number(audienceRef)]).length === 0 && (
                <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>This list has no members yet — add some in Connections to track individual responses, or send anyway to just log the request.</div>
              )}
            </div>
          ) : (
            <div style={{ fontSize: 12.5, color: C.inkMuted }}>No email lists yet — add one in Connections first.</div>
          )
        )}
        {audienceType === "leads" && (
          <div style={{ fontSize: 12.5, color: C.inkMuted }}>{leads.length} lead{leads.length === 1 ? "" : "s"} in your CRM will receive this — tracked individually below once sent.</div>
        )}
        {audienceType === "custom" && (
          <div>
            <textarea value={customText} onChange={e => setCustomText(e.target.value)} rows={3} style={{ ...inputStyle, width: "100%", resize: "vertical" }} placeholder={"Type or paste names/emails — one per line, or comma-separated\ne.g. Jane Smith\njane@example.com, Priya Shah"} />
            <div style={{ fontSize: 11, color: C.inkFaint, marginTop: 6 }}>{customRecipients.length} recipient{customRecipients.length === 1 ? "" : "s"}{customRecipients.length > 0 ? ": " + customRecipients.join(", ") : ""}</div>
          </div>
        )}
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Message</div>
        <div style={{ marginBottom: 10 }}>
          <label style={{ fontSize: 11.5, color: C.inkMuted, display: "block", marginBottom: 4 }}>Subject</label>
          <input value={subject} onChange={e => setSubject(e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </div>
        <div>
          <label style={{ fontSize: 11.5, color: C.inkMuted, display: "block", marginBottom: 4 }}>Body</label>
          <textarea value={message} onChange={e => setMessage(e.target.value)} rows={6} style={{ ...inputStyle, width: "100%", resize: "vertical" }} />
        </div>
        <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 8 }}>Pre-filled from the questionnaire's name and description — edit however you like before sending. The shareable link above is what respondents would actually click.</div>
      </div>

      <button onClick={send} disabled={!canSend || sending} style={{ background: template.color, color: "#fff", border: "none", padding: "8px 16px", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: (canSend && !sending) ? "pointer" : "default", opacity: (canSend && !sending) ? 1 : 0.5, display: "flex", alignItems: "center", gap: 6 }}>
        <Icon name={sending ? "loader-2" : "link"} size={13} className={sending ? "spin" : ""} /> {sending ? "Sending…" : "Send now"}
      </button>

      {sendResult && sendResult.needsSetup && (
        <div style={{ marginTop: 10, fontSize: 11.5, color: C.amber, lineHeight: 1.6, maxWidth: 520 }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}><Icon name="alert-triangle" size={12} color={C.amber} />{sendResult.message}</div>
          <div style={{ color: C.inkFaint, marginTop: 4 }}>The request above was still logged in send history — this only affects whether a real email goes out.</div>
        </div>
      )}
      {sendResult && sendResult.error && (
        <div style={{ marginTop: 10, fontSize: 11.5, color: "#E5484D" }}>{sendResult.error}</div>
      )}
      {sendResult && !sendResult.needsSetup && !sendResult.error && (
        <div style={{ marginTop: 10, fontSize: 11.5, lineHeight: 1.6 }}>
          {sendResult.sent.length > 0 && <div style={{ color: C.green }}>✓ Sent to {sendResult.sent.length} recipient{sendResult.sent.length === 1 ? "" : "s"}: {sendResult.sent.join(", ")}</div>}
          {sendResult.failed.length > 0 && <div style={{ color: "#E5484D", marginTop: 4 }}>✕ Failed for {sendResult.failed.length}: {sendResult.failed.map(f => `${f.email} (${f.reason})`).join("; ")}</div>}
          {sendResult.skipped.length > 0 && <div style={{ color: C.inkFaint, marginTop: 4 }}>Skipped {sendResult.skipped.length} without a valid email address: {sendResult.skipped.join(", ")}</div>}
        </div>
      )}
      {!sendResult && (
        <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 8, lineHeight: 1.5 }}>
          Sends a real email to anyone in the list with a valid address (needs an email service connected on the backend — see below if it's not set up yet).
        </div>
      )}

      {templateSends.length > 0 && (
        <div style={{ marginTop: 24 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Who's responded</div>
          <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 12, lineHeight: 1.5 }}>
            Matched automatically against the name each respondent enters when they take it — imperfect if they type it differently, so tick or untick anyone by hand if the match looks wrong.
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {templateSends.map((s) => {
              const hasNames = (s.recipients || []).length > 0;
              const completedCount = hasNames ? s.recipients.filter(r => isRecipientComplete(s, r)).length : 0;
              return (
                <div key={s.id} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: hasNames ? 10 : 0 }}>
                    <div style={{ fontSize: 12, color: C.inkMuted }}>
                      {formatDate(s.date)} — {s.audienceType === "email" ? `Email list "${s.audienceLabel}"` : s.audienceType === "custom" ? "Custom list" : s.audienceLabel}
                      {s.recipientCount != null && ` (${s.recipientCount} recipient${s.recipientCount === 1 ? "" : "s"})`}
                    </div>
                    {hasNames && <div style={{ fontSize: 11.5, fontWeight: 700, color: completedCount === s.recipients.length ? C.green : C.inkMuted }}>{completedCount} / {s.recipients.length} completed</div>}
                  </div>
                  {s.subject && <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: hasNames ? 10 : 0 }}>Subject: {s.subject}</div>}
                  {hasNames ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      {s.recipients.map((r, ri) => {
                        const done = isRecipientComplete(s, r);
                        return (
                          <label key={ri} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, cursor: "pointer", padding: "4px 6px", borderRadius: 5 }}>
                            <input type="checkbox" checked={done} onChange={() => toggleRecipient(s, r)} style={{ accentColor: template.color, cursor: "pointer" }} />
                            <span style={{ color: done ? C.ink : C.inkMuted, textDecoration: done ? "none" : "none" }}>{r}</span>
                            {done && <Icon name="check" size={12} color={C.green} />}
                          </label>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{ fontSize: 11.5, color: C.inkFaint }}>No individual names for this send — sent to an email list, so per-person status isn't tracked here.</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function QuestionnaireTemplateView({ template, submissions, sends, connections, leads, brand, setBrand, addSubmission, addSend, updateSend, products, tenantId, contacts, companies }) {
  const [mode, setMode] = useState(submissions.length === 0 ? "survey" : "results");
  function handleSubmit(sub) {
    addSubmission(sub);
  }
  return (
    <div>
      <div style={{ fontSize: 12.5, color: C.inkMuted, marginBottom: 16, maxWidth: 640 }}>{template.description}</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <ModeButton active={mode === "results"} onClick={() => setMode("results")}>Results</ModeButton>
        <ModeButton active={mode === "survey"} onClick={() => setMode("survey")}>Take survey</ModeButton>
        <ModeButton active={mode === "distribute"} onClick={() => setMode("distribute")}>Distribute</ModeButton>
      </div>
      {mode === "survey" && <QuestionnaireSurvey key={template.id} template={template} onSubmit={handleSubmit} onCancel={() => setMode("results")} />}
      {mode === "results" && <QuestionnaireResults template={template} submissions={submissions} brand={brand} setBrand={setBrand} products={products} />}
      {mode === "distribute" && <DistributionPanel template={template} connections={connections} leads={leads} sends={sends} onSend={addSend} onUpdateSend={updateSend} submissions={submissions} tenantId={tenantId} contacts={contacts} companies={companies} />}
    </div>
  );
}

const emptyQuestionDraft = () => ({ id: uid(), topic: "", text: "", type: "single", options: ["", "", "", "N/A"], maxSelections: null, advice: ["", "", ""], items: [], scaleLabels: [], rankCount: null });
const emptyGroupDraft = () => ({ id: uid(), name: "", guidance: "", questions: [emptyQuestionDraft()] });
const emptyTemplateDraft = () => ({
  name: "", short: "", audienceType: "external", color: C.cyan, description: "", mode: "survey", groups: [emptyGroupDraft()], productIds: [],
  completionMessage: "Thank you for taking part — your involvement and responses will be collated and published as a collective set of results.",
  ctaMessage: "Did you find these results useful? If you'd like to talk through next steps, we're happy to help.",
  ctaButtonLabel: "Get in touch",
});

function QuestionnaireBuilder({ draft, setDraft, onCancel, onSave, isEdit, products }) {
  const initialDraftRef = React.useRef(draft);
  useUnsavedGuard(JSON.stringify(draft) !== JSON.stringify(initialDraftRef.current));
  function updateGroup(gi, patch) { setDraft({ ...draft, groups: draft.groups.map((g, i) => i === gi ? { ...g, ...patch } : g) }); }
  function removeGroup(gi) { setDraft({ ...draft, groups: draft.groups.filter((_, i) => i !== gi) }); }
  function addGroup() { setDraft({ ...draft, groups: [...draft.groups, emptyGroupDraft()] }); }
  function updateQuestion(gi, qi, patch) {
    const groups = draft.groups.map((g, i) => {
      if (i !== gi) return g;
      return { ...g, questions: g.questions.map((q, j) => j === qi ? { ...q, ...patch } : q) };
    });
    setDraft({ ...draft, groups });
  }
  function updateOption(gi, qi, oi, value) {
    const q = draft.groups[gi].questions[qi];
    const options = q.options.map((o, i) => i === oi ? value : o);
    updateQuestion(gi, qi, { options });
  }
  function setQuestionType(gi, qi, newType) {
    if (newType === "single") updateQuestion(gi, qi, { type: "single", options: ["", "", "", "N/A"], maxSelections: null, items: [], scaleLabels: [], rankCount: null });
    else if (newType === "multi") updateQuestion(gi, qi, { type: "multi", options: ["", ""], maxSelections: null, advice: ["", "", ""], items: [], scaleLabels: [], rankCount: null });
    else if (newType === "matrix") updateQuestion(gi, qi, { type: "matrix", options: [], maxSelections: null, advice: ["", "", ""], items: ["", ""], scaleLabels: ["Low", "Medium", "High"], rankCount: null });
    else if (newType === "ranking") updateQuestion(gi, qi, { type: "ranking", options: [], maxSelections: null, advice: ["", "", ""], items: ["", "", ""], scaleLabels: [], rankCount: 3 });
    else updateQuestion(gi, qi, { type: "text", options: [], maxSelections: null, advice: ["", "", ""], items: [], scaleLabels: [], rankCount: null });
  }
  function addItem(gi, qi) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { items: [...(q.items || []), ""] });
  }
  function removeItem(gi, qi, ii) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { items: q.items.filter((_, i) => i !== ii) });
  }
  function updateItem(gi, qi, ii, value) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { items: q.items.map((o, i) => i === ii ? value : o) });
  }
  function addScaleLabel(gi, qi) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { scaleLabels: [...(q.scaleLabels || []), ""] });
  }
  function removeScaleLabel(gi, qi, si) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { scaleLabels: q.scaleLabels.filter((_, i) => i !== si) });
  }
  function updateScaleLabel(gi, qi, si, value) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { scaleLabels: q.scaleLabels.map((o, i) => i === si ? value : o) });
  }
  function addMultiOption(gi, qi) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { options: [...q.options, ""] });
  }
  function removeMultiOption(gi, qi, oi) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { options: q.options.filter((_, i) => i !== oi) });
  }
  function updateMultiOption(gi, qi, oi, value) {
    const q = draft.groups[gi].questions[qi];
    updateQuestion(gi, qi, { options: q.options.map((o, i) => i === oi ? value : o) });
  }
  function updateAdvice(gi, qi, ai, value) {
    const q = draft.groups[gi].questions[qi];
    const advice = (q.advice || ["", "", ""]).map((a, i) => i === ai ? value : a);
    updateQuestion(gi, qi, { advice });
  }
  function removeQuestion(gi, qi) {
    const groups = draft.groups.map((g, i) => i === gi ? { ...g, questions: g.questions.filter((_, j) => j !== qi) } : g);
    setDraft({ ...draft, groups });
  }
  function addQuestion(gi) {
    const groups = draft.groups.map((g, i) => i === gi ? { ...g, questions: [...g.questions, emptyQuestionDraft()] } : g);
    setDraft({ ...draft, groups });
  }
  function toggleProduct(id) {
    const productIds = draft.productIds || [];
    setDraft({ ...draft, productIds: productIds.includes(id) ? productIds.filter(p => p !== id) : [...productIds, id] });
  }

  function isQuestionValid(q) {
    const type = q.type || "single";
    if (!q.text.trim()) return false;
    if (type === "single") return q.options[0].trim() && q.options[1].trim() && q.options[2].trim();
    if (type === "multi") return q.options.filter(o => o.trim()).length >= 2;
    if (type === "matrix") return (q.items || []).filter(o => o.trim()).length >= 2 && (q.scaleLabels || []).filter(o => o.trim()).length >= 2;
    if (type === "ranking") return (q.items || []).filter(o => o.trim()).length >= 2 && q.rankCount >= 1;
    return true; // text
  }
  const canSave = draft.name.trim() && draft.groups.length > 0 && draft.groups.every(g => g.name.trim() && g.questions.length > 0 && g.questions.every(isQuestionValid));

  return (
    <div style={{ maxWidth: 720, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 22, marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
        <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700, margin: 0 }}>{isEdit ? "Edit questionnaire" : "New questionnaire"}</h3>
        <button onClick={onCancel} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkMuted }}><Icon name="x" size={18} /></button>
      </div>

      <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
        <Field label="Name"><input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Post-Launch Survey" /></Field>
        <Field label="Short label (tab)"><input value={draft.short} onChange={e => setDraft({ ...draft, short: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Post-Launch" /></Field>
      </div>
      <div style={{ marginBottom: 12 }}>
        <Field label="Description"><input value={draft.description} onChange={e => setDraft({ ...draft, description: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="One line on who this is for and why" /></Field>
      </div>
      <div style={{ display: "flex", gap: 20, alignItems: "flex-end", marginBottom: 20 }}>
        <Field label="Audience">
          <select value={draft.audienceType} onChange={e => setDraft({ ...draft, audienceType: e.target.value })} style={inputStyle}>
            <option value="external">External (customers / prospects)</option>
            <option value="internal">Internal (staff, by org level)</option>
          </select>
        </Field>
        <Field label="Type">
          <select value={draft.mode || "survey"} onChange={e => setDraft({ ...draft, mode: e.target.value })} style={inputStyle}>
            <option value="survey">Survey — only you see results</option>
            <option value="selfAssessment">Self-assessment — respondent sees their own guidance</option>
          </select>
        </Field>
        <div>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Color</label>
          <div style={{ display: "flex", gap: 6 }}>
            {TEMPLATE_COLOR_CHOICES.map(c => (
              <button key={c.name} onClick={() => setDraft({ ...draft, color: c.hex })} title={c.name} style={{
                width: 22, height: 22, borderRadius: "50%", background: c.hex, cursor: "pointer",
                border: draft.color === c.hex ? `2px solid ${C.ink}` : "2px solid transparent" }}></button>
            ))}
          </div>
        </div>
      </div>
      {draft.mode === "selfAssessment" && (
        <div style={{ fontSize: 11, color: C.inkFaint, marginTop: -12, marginBottom: 20, lineHeight: 1.5 }}>
          The respondent will see the matching advice below as soon as they pick an answer — useful when they're assessing their own business, not answering blind.
        </div>
      )}

      <div style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>What they see when they finish</div>
        {draft.mode === "survey" ? (
          <Field label="Completion message">
            <textarea value={draft.completionMessage || ""} onChange={e => setDraft({ ...draft, completionMessage: e.target.value })} rows={2} style={{ ...inputStyle, width: "100%", resize: "vertical" }} />
          </Field>
        ) : (
          <React.Fragment>
            <Field label="Call-to-action message">
              <textarea value={draft.ctaMessage || ""} onChange={e => setDraft({ ...draft, ctaMessage: e.target.value })} rows={2} style={{ ...inputStyle, width: "100%", resize: "vertical" }} />
            </Field>
            <div style={{ marginTop: 10 }}>
              <Field label="Button label"><input value={draft.ctaButtonLabel || ""} onChange={e => setDraft({ ...draft, ctaButtonLabel: e.target.value })} style={{ ...inputStyle, width: "100%" }} /></Field>
            </div>
          </React.Fragment>
        )}
      </div>

      {products && products.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 12, color: C.inkMuted, fontWeight: 500, display: "block", marginBottom: 6 }}>Related products or services (optional)</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {products.map(p => {
              const active = (draft.productIds || []).includes(p.id);
              return (
                <button key={p.id} onClick={() => toggleProduct(p.id)} style={{
                  padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                  border: active ? `1px solid ${draft.color}` : `1px solid ${C.border}`,
                  background: active ? `${draft.color}22` : "transparent", color: active ? C.ink : C.inkMuted }}>
                  {p.name}
                </button>
              );
            })}
          </div>
          <div style={{ fontSize: 10.5, color: C.inkFaint, marginTop: 6 }}>Linking products lets Results suggest where they already help, or where responses point to a real feature gap.</div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {draft.groups.map((g, gi) => (
          <div key={g.id} style={{ background: C.raised, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 10 }}>
              <div style={{ flex: 1 }}>
                <Field label={`Topic group ${gi + 1} name`}><input value={g.name} onChange={e => updateGroup(gi, { name: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="e.g. Onboarding Experience" /></Field>
              </div>
              <DeleteButton onDelete={() => removeGroup(gi)} itemName="this group and all its questions" message="This can't be undone — every question in this group will be removed from the draft." style={{ marginTop: 20 }} size={14} />
            </div>
            <Field label="Guidance shown to respondents (optional)"><input value={g.guidance} onChange={e => updateGroup(gi, { guidance: e.target.value })} style={{ ...inputStyle, width: "100%" }} placeholder="A short prompt to help them answer honestly" /></Field>

            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
              {g.questions.map((q, qi) => {
                const qType = q.type || "single";
                return (
                <div key={q.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 7, padding: 12 }}>
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    <input value={q.topic} onChange={e => updateQuestion(gi, qi, { topic: e.target.value })} style={{ ...inputStyle, width: 140, fontSize: 12.5 }} placeholder="Topic label" />

                      <div style={{ display: "flex", gap: 6 }}>

                        <input value={q.options[1]} onChange={e => updateOption(gi, qi, 1, e.target.value)} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder="Middle answer" />

                          <input value={(q.advice || ["", "", ""])[1]} onChange={e => updateAdvice(gi, qi, 1, e.target.value)} style={{ ...inputStyle, width: "100%", fontSize: 11.5, color: C.inkMuted }} placeholder="Advice shown if they pick the middle answer (optional)" />
                          <input value={(q.advice || ["", "", ""])[2]} onChange={e => updateAdvice(gi, qi, 2, e.target.value)} style={{ ...inputStyle, width: "100%", fontSize: 11.5, color: C.inkMuted }} placeholder="Advice shown if they pick the worst answer (optional)" />

                  {qType === "multi" && (
                    <div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {q.options.map((opt, oi) => (
                          <div key={oi} style={{ display: "flex", gap: 6 }}>
                            <input value={opt} onChange={e => updateMultiOption(gi, qi, oi, e.target.value)} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder={`Option ${oi + 1}`} />
                            <DeleteButton onDelete={() => removeMultiOption(gi, qi, oi)} itemName="this option" iconName="x" size={13} />

                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 8 }}>
                        <button onClick={() => addMultiOption(gi, qi)} style={{ background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "4px 10px", borderRadius: 5, fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>+ Add option</button>
                        <input type="number" min="1" value={q.maxSelections || ""} onChange={e => updateQuestion(gi, qi, { maxSelections: e.target.value ? Number(e.target.value) : null })} style={{ ...inputStyle, width: 150, fontSize: 11.5 }} placeholder="Max selections (optional)" />
                      </div>
                    </div>
                  )}

                  {qType === "text" && (
                    <div style={{ fontSize: 11.5, color: C.inkFaint, fontStyle: "italic" }}>Respondents will get a free-text box to answer in their own words.</div>
                  )}

                  {qType === "matrix" && (
                    <div>
                      <div style={{ fontSize: 11, color: C.inkMuted, fontWeight: 600, marginBottom: 4 }}>Items to rate</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                        {(q.items || []).map((item, ii) => (
                          <div key={ii} style={{ display: "flex", gap: 6 }}>
                            <input value={item} onChange={e => updateItem(gi, qi, ii, e.target.value)} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder={`Item ${ii + 1}`} />
                            <DeleteButton onDelete={() => removeItem(gi, qi, ii)} itemName="this item" iconName="x" size={13} />
                          </div>
                        ))}
                        <button onClick={() => addItem(gi, qi)} style={{ alignSelf: "flex-start", background: "none", border: `1px solid ${C.border}`, color: C.inkMuted, padding: "4px 10px", borderRadius: 5, fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>+ Add item</button>
                      </div>
                      <div style={{ fontSize: 11, color: C.inkMuted, fontWeight: 600, marginBottom: 4 }}>Shared rating scale (low to high)</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {(q.scaleLabels || []).map((label, si) => (
                          <div key={si} style={{ display: "flex", gap: 6 }}>
                            <input value={label} onChange={e => updateScaleLabel(gi, qi, si, e.target.value)} style={{ ...inputStyle, flex: 1, fontSize: 12 }} placeholder={`Scale point ${si + 1}`} />
                            <DeleteButton onDelete={() => removeScaleLabel(gi, qi, si)} itemName="this scale point" iconName="x" size={13} />

                        ))}
